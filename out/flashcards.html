*dis-** (*apart*) + **sēmināre** (*to sow*), from **sēmen** = *seed*. Literally: scatter the seed in all directions.\n\nThat root pays off across the exam: **seminal** (an idea that seeds everything after it), **seminar** (a seed-plot for young minds), **seminary**, **inseminate**.\n\nEnglish did the same metaphor twice — *broadcast* originally meant sowing seed by hand across a wide arc, long before radio borrowed it.", "one_line": "To spread information widely, from one source to many.", "root": "sēmen, sēmināre (seed, to sow)", "root_family": ["seminal", "seminar", "seminary", "inseminate", "semen"], "confusables": ["dissemble", "dissimulate", "dissipate"], "sense_tags": ["spreading", "broadcasting", "publicizing", "information"], "register": "formal", "connotation": "neutral", "groups": [1]}, {"word": "emulate", "pos": "v.", "pron": "EM-yuh-layt", "means": "To imitate someone **in order to match or surpass them** — copying with ambition behind it.\n\nThe word carries admiration and rivalry at once. *Imitate* is neutral and can be mindless; *mimic* and *ape* are faintly insulting, suggesting a copy with nothing behind it. **Emulate** always points upward: you emulate a mentor, a champion, a predecessor — someone whose level you want to reach. Praise the copier, not mock him.\n\n(Computing has borrowed it flatly: one machine **emulating** another just means reproducing its behaviour, no ambition involved.)", "trap": "⚠️ **emulate ≠ simulate.**\n- **emulate** = actually *do what the model does*, to match it\n- **simulate** = *fake* it, or model it for study\n\nA flight simulator pretends to be a plane. An emulator genuinely runs the other machine's software.", "trick_line": "**Emulate** rhymes with **elevate** — you copy someone to rise to their level.", "trick_unpack": "The rhyme locks in the direction of the word: emulation is imitation aimed upward, at someone better than you.", "sentences": ["Successive Mughal emperors sought to **emulate** Akbar, and each fell short in a different way.", "He started waking at five and reading two books a week, trying to **emulate** his older sister."], "in_the_wild": "Playing old Nintendo or PlayStation games on a laptop means running an **emulator** — software pretending to be the original console, well enough to run its actual cartridges.", "etymology": "Latin **aemulus** = *\"rival.\"* Not \"copier\" — **rival**. Emulation was born competitive: you match your rival's feat in order to beat it. That buried rivalry is exactly what separates *emulate* from *imitate* on the exam.", "one_line": "Imitate someone in order to match or outdo them.", "root": "aemulus (rival)", "root_family": ["emulation", "emulous", "emulator"], "confusables": ["simulate", "imitate", "immolate", "ambulate"], "sense_tags": ["imitation", "admiration", "rivalry", "aspiration"], "register": "neutral", "connotation": "positive", "groups": [4]}, {"word": "enervate", "pos": "v.", "pron": "EN-er-vayt", "pron_note": "Adjective form: **enervated** / **enervating**.", "means": "To **drain of energy, strength, or vitality** — to leave something or someone limp and incapable of effort.\n\nIts trap is optical: the word looks like *energize* and means the exact opposite. Note also what kind of weakening it describes. A punch doesn't enervate you; **August heat, chronic illness, or six months of committee meetings** do. It's a slow sapping of force, usually by conditions rather than by a person, and it's a formal, written word — you'd write that a bureaucracy *enervates* a workforce, but you'd say the meeting *wiped you out*.", "trap": "⚠️ **enervate ≠ innervate.**\n- **e**nervate = *take the nerve out* — weaken\n- **in**nervate = *put nerves in* — supply an organ or muscle with nerves (medical)\n\nOne prefix apart, near-opposite in effect.", "trick_line": "It opens like **energy** — but the **e-** is **ex-**, so the energy goes *out*.", "trick_unpack": "Same first four letters as *energize*, opposite direction of travel, and the draining is gradual rather than sudden.", "sentences": ["The humidity of the delta enervated the garrison long before any enemy reached it.", "Three hours of onboarding slides left the whole team enervated and useless for the rest of the day."], "etymology": "Latin **ex-** (*out*) + **nervus** (*sinew, tendon*) — literally *\"to cut the sinews out.\"* To a Roman, *nervus* meant sinew before it meant nerve, so enervating an enemy meant hamstringing him: still standing, no longer able to push.\n\nSame root: **nerve, nervous, unnerve, innervate**.", "one_line": "To drain of energy and vitality; to weaken gradually.", "root": "nervus (sinew, tendon)", "root_family": ["nerve", "nervous", "unnerve", "innervate"], "confusables": ["innervate", "energize", "invigorate"], "sense_tags": ["weakening", "fatigue", "loss-of-vitality", "debilitation"], "register": "formal", "connotation": "negative", "groups": [4]}, {"word": "ephemeral", "pos": "adj.", "pron": "uh-FEM-uh-ruhl", "means": "Lasting a very short time; here and then gone.\n\nCompare the neighbours: **temporary** is administrative (a temporary badge), **transient** is clinical or technical (a transient fault), **fleeting** is emotional (a fleeting glance). **Ephemeral** is the literary one, and it usually carries a hint of admiration — the shortness is part of what makes the thing lovely. Cherry blossom, a sunset, a mood, internet fame. It also has a hard technical life in engineering (ephemeral storage, ephemeral keys, ephemeral containers), where it means *short-lived by design, don't rely on it*.", "trap": "⚠️ **ephemeral ≠ ethereal.**\n- **ephemeral** = short-lived (about **time**)\n- **ethereal** = delicate, airy, otherworldly (about **texture**)\n\nA voice can be ethereal for three hours. That performance was ethereal, not ephemeral.", "trick_line": "**Ephemeral doesn't complain about the brevity — it admires it.**", "trick_unpack": "You call a rival's fame ephemeral to belittle it, but you call blossom ephemeral to praise it — the word leans wistful, not dismissive.", "sentences": ["The exhibition collected the **ephemeral** matter of a city — tickets, handbills, receipts — none of it meant to survive the week it was printed.", "Don't get attached to that job title, mate, it's **ephemeral** — they reorg every six months."], "in_the_wild": "Instagram and Snapchat **Stories** vanish after 24 hours — the tech press literally calls it *ephemeral content*, and the Greek root means \"lasting a day.\" The product and the etymology agree to the hour.", "etymology": "Greek **epi** (*for*) + **hēmera** (*day*) = **ephēmeros**, \"lasting one day.\"\n\nSame root elsewhere: **ephemera** (tickets, flyers — printed matter never meant to be kept) and **ephemeris** (the day-by-day table of where the planets will be). And the mayfly's order is **Ephemeroptera** — the insect that famously gets one day of adult life.", "one_line": "Lasting a very short time; fleeting, often beautifully so.", "root": "hēmera (day)", "root_family": ["ephemera", "ephemeris", "Ephemeroptera"], "confusables": ["ethereal", "empyreal", "ephemera"], "sense_tags": ["fleeting", "short-lived", "transient", "impermanent"], "register": "literary", "connotation": "neutral", "groups": [4]}, {"word": "equivocate", "pos": "v.", "pron": "ih-KWIV-uh-kayt", "means": "To speak **deliberately ambiguously** in order to avoid committing yourself, conceal the truth, or leave yourself an escape hatch.\n\nThe key is that it isn't a lie. A liar says something false; an equivocator says something *technically defensible* that he knows you will read the wrong way. That's why the charge stings — it accuses you of both cowardice and calculation at once. The word is almost always hostile: nobody describes their own answer as equivocating.", "trap": "⚠️ **equivocate ≠ vacillate.**\n- **equivocate** = waver in your **words** — say something slippery on purpose\n- **vacillate** = waver in your **mind** — genuinely can't decide\n\nA vacillator is indecisive. An equivocator has decided — to say nothing pinned down.", "trick_line": "You already know **unequivocal** — \"no room for doubt.\" Equivocate is what's left when you take the *un-* off: the room for doubt, left in on purpose.", "trick_unpack": "Everyone offers *unequivocal* support; the moment the support gets hedged, qualified and re-worded, you're watching someone equivocate.", "sentences": ["Pressed on whether he had authorised the payment, the minister **equivocated** for twenty minutes and conceded nothing.", "Don't **equivocate** — are you coming to the wedding or not?"], "in_the_wild": "*Macbeth* runs on this word — the drunk Porter jokes about \"an equivocator, that could swear in both the scales against either scale,\" and Macbeth dies realising the witches' promises were exactly that: true in a sense he never meant.", "etymology": "Latin **aequus** (*equal*) + **vox, vocis** (*voice*) — a statement with **two equal voices**, pointing both ways at once.\n\nThat *voc-* root is a GRE workhorse: **vocal, vociferous, vocation** (a *calling*), **evoke, revoke, provoke, unequivocal**.", "one_line": "To speak ambiguously on purpose, dodging commitment without quite lying.", "root": "aequus (equal) + vox, vocis (voice)", "root_family": ["unequivocal", "vocal", "vociferous", "vocation", "evoke", "revoke", "provoke", "equity"], "confusables": ["vacillate", "prevaricate", "equivocal", "obfuscate"], "sense_tags": ["ambiguity", "evasion", "deception", "hedging", "non-commitment"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "feasible", "pos": "adj.", "pron": "FEE-zuh-buhl", "means": "Capable of being **done** — a plan that can actually be carried out with the time, money, and materials available.\n\nThe word judges *execution*, never merit. A feasible scheme may still be pointless, unethical, or doomed; all *feasible* certifies is that the mechanics work out. It's the vocabulary of engineers, planners, and budget committees — cool, measured, faintly grudging. \"That's feasible\" is not enthusiasm; it's a green light on the arithmetic.", "trap": "⚠️ **feasible ≠ plausible.**\n- **feasible** = it can be *done* (plans, projects, routes)\n- **plausible** = it can be *believed* (excuses, theories, alibis)\n\nA plausible explanation, a feasible plan — swap them and the sentence breaks.", "trick_line": "**Feasible answers \"can we?\" — never \"should we?\"**", "trick_unpack": "A feasibility study asks whether the bridge can be built, not whether anyone wants it there.", "sentences": ["The committee concluded that a tunnel was technically **feasible** but ruinously expensive.", "Sure, we could rewrite the whole thing by Friday — it's **feasible**, just miserable."], "in_the_wild": "**Feasibility study** — the standard first phase of any construction, software, or startup project. If you've ever sat through a meeting about whether something *can* be built before anyone argues about whether it *should* be, you've met the word in its natural habitat.", "etymology": "Old French **faisable**, \"doable,\" from **faire** ← Latin **facere** = *\"to do, to make.\"*\n\nThat root is a GRE goldmine: **facile** (easily done), **factotum** (does everything), **efficacious** (gets it done), **artifice**, **benefactor**, **deficient**, **feat**.", "one_line": "Able to be done with the means available.", "root": "facere (to do, to make)", "root_family": ["facile", "factotum", "efficacious", "artifice", "benefactor", "deficient", "feat", "affair"], "confusables": ["plausible", "viable", "practicable", "possible"], "sense_tags": ["doable", "practical", "achievable", "workable"], "register": "neutral", "connotation": "neutral", "groups": [1]}, {"word": "fervid", "pos": "adj.", "pron": "FER-vid", "means": "Burning with feeling — passionate, zealous, emotionally **hot**.\n\nTemperature is the whole point: this is feeling at boiling point, not warm conviction. And *fervid* usually runs a degree too hot — a fervid speech, a fervid admirer, a fervid nationalism all hint that the intensity has outrun the judgement. Writers reach for it when they want passion described from the outside, with an eyebrow slightly raised.", "trap": "⚠️ **fervid vs. fervent** — same root, different heat.\n- **fervent** = sincere, deeply felt (*a fervent hope*) — warm, and always approving\n- **fervid** = feverishly intense (*a fervid harangue*) — hot, and often a little too much\n\nNobody is worried about your fervent prayers. Your fervid ones, maybe.", "trick_line": "**Fervid** keeps company with the hot **-id** crowd: *torrid, rabid, avid, livid.*", "trick_unpack": "Every word in that gang is an emotion dialled past comfortable, which is exactly the excess *fervid* carries and *fervent* doesn't.", "sentences": ["His **fervid** denunciation of the committee ran forty minutes and persuaded no one.", "She's a **fervid** Oasis fan — one wrong word about Liam and you've lost the evening."], "etymology": "Latin **fervēre** = *\"to boil, to seethe.\"* The root still bubbles through **fervour**, **fervent**, **ferment**, and **effervescent** — literally *boiling out*, which is what a fizzing drink and a fervid speaker are both doing.\n\n🚫 **Not related to *fever*.** That's Latin *febris* (giving *febrile*). The sound rhyme is a coincidence — a useful one, since the meanings happen to overlap.", "one_line": "Burning with intense, slightly overheated feeling.", "root": "fervēre (to boil)", "root_family": ["fervent", "fervour", "ferment", "effervescent", "perfervid"], "confusables": ["fervent", "fetid", "fervour", "perfervid", "febrile"], "sense_tags": ["passionate", "zealous", "intense", "emotional-heat", "excessive"], "register": "literary", "connotation": "depends", "groups": [4]}, {"word": "flout", "pos": "v.", "pron": "FLOWT", "means": "To **break a rule, law, or convention openly and contemptuously** — not merely to disobey, but to show you don't care who sees.\n\nBreaking a rule quietly is cheating; **flouting** it is a statement. The word carries an audience and a sneer: the offender treats the rule, and the authority behind it, as beneath respect. Journalists and judges reach for it precisely because it assigns attitude — \"flouted the sanctions\" implies defiance, where \"violated the sanctions\" states only fact. It takes a rule-shaped object: laws, norms, curfews, conventions — never a person.", "trap": "⚠️ **flout ≠ flaunt.**\n- **flout** = *defy* the rule\n- **flaunt** = *show off* what you have\n\nYou flaunt your wealth; you flout the tax code. \"Flaunting the law\" is the commonest misuse of either word — and the GRE knows it.", "trick_line": "**flOUT** — you can't do it in secret; it has to be **out** in the open.", "trick_unpack": "Sneaking around a rule is just cheating, while flouting it is defiance staged where everyone can see.", "sentences": ["The regime continued to **flout** the terms of the treaty, testing missiles in plain view of the inspectors.", "He **flouted** the dress code so hard he showed up to the wedding in flip-flops."], "one_line": "To break a rule openly and with contempt.", "root_family": [], "confusables": ["flaunt", "tout"], "sense_tags": ["defiance", "disobedience", "contempt", "rule-breaking"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "garrulous", "pos": "adj.", "pron": "GA-ruh-luhs", "means": "Excessively talkative — rambling on, usually about trivial things, usually past the point anyone wanted.\n\nThe word judges. **Loquacious** is neutral, even admiring: a fluent, easy talker. **Voluble** is fast and unstoppable. **Verbose** is about too many words on the page. **Garrulous** is about the *listener's* suffering — it carries a whiff of the cornered victim nodding politely, and it clings to a stock character: the old man who tells you the whole history of the fence he's leaning on.", "trap": "⚠️ **garrulous ≠ querulous.**\n- **garrulous** = talks *too much*\n- **querulous** = *complains* too much (whiny, peevish)\n\nA garrulous uncle won't stop talking; a querulous one won't stop grumbling.", "trick_line": "**GARrulous — GARgle.** Both are a burble of noise coming out of a mouth that won't stop.", "trick_unpack": "Gargling is sound without content, which is exactly the complaint the word makes about the talker.", "sentences": ["The memoir is charming for eighty pages and then turns **garrulous**, circling the same three anecdotes.", "I got stuck next to the **garrulous** guy on the flight and heard about his boat for six hours."], "etymology": "Latin **garrīre** = *\"to chatter, to babble\"* — an imitative word, coined for the sound itself. The Romans applied it to the noisiest bird they knew: the jay is still **Garrulus** to this day.", "one_line": "Tiresomely talkative; rambles on about very little.", "root": "garrīre (to chatter, babble)", "root_family": ["garrulity"], "confusables": ["querulous", "garish", "gregarious"], "sense_tags": ["talkative", "rambling", "wordy", "tiresome"], "register": "formal", "connotation": "negative", "groups": [4]}, {"word": "homogeneous", "pos": "adj.", "pron": "hoh-muh-JEE-nee-us", "pron_note": "Five syllables — the **-e-** before *-ous* is sounded: *-JEE-nee-us*, not *-JEE-nus*.", "means": "Made up entirely of **the same kind of thing** — uniform in composition throughout, with no variation between the parts. Opposite of *heterogeneous*.\n\nThe word swings on context. In science and statistics it's flat description and often a virtue: a **homogeneous mixture**, a homogeneous sample, homogeneous variance. Applied to people — a homogeneous workforce, a homogeneous suburb — it becomes a quiet criticism, the polite word for *everyone here is the same*. Note also that it describes **composition, not quality**: a homogeneous group is all alike, not necessarily all good.", "trap": "⚠️ **homogeneous ≠ homogenous.**\n- **homogeneous** (hoh-muh-JEE-nee-us) = *uniform in kind* — the everyday word.\n- **homogenous** (huh-MOJ-uh-nus) = a **biology** term: similar because of **shared ancestry**.\n\nThey're one letter apart and the shorter one is widely used as a sloppy misspelling of the longer. On the GRE, write the *-e-*.", "trick_line": "**Homo- + genus = same genus** — everything in the batch is filed under one heading.", "trick_unpack": "The biologist's *genus* is literally sitting inside the word, and the missing extra **-e-** is exactly what the fake-friend *homogenous* drops.", "sentences": ["Critics faulted the shortlist as **homogeneous** — six novels, all by writers from the same two universities.", "Their playlists are weirdly **homogeneous**; every song sounds like it came off the same synth."], "in_the_wild": "The **homogenized** milk in your fridge — the fat is broken up and spread evenly so the cream never rises to the top. Same root, and you can see what it means: one uniform liquid, no separate layers.", "etymology": "Greek **homos** = *\"same\"* + **genos** = *\"kind, race.\"*\n\n*Homos* is a workhorse: **homonym** (same name), **homophone** (same sound), **homogenize**. Its partner **heteros** (*other*) gives you **heterogeneous**, **heterodox** — learn the pair and you get both halves of any GRE contrast sentence.", "one_line": "All of one kind; uniform throughout, with no variation.", "root": "homos (same) + genos (kind)", "root_family": ["homonym", "homophone", "homogenize", "homologous", "heterogeneous", "genus", "genre", "genesis"], "confusables": ["homogenous", "heterogeneous", "homologous", "homogenize"], "sense_tags": ["uniform", "same-kind", "undifferentiated", "lacking-variety", "consistent"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "humdrum", "pos": "adj. / n.", "pron": "HUM-drum", "means": "**Adj.:** dull, monotonous, lacking variety or excitement. **Noun:** dull routine itself (\"the humdrum of office life\").\n\nIt describes flatness, not agony. *Tedious* implies you're suffering through it; *banal* is a sneer at something unoriginal; *humdrum* is milder and a touch wry — the word people use about their own commute, their own chores, their own Tuesday. It's the sameness that wears you down, not any single unbearable thing, and the speaker usually sounds resigned rather than angry.", "trick_line": "**hum + drum** — one note held, one beat repeated. No melody, no harm done.", "trick_unpack": "The word is literally two sounds that never change, which is exactly the complaint: not painful, just endlessly the same.", "sentences": ["After a decade of expeditions, he found the **humdrum** rhythm of village life unexpectedly restorative.", "My job sounds glamorous, but honestly it's pretty **humdrum** — mostly spreadsheets and email."], "one_line": "Dull and monotonous; the flat sameness of routine.", "root_family": [], "confusables": [], "sense_tags": ["boring", "monotonous", "routine", "ordinary"], "register": "neutral", "connotation": "negative", "groups": [1]}, {"word": "incredulous", "pos": "adj.", "pron": "in-KREJ-uh-luhs", "pron_note": "The middle syllable is \"krej,\" not \"kred\" — in-KRED-yoo-lus is a common slip.", "means": "Unable or unwilling to believe something; showing disbelief.\n\nThis is a **reaction, not a policy**. A *skeptic* doubts by disposition — reasoned, sustained, professional. Someone incredulous has just been told something and their face is doing the work: eyebrows up, head tilted, \"you're joking.\" It's momentary, almost involuntary, and it lives in looks, stares, gasps and tones as much as in arguments.\n\nNote the two people involved: the **thing** is unbelievable, the **person** is incredulous.", "trap": "**incredulous ≠ incredulous's cousin *credulous*.**\n- **incredulous** = believes too *little* — refuses to swallow it\n- **credulous** = believes too *much* — swallows anything (gullible)\n\nThey are opposites, one letter-cluster apart.", "trick_line": "**-ous** words describe *people's states* — nerv**ous**, jeal**ous**, anxi**ous**, incredul**ous**. **-ible** words describe what a *thing* can have done to it — ed**ible**, aud**ible**, incred**ible**.", "trick_unpack": "So the story is incredible and the listener is incredulous — never the reverse.", "sentences": ["The jury turned **incredulous** faces toward the witness as he explained, for the third time, why the money was in his freezer.", "\"You cycled here? In this?\" she said, **incredulous**, staring at his soaking shoes."], "etymology": "Latin **crēdere** = *\"to believe\"*, with **in-** = *not*.\n\nOne root, a lot of GRE mileage: **credible** (believable), **credence** (belief given), **credulous** (believing too easily), **creed** (what you believe), **credentials** (proof you should be believed), and **credit** — money lent because someone believed you'd pay.", "one_line": "Unwilling to believe it; visibly disbelieving.", "root": "crēdere (to believe)", "root_family": ["credible", "credence", "credulous", "creed", "credentials", "credit", "credo", "discredit"], "confusables": ["incredible", "credulous", "credible"], "sense_tags": ["disbelief", "doubt", "astonishment", "skepticism"], "register": "neutral", "connotation": "neutral", "groups": [2]}, {"word": "ingenuous", "pos": "adj.", "pron": "in-JEN-yoo-uhs", "pron_note": "Four syllables, stress on JEN — not \"in-JEE-nee-uhs,\" which is *ingenious*.", "means": "Innocently frank; open and trusting because you have never learned to be otherwise.\n\nAn ingenuous person says the true thing without calculating what it costs them. *Candid* is a choice; *ingenuous* is a condition — it comes from inexperience, not courage. That's why the word runs warm but slightly condescending: the speaker is charmed and also faintly aware that this person will be eaten alive. Push it further and you're at *naive*; pull it back toward polish and you lose it entirely.", "trap": "**ingenuous ≠ ingenious.** One letter, opposite compliments: **ingenuous** = *guilelessly open*; **ingenious** = *cleverly inventive*. Calling a con artist's scheme \"ingenuous\" says he's a sweet innocent, which is precisely what he isn't.", "trick_line": "Hidden inside in-**genu**-ous is **genuine** — no filter, no angle.", "trick_unpack": "And the sneaky cousin **dis**ingenuous is someone *faking* that openness, which fixes both words at once.", "sentences": ["Her ingenuous account of the meeting, offered without a trace of self-protection, damaged her far more than a lie would have.", "He asked what her salary was — not rude, just ingenuous enough to think it was a normal question."], "in_the_wild": "The **ingénue** — the stock innocent-young-woman role in theatre and film (Audrey Hepburn built a career on it). Same root, same quality: wide-eyed and unguarded.", "etymology": "Latin **ingenuus** = *\"native-born, freeborn\"* — from *in-* (in) + *gignere* (to beget). A freeborn Roman had no need to flatter or dissemble, so \"freeborn\" slid into \"frank, unguarded.\"\n\nThe *gen-* root is everywhere: **genuine, genus, generate, congenital, indigenous** — and yes, **ingenious** too (Latin *ingenium*, inborn talent). Same family, diverged completely: one inherits honesty, the other inherits brains.", "one_line": "Innocently open and frank, from inexperience rather than courage.", "root": "gignere, genus (to beget, be born)", "root_family": ["genuine", "ingenious", "ingénue", "genus", "generate", "congenital", "indigenous", "genius", "engine"], "confusables": ["ingenious", "disingenuous", "ingénue", "indigenous"], "sense_tags": ["innocent", "frank", "artless", "naive", "unguarded"], "register": "formal", "connotation": "depends", "groups": [2]}, {"word": "insipid", "pos": "adj.", "pron": "in-SIP-id", "means": "Literally **without flavour**; figuratively **dull, flat, lacking any spark or interest**.\n\nThe word carries no heat. Something insipid doesn't offend you, it *fails* to affect you — weak tea, a beige romcom, a politician's non-answer. That's what separates it from *dreadful* or *tedious*: those admit the thing had force enough to hurt. Insipid is the verdict of a jaded palate, faintly superior, the sound of someone who expected to be interested and wasn't. Often used of art, prose, conversation and people, where \"watery\" is exactly the insult intended.", "trick_line": "in-**SIP**-id — you **sip** it and taste nothing.", "trick_unpack": "The word hides *sip* right in its stressed syllable, and the point isn't that it tastes bad — it's that there's nothing there.", "sentences": ["The novel's prose was elegant enough, but its characters were **insipid** — beautiful people saying nothing to each other for four hundred pages.", "Two hours of my life for that? Insipid doesn't cover it — I've had stronger opinions about tap water.\""], "etymology": "Latin **in-** (*not*) + **sapidus** (*tasty*), from **sapere** = *\"to taste\"* — and, by extension, *\"to have taste, to be wise.\"*\n\nThat double sense pays off across the whole family: **savour** and **savvy** (tasting), **sapient**, **sage** and **Homo sapiens** (knowing). So *insipid* is literally the un-tasty — and the flavourless thing is dumb in both senses at once.", "one_line": "Flavourless; dull and flat, with nothing there to notice.", "root": "sapere (to taste; to be wise)", "root_family": ["sapient", "Homo sapiens", "sage", "savour", "savvy", "sapid"], "confusables": ["vapid", "insidious", "intrepid", "limpid"], "sense_tags": ["dull", "bland", "flavourless", "uninteresting", "lifeless"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "loquacious", "pos": "adj.", "pron": "loh-KWAY-shuhs", "means": "Talkative — inclined to talk a great deal, easily and at length.\n\nIt's a bookish word for a very ordinary trait, and that gap is the point: you'd call a friend *chatty*, but a witness, a host, or a diplomat *loquacious*. The tone sits just shy of a complaint — usually it means \"more talk than the occasion required,\" but a **loquacious** dinner guest can be a gift. Compare **garrulous**, which is squarely negative (rambling, tedious, often old), and **voluble**, which praises the *fluency* rather than the *quantity*.", "trick_line": "**-acious** = *full of it*: vor**acious** (full of appetite), ten**acious** (full of grip), loqu**acious** (full of talk).", "trick_unpack": "Every *-acious* word describes someone oversupplied with something, which is exactly the faint excess loquacious carries — not merely speaking, but having more speech on hand than is needed.", "sentences": ["The normally reticent minister grew **loquacious** after the second glass, and three off-the-record remarks made the morning papers.", "Our cab driver was **loquacious** to say the least — I learned his whole divorce in eleven minutes."], "etymology": "Latin **loquī** = *\"to speak.\"* One root, a whole GRE cluster: **eloquent** (speaking well *out*), **colloquial** (speech *with* others — casual talk), **soliloquy** (speaking *alone*), **circumlocution** (talking *around* the point), **grandiloquent** (grand talk), and **ventriloquist** — literally *belly-speaker*.", "one_line": "Talkative, especially at bookish length.", "root": "loquī (to speak)", "root_family": ["eloquent", "colloquial", "soliloquy", "circumlocution", "grandiloquent", "ventriloquist", "elocution", "obloquy"], "confusables": [], "sense_tags": ["talkative", "verbose", "chatty", "fluent"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "misanthropic", "pos": "adj.", "pron": "mis-uhn-THROP-ik", "pron_note": "The noun shifts its stress: misanthrope = MIZ-uhn-throhp.", "means": "Hating, distrusting, or wanting nothing to do with **humankind in general**.\n\nThe scope is what defines it: this isn't a grudge against your neighbour, it's a low opinion of the whole species — people are selfish, stupid, and best avoided. It's a settled worldview rather than a mood, which is why it sounds almost philosophical, and why it's often used with a grin (*a misanthropic old bachelor who feeds the cat and no one else*). Compare **hostile** (aimed at someone), **cynical** (doubts motives, still shows up), **antisocial** (avoids people without necessarily despising them).", "trick_line": "**Phil**anthropic loves *anthropos*; **mis**anthropic hates him — same humans, opposite prefix.", "trick_unpack": "Both words point at humanity as a whole, so the misanthrope doesn't hate *you* — he hates humans, and you happen to be one.", "sentences": ["His later essays grew steadily more **misanthropic**, treating civilisation as a mistake that had merely taken a long time to become obvious.", "Two days of airport queues and I was feeling pretty **misanthropic** by the end of it."], "in_the_wild": "The **Grinch** is the pop-culture misanthrope in full: he doesn't have a quarrel with any particular Who, he just can't stand Whos.", "etymology": "Greek **misein** (*to hate*) + **anthrōpos** (*human being*).\n\nBoth halves pay off elsewhere: *misein* gives **misogyny** (+ *gynē*, woman) and **misandry** (+ *anēr*, man); *anthrōpos* gives **anthropology**, **anthropomorphic**, and — with *philein*, to love — **philanthropy**, the exact mirror image.", "one_line": "Hating humanity in general, not any one person.", "root": "misein (to hate) + anthrōpos (human being)", "root_family": ["misogyny", "misandry", "misogamy", "anthropology", "anthropomorphic", "philanthropy", "anthropocentric"], "confusables": ["philanthropic", "misogynistic", "anthropomorphic"], "sense_tags": ["hatred", "cynicism", "antisocial", "humanity", "reclusive"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "misnomer", "pos": "n.", "pron": "mis-NOH-mer", "means": "A **name or term that is wrong or misleading** for the thing it's attached to — *\"jellyfish\"* is a misnomer, since it's neither jelly nor fish.\n\nThe word polices **labels, not facts**. A misnomer says the *name* is inaccurate; it makes no claim that people are fooled or that anything important is at stake. Tone is dry and mildly pedantic — the voice of someone correcting a caption, not exposing a lie. It carries no accusation of dishonesty: most misnomers are historical accidents nobody bothered to fix.", "trap": "⚠️ **misnomer ≠ misconception.**\n- **misnomer** = the **name** is wrong (*\"peanut\" is a misnomer — it's a legume*)\n- **misconception** = the **belief** is wrong (*that peanuts are nuts is a misconception*)\n\n\"It's a misnomer that goldfish have three-second memories\" is the classic misuse — that's a misconception. No name is being challenged.", "trick_line": "**mis-NOM-er — a mis-*nom*. *Nom* is French for *name*, as in *nom de plume*.**", "trick_unpack": "Hear the *nom* buried in the middle and the word tells you it's the label that's wrong, not the idea.", "sentences": ["\"Civil war\" is something of a **misnomer** for a conflict fought largely by foreign mercenaries.", "Calling that a starter salad is a **misnomer** — it's three olives and a leaf.\n"], "in_the_wild": "Voltaire on the **Holy Roman Empire**: *\"neither holy, nor Roman, nor an empire.\"* Three misnomers in one name.", "etymology": "Old French **mesnomer** = *mes-* (\"wrongly\") + **nommer** (\"to name\"), from Latin **nomen**, *name*.\n\nThat root is everywhere on the GRE: **nominate** (put a name forward), **nominal** (in name only), **nomenclature** (a naming system), **denomination**, **noun**, and **ignominy** (*ig-* + *nomen* — literally *namelessness*, i.e. disgrace).", "one_line": "A name that's flatly wrong for the thing it names.", "root": "nomen (name)", "root_family": ["nominate", "nominal", "nomenclature", "denomination", "ignominy", "noun"], "confusables": ["misconception"], "sense_tags": ["naming", "inaccuracy", "labels", "terminology"], "register": "neutral", "connotation": "neutral", "groups": [1]}, {"word": "negligent", "pos": "adj.", "pron": "NEG-li-juhnt", "means": "Failing to give something the care it required — **and being at fault for it.**\n\n*Careless* describes a temperament; **negligent** delivers a judgement. The word presupposes a **duty owed** — a parent, a driver, a surgeon, a landlord — and says you fell below the standard that duty demanded. That's why it lives so naturally in courtrooms and disciplinary hearings: calling someone careless is a complaint, calling them negligent is an accusation of blame. It also implies *omission* rather than action: the negligent party didn't do something wrong so much as fail to do the right thing.", "trap": "⚠️ **negligent ≠ negligible.**\n- **negligent** = *culpably careless*\n- **negligible** = *so small it can be ignored*\n\nA negligent engineer; a negligible difference. The shared root is real — both are things *not picked up* — but one blames a person, the other dismisses a quantity.", "trick_line": "**Careless** is a habit; **negligent** is a verdict — you can only be negligent about something you were *supposed* to be doing.", "trick_unpack": "Test it by asking \"who was owed the care?\" — if there's an answer, the word is *negligent*.", "sentences": ["The inquiry found the shipping line **negligent** in its maintenance of the hull, and liability followed within the hour.", "I was **negligent** with the houseplants for about ten days and now I own six sticks."], "in_the_wild": "Every insurance policy, rental agreement and terms-of-service you've ever clicked through contains a **gross negligence** clause — the carve-out saying the company still pays if it was *really* their fault.", "etymology": "Latin **neglegere** = *nec* (\"not\") + *legere* (\"to pick up, gather, read\") — literally **to not pick something up**. What was lying there needing attention, you walked past.\n\n*legere* is a workhorse root: **legible**, **lecture**, **elect**, **select**, **collect**, **intelligent** (picking *between* things).\n\nBest of all, its exact opposite comes from the same place: **diligent** — the one who picks things up carefully.", "one_line": "Carelessly failing a duty you owed — blameworthy, not merely sloppy.", "root": "legere (to pick up, gather, read)", "root_family": ["diligent", "negligible", "neglect", "legible", "lecture", "elect", "select", "collect", "intelligent"], "confusables": ["negligible", "neglectful", "negligee", "diligent"], "sense_tags": ["careless", "dereliction", "blameworthy", "inattentive", "duty"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "obsequious", "pos": "adj.", "pron": "uhb-SEE-kwee-uhs", "pron_note": "Four syllables — the *-quious* is \"kwee-uhs\", not \"kwuss\".", "means": "Excessively eager to serve, please, or agree — fawning, servile, all deference and no spine.\n\nThe word is never a compliment. **Deferential** is respectful, **attentive** is good service; **obsequious** is what you call it when the pleasing has gone past dignity and started to look like a strategy. It carries a whiff of self-interest — the flatterer wants something — and it describes how the behaviour *looks to a third party*, not how it feels to the person being flattered. Classic targets: the yes-man, the courtier, the waiter who hovers, the junior who laughs a beat too long at the boss's joke.", "trap": "**obsequious ≠ obsequies.** *Obsequies* (OB-si-kweez) are **funeral rites** — the ceremony, not the crawling. Same Latin root, opposite worlds: one follows a coffin, the other follows a boss.", "trick_line": "**ob-SEE-kwee-us** — he'll do anything to **seek** to please **us**.", "trick_unpack": "The buried \"seek\" is the whole nuance: this isn't natural politeness but pleasing that is aimed, effortful, and after something.", "sentences": ["Every biographer notes the same failing: brilliant with his equals, **obsequious** the moment a duke entered the room.", "He's not being nice, he's being **obsequious** — nobody compliments your parking that much for free."], "in_the_wild": "Uriah Heep in Dickens's *David Copperfield*, forever wringing his hands and calling himself \"ever so 'umble\" — the textbook obsequious creep, and the humility is a con from the first page.", "etymology": "Latin **ob-** (\"toward\") + **sequi** (\"to follow\") — literally *following close behind you*, which is exactly what the word still describes.\n\n**sequi** is a high-yield GRE root: **sequel, sequence, consequence, subsequent, non sequitur** (\"it does not follow\"), and — with a sound shift — **pursue, persecute, prosecute**.", "one_line": "Fawning and servile — pleasing so hard it becomes contemptible.", "root": "sequi (to follow)", "root_family": ["sequel", "sequence", "consequence", "subsequent", "non sequitur", "obsequies", "pursue", "prosecute"], "confusables": ["obsequies", "obstreperous"], "sense_tags": ["fawning", "servile", "sycophantic", "flattering", "deferential"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "placate", "pos": "v.", "pron": "PLAY-kayt", "pron_note": "British speakers usually say pluh-KAYT, stressing the second syllable.", "means": "To calm someone's anger or hostility, usually by giving them something — a concession, an apology, a token gesture.\n\nThe anger has to be there first. You can't placate a happy person; the word presupposes a grievance you are damping down. And it often carries a faint whiff of insincerity: the goal is to *stop the complaining*, not necessarily to fix what caused it. Companies placate angry customers with vouchers; governments placate critics with committees. Where **soothe** is warm and **pacify** can mean force, **placate** is transactional — you hand over something to buy quiet.", "trick_line": "**Placate** rhymes with **irate** — you only placate the irate.", "trick_unpack": "The rhyme locks in the precondition: there must already be anger on the table, and you're paying something to make it go away.", "sentences": ["The minister offered a public inquiry, less to uncover the truth than to **placate** a press corps that had scented blood.", "I brought her a coffee to **placate** her after I lost the keys again."], "etymology": "Latin **placāre** = *\"to soothe, to calm,\"* a cousin of **placēre**, *\"to please.\"*\n\nThat root is worth memorising because it pays out across the exam: **placid** (calm), **complacent** (pleased with yourself), **implacable** (*not* able to be placated — an enemy no concession will soften), and **placebo**, which is literally Latin for *\"I shall please.\"*", "one_line": "Calm someone's anger, usually by giving them something.", "root": "placāre (to soothe), from placēre (to please)", "root_family": ["placid", "implacable", "complacent", "placebo", "complaisant"], "confusables": ["placid", "placard", "implacable", "placebo"], "sense_tags": ["appeasing", "soothing", "conciliation", "anger-management", "concession"], "register": "neutral", "connotation": "depends", "groups": [1]}, {"word": "polarize", "pos": "v.", "pron": "POH-luh-ryze", "pron_note": "British spelling: polarise.", "means": "To split a group into **two sharply opposed camps**, with nothing left in between. (Technical sense: to give something poles — as with light, magnets, or charge.)\n\nThe key isn't that people disagree; it's that the **middle ground vanishes**. A polarizing figure or issue drags everyone toward one extreme or the other — you can't stay lukewarm about it. That's why *polarizing* is the standard word for a celebrity or policy people either adore or loathe, never merely quite like.", "trick_line": "**Poles** are as far apart as two points can get — and nobody lives at the equator anymore.", "trick_unpack": "To polarize is to push every last person to the North or South pole of an argument, emptying out the temperate middle.", "sentences": ["The referendum **polarized** a country that had, until then, treated the question as a matter of mild indifference.", "That show **polarizes** everyone I know — half my friends call it a masterpiece, the other half won't finish episode one."], "in_the_wild": "**Polarized sunglasses** — the lens filters light down to a single plane and kills the glare. Same idea, physical version: everything gets forced into one orientation.", "one_line": "To split a group into two hostile extremes, erasing the middle.", "root": "polos (axis, pivot) → Latin polus (pole)", "root_family": ["pole", "polar", "polarity", "bipolar"], "confusables": [], "sense_tags": ["division", "conflict", "extremes", "opposition"], "register": "neutral", "connotation": "negative", "groups": [3]}, {"word": "proclivity", "pos": "n.", "pron": "pruh-KLIV-uh-tee", "means": "A **natural, habitual leaning** toward some behaviour — an inclination you were born with or fell into, not one you chose.\n\nThe word carries a faint smell of vice. A *penchant* is for good coffee; a **proclivity** is for gambling, brawling, or lying, and it's the word prosecutors and psychiatrists reach for. It also implies the tendency is *settled and characteristic* — not a mood but a disposition. Used of something innocent (\"a proclivity for crosswords\"), it sounds either arch or faintly like an accusation.", "trick_line": "**Proclivity** hides **cliv-** = *slope* — and slopes run **downhill**.", "trick_unpack": "You're already tilted that way and gravity does the rest, which is why proclivities tend toward the vices rather than the virtues.", "sentences": ["The biography is candid about the composer's **proclivity** for ruinous debt.", "He's got a real **proclivity** for picking fights he can't win."], "in_the_wild": "Listen to any true-crime documentary or courtroom scene: nobody has a *liking* for anything — they have **\\\"violent proclivities.\\\"** The word almost never leaves that neighbourhood.", "etymology": "Latin **pro-** (*forward*) + **clivus** (*slope*) — literally \"a slope forward,\" a tilt.\n\nSame slope gives you **declivity** (a downward slope) and **acclivity** (an upward one), both GRE-worthy; the related root *clinare* (\"to lean\") gives **incline, decline, recline, proclivity**'s whole leaning family.", "one_line": "A natural leaning toward something, usually something bad.", "root": "clivus (slope), pro- (forward)", "root_family": ["declivity", "acclivity", "incline", "decline", "recline"], "confusables": ["propensity", "predilection", "proximity", "declivity"], "sense_tags": ["tendency", "inclination", "disposition", "vice", "habit"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "prodigal", "pos": "adj. / n.", "pron": "PROD-i-guhl", "means": "**Adj.:** spending money or resources with reckless, wasteful abandon. **Noun:** the person who does it.\n\nThis is a moral verdict, not a neutral description. *Extravagant* can be admiring; **prodigal** says the money was *squandered* — poured out until there was none left, usually by someone who should have known better. It carries the smell of an inheritance blown, a fortune wasted.\n\nOne twist the GRE loves: **prodigal has nothing to do with coming back.** Because of the parable, people use it to mean \"the returning one.\" The prodigal son was prodigal *before* he came home — that's why he had nothing left.\n\nA second, milder sense survives with *of*: **prodigal of praise**, *prodigal of detail* — lavishly generous, no insult intended.", "trap": "⚠️ **prodigal ≠ prodigy.**\n- **prodigal** = wasteful spender\n- **prodigy** = astonishingly gifted young person\n\nMozart was a prodigy. His patron's heir was probably prodigal.", "trick_line": "**Prodigal** = *\"prod-it-all\"* — he prods it all out the door until the vault is empty.", "trick_unpack": "The word is about the money going *out*, not the man coming *back*.", "sentences": ["Two generations of **prodigal** heirs reduced the estate to a mortgaged shell.", "He got the bonus on Friday and by Sunday it was gone — absolutely **prodigal** with it."], "in_the_wild": "The **Parable of the Prodigal Son** — the boy who demands his inheritance early, blows it all abroad, and crawls home broke. The story is so famous that the word got dragged toward \"returning\"; remember that the title describes how he *spent*, not how he *came back*.", "etymology": "Latin **prodigere** = *\"to drive forth, squander\"* — **pro-** (\"forth\") + **agere** (\"to drive\"). You're driving your money out the door.\n\n**agere** is a workhorse root: **agent, agenda, agile, act, exact, navigate**.\n\n🚫 **Not the source of *prodigy*.** That's Latin *prodigium*, \"an omen, a portent\" — a marvel, not a waster.", "one_line": "Recklessly wasteful with money — squandering, not returning.", "root": "agere, actum (to drive, to do)", "root_family": ["agent", "agenda", "agile", "act", "exact", "navigate", "cogent"], "confusables": ["prodigy", "prodigious", "profligate", "frugal"], "sense_tags": ["wasteful", "extravagant", "spendthrift", "lavish", "squandering"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "puerile", "pos": "adj.", "pron": "PYOOR-ile", "pron_note": "Also PYOO-uh-ruhl in American speech; the \"pyoo\" start is the same as in *pure*.", "means": "Childishly silly — immature in a way that embarrasses adults: snickering, name-calling, toilet jokes, sulking.\n\nThe word is a verdict, not a description. **Childlike** is warm (wonder, innocence); **childish** is a plain complaint; **puerile** is the same complaint delivered from a height — it says the behaviour is beneath the speaker and beneath the occasion. It attaches especially to humour and to public conduct: a *puerile* stunt in parliament, a *puerile* joke in a eulogy. Note the sting works only against someone old enough to know better; a child cannot be puerile.", "trick_line": "**Pue**rile — **poo** jokes, said by someone too grand to laugh at them.", "trick_unpack": "The spelling hands you the schoolboy humour the word describes, and the sniffy tone of the person using it.", "sentences": ["The committee dismissed his objection as **puerile** point-scoring unworthy of the office he held.", "Grow up — arguing about who called shotgun is so **puerile**."], "in_the_wild": "It's the film critic's standard sneer for gross-out comedy: a review calling a film \"puerile\" isn't saying it's for kids, it's saying grown men made it.", "etymology": "Latin **puer** = *\"boy.\"* Puerile is literally *boyish* — which tells you why it's never a compliment about an adult. Same root in **puerperal** (*puer* + *parere*, \"to bear\") — puerperal fever, the infection of childbirth.\n\n🚫 **Not related to *pure***, despite the sound. That's Latin *purus* — *purify, puritan, purge*.", "one_line": "Childishly silly, in a way that invites contempt.", "root": "puer (boy)", "root_family": ["puerility", "puerperal"], "confusables": ["pure", "puerperal"], "sense_tags": ["immature", "childish", "silly", "contemptuous"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "quixotic", "pos": "adj.", "pron": "kwik-SOT-ik", "pron_note": "The man is kee-HOH-tay, but the adjective was anglicised centuries ago — say kwik-SOT-ik, never kee-HOH-tik.", "means": "Idealistic to the point of impracticality — chasing a noble goal that reality will not allow.\n\nThe word carries **affection, not contempt**. Calling a plan *foolish* is a verdict; calling it **quixotic** grants the dreamer his gallantry and only regrets his aim. There's usually something chivalrous, self-sacrificing, slightly absurd about it — a one-man campaign against an entire industry, a doomed rescue mission. *Idealistic* praises; *delusional* diagnoses; *quixotic* smiles and shakes its head.", "trick_line": "**kwik-SOT-ik** — a **quick shot** at a windmill: brave, instant, and hopeless.", "trick_unpack": "The sound of the word gives you both the charge and the futility of it — the aim is heroic, the target was never an enemy.", "sentences": ["His **quixotic** campaign to restore the canal drew admiration from everyone and funding from no one.", "Learning three languages before the trip was a bit **quixotic**, but you have to love him for trying."], "in_the_wild": "**\"The Impossible Dream\"** — the standard from *Man of La Mancha*, sung by Don Quixote himself: *to fight the unbeatable foe*. That song is the definition set to music.", "etymology": "Straight from **Don Quixote**, the hero of Cervantes' 1605 novel — an ageing gentleman who reads too many chivalric romances, straps on rusted armour, and rides out to right the world's wrongs. His most famous act is charging a row of windmills he mistakes for giants.\n\nThat scene gave English a second phrase you already know: **tilting at windmills** — attacking imaginary enemies with total sincerity.", "one_line": "Nobly idealistic, gallantly impractical — chasing an unwinnable cause.", "root": "Don Quixote (Cervantes' knight-errant, 1605)", "root_family": [], "confusables": ["quizzical"], "sense_tags": ["idealistic", "impractical", "romantic", "futile", "chivalrous"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "spendthrift", "pos": "n. / adj.", "pron": "SPEND-thrift", "means": "A person who spends money **extravagantly and wastefully** — and, as an adjective, the habit itself (*spendthrift ways, spendthrift heir*).\n\nThe disapproval is about **squandering**, not about amount. A billionaire buying a jet isn't a spendthrift; an heir burning through an inheritance he can never rebuild is. The word carries the sense of a finite pot being drained — which is why it clings to inheritances, trust funds, and lottery winners. Tone is faintly old-fashioned and more exasperated than damning: a raised eyebrow, not a moral charge.", "trick_line": "A spendthrift **spends the thrift** — the savings *are* the thing being burned.", "trick_unpack": "The word looks like it should mean \"frugal\", but *thrift* here is the **object** of the spending, not the manner of it — so it means the exact opposite of *thrifty*.", "sentences": ["The estate passed to a **spendthrift** nephew who had sold off the last of the paintings before the year was out.", "One bonus and he turns into a total **spendthrift** — new speakers, new bike, rent still unpaid."], "in_the_wild": "**Spendthrift trust** is a live term in estate law: money left to someone whose relatives assume they can't be trusted with a lump sum, so the trust pays it out in a controlled drip and creditors can't touch it. If a lawyer says it about you, it isn't a compliment.", "etymology": "**Thrift** originally meant *\"thriving, prosperity, accumulated savings\"* — it's the noun of **thrive**. So a spendthrift is literally one who **spends his thriving**.\n\nOnly later did *thrift* narrow into \"frugality\" (the habit that produces the savings), which is what makes the word look self-contradictory today. Same root: **thrive, thrifty, thrift shop**.", "one_line": "Someone who spends money wastefully and extravagantly.", "root": "thrift (thriving, prosperity, savings) ← thrive", "root_family": ["thrive", "thrifty", "thrift"], "confusables": ["thrifty", "thrift"], "sense_tags": ["wasteful", "extravagance", "money", "squandering"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "taciturn", "pos": "adj.", "pron": "TAS-i-tern", "pron_note": "Stress at the front, like tacit — not \"tuh-SIT-urn\".", "means": "Habitually silent; saying little by temperament, not by mood.\n\nThis is a **standing character trait**, not a one-off silence. A *quiet* person happens not to be talking; a **taciturn** person is *built* that way — you could know him for ten years and still get three-word answers. It carries a faint chill: not shy, not sad, just closed. Applied to a friend it's affectionate-gruff; applied to a witness or a colleague it hints at something withheld.", "trap": "⚠️ **taciturn ≠ reticent.**\n- **taciturn** = silent *by nature*, about everything\n- **reticent** = holding back on *one particular subject*\n\nA taciturn man rarely speaks; a chatty man can still be reticent about his divorce.", "trick_line": "**TACIT**urn — *tacit* means unspoken, and the **-urn** ending makes it permanent, like *nocturnal* and *saturnine*.", "trick_unpack": "The word literally has \"tacit\" sitting inside it, and the tacked-on ending turns a single unspoken thing into a lifelong disposition.", "sentences": ["The new ambassador was **taciturn** to the point of discourtesy, offering nothing beyond the sentence his brief required.", "My grandad's **taciturn** — you get \"fine\" for how was your day and that's the whole conversation."], "in_the_wild": "Calvin Coolidge was nicknamed **\"Silent Cal\"** for exactly this. The famous story: a dinner guest told him she'd bet she could get more than two words out of him. His reply — *\"You lose.\"*", "etymology": "Latin **tacēre** = *\"to be silent\"* — which also gives you **tacit** (understood without being said), **tacitly**, and **reticent** (*re-* + *tacēre*, to keep silent about). The Roman historian **Tacitus** carried the same name.", "one_line": "Habitually silent; saying little by nature.", "root": "tacēre (to be silent)", "root_family": ["tacit", "tacitly", "reticent", "reticence", "Tacitus"], "confusables": ["reticent", "tacit", "laconic", "saturnine"], "sense_tags": ["silent", "reserved", "uncommunicative", "temperament"], "register": "formal", "connotation": "neutral", "groups": [1]}, {"word": "verbose", "pos": "adj.", "pron": "ver-BOHS", "means": "Using far more words than the job needs; wordy, padded, bloated.\n\nThe complaint is about the **prose, not the person**. Call someone *garrulous* or *loquacious* and you're describing a chatterbox; call their report *verbose* and you're describing a style problem — the ideas may be fine, but they arrive buried under three clauses of throat-clearing. It's the standard verdict on legal contracts, academic papers and consultants' slide decks, and it's cool and clinical rather than heated: an editor's word, not an insult shouted across a room.\n\nOne exception to the sting: in software, **verbose mode** is a neutral setting — you *want* the extra output.", "trick_line": "**Verb + -ose** — and *-ose* means \"full of\": grandi**ose** (full of grandeur), belli**cose** (full of war), verb**ose** (full of words).", "trick_unpack": "Lock the suffix once and you get a free read on a whole family of GRE adjectives that all mean \"overloaded with the thing named.\"", "sentences": ["The judgment ran to four hundred **verbose** pages, of which perhaps twenty carried the reasoning.", "Just tell me what broke — your emails are so **verbose** I never get to the point.\n"], "in_the_wild": "Any command line: `curl -v`, `npm install --verbose`. The `-v` flag literally means \"print every last detail\" — the one place being verbose is a feature.", "etymology": "Latin **verbum** = *\"word.\"* The family is huge and all of it is about words: **verb**, **verbal**, **verbatim** (word for word), **proverb**, **adverb**.", "one_line": "Using far more words than the point requires.", "root": "verbum (word)", "root_family": ["verb", "verbal", "verbatim", "proverb", "adverb", "verbiage"], "confusables": ["verbal", "verbatim", "verbiage"], "sense_tags": ["wordy", "long-winded", "padded", "prolix", "speech-and-writing"], "register": "neutral", "connotation": "negative", "groups": [3]}, {"word": "wary", "pos": "adj.", "pron": "WAIR-ee", "means": "On guard against something you suspect could harm or cheat you — watchful, distrustful, holding back.\n\n**Cautious** is a general habit; you can be cautious with nothing in particular in mind. **Wary** is pointed — there's a specific person, offer, or situation you're keeping one eye on. It also carries a hint of *distrust* that plain caution doesn't: being wary **of** someone says you think they might be playing you. Mild and everyday in tone — you can be wary of a dodgy pothole or of a business partner.", "trap": "⚠️ **wary ≠ weary.** One letter, totally different words.\n- **wary** = **WAIR-ee**, on guard (rhymes with *hairy*)\n- **weary** = **WEER-ee**, exhausted (rhymes with *dreary*)\n\nA weary traveller wants a bed; a wary traveller checks the lock.", "trick_line": "Knock the *be* off **beware** and you're left with **war**y — someone's already warned you.", "trick_unpack": "That leftover warning is the nuance: you're not carefully in general, you're watching one particular thing.", "sentences": ["Economists remain **wary** of declaring the recovery complete while wages continue to lag.", "I'd be **wary** of him — he was very keen to get your bank details."], "etymology": "Old English **wær** = *\"watchful, aware.\"* The same Germanic root fans out into **aware**, **beware**, **ward**, **warden**, and — borrowed back through French — **guard**. Every one of them is somebody keeping watch.", "one_line": "Watchful and distrustful of a particular danger.", "root": "Old English wær (watchful, aware)", "root_family": ["aware", "beware", "ward", "warden", "guard"], "confusables": ["weary", "leery", "chary"], "sense_tags": ["cautious", "distrustful", "watchful", "guarded"], "register": "neutral", "connotation": "neutral", "groups": [1]}];
const KEY = "gre-vocab-difficulty-v1";
let marks = JSON.parse(localStorage.getItem(KEY) || "{}");
let mode = "browse", order = [], idx = 0, revealed = false, openWord = null;

const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* Minimal markdown - only what the card fields actually use. */
function md(src){
  if(!src) return "";
  const blocks = esc(src).split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => {
    const lines = b.split("\n");
    let html;
    if(lines.every(l => /^>\s?/.test(l)))
      html = "<blockquote>" + lines.map(l=>l.replace(/^>\s?/,"")).join("<br>") + "</blockquote>";
    else if(lines.every(l => /^[-*]\s+/.test(l)))
      html = "<ul>" + lines.map(l=>"<li>"+l.replace(/^[-*]\s+/,"")+"</li>").join("") + "</ul>";
    else if(lines.every(l => /^\d+\.\s+/.test(l)))
      html = "<ol>" + lines.map(l=>"<li>"+l.replace(/^\d+\.\s+/,"")+"</li>").join("") + "</ol>";
    else html = "<p>" + lines.join("<br>") + "</p>";
    return html;
  }).join("")
   .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
   .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
   .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function save(){ localStorage.setItem(KEY, JSON.stringify(marks)); renderStats(); }
function mark(w,d){ if(d) marks[w]=d; else delete marks[w]; save(); }

function filtered(){
  const q = $("search").value.trim().toLowerCase();
  const g = $("group").value, d = $("diff").value;
  return CARDS.filter(c => {
    if(g && !(c.groups||[]).map(String).includes(g)) return false;
    const m = marks[c.word] || "none";
    if(d && m !== d) return false;
    if(!q) return true;
    return (c.word + " " + (c.one_line||"") + " " + (c.root||"") + " " +
            (c.sense_tags||[]).join(" ") + " " + (c.means||"")).toLowerCase().includes(q);
  });
}

function cardHTML(c, front){
  let h = `<div class="card"><h2>${esc(c.word)} <span class="pos">${esc(c.pos||"")}</span>`;
  if(c.pron) h += `<span class="pron">${esc(c.pron)}</span>`;
  h += `</h2>`;
  if(c.pron_note) h += `<div class="note">${md(c.pron_note)}</div>`;
  if(front) return h + `</div>`;
  h += `<h3>Means</h3>${md(c.means)}`;
  if(c.trap) h += md(c.trap);
  if(c.trick_line){
    h += `<h3>Trick to lock it in</h3><blockquote>${md(c.trick_line).replace(/<\/?p>/g,"")}</blockquote>`;
    if(c.trick_unpack) h += md(c.trick_unpack);
  }
  if(c.sentences && c.sentences.length)
    h += `<h3>In sentences</h3><ol>` + c.sentences.map(s=>`<li>${md(s).replace(/<\/?p>/g,"")}</li>`).join("") + `</ol>`;
  if(c.in_the_wild) h += `<h3>In the wild</h3>${md(c.in_the_wild)}`;
  if(c.etymology)  h += `<h3>Where it comes from</h3>${md(c.etymology)}`;
  return h + `</div>`;
}

function renderBrowse(){
  const list = filtered();
  $("browse").innerHTML = list.length ? list.map(c => {
    const m = marks[c.word] || "none";
    const open = c.word === openWord;
    return `<div class="row d-${m}" data-w="${esc(c.word)}">
        <span class="w">${esc(c.word)}</span>
        <span class="g">${esc(c.one_line||"")}</span>
        <span class="tag">g${(c.groups||[]).join(",")}</span>
      </div>` + (open ? cardHTML(c,false) + markRow(c.word) : "");
  }).join("") : `<div class="empty">Nothing matches that filter.</div>`;

  document.querySelectorAll("#browse .row").forEach(el =>
    el.onclick = () => { openWord = openWord === el.dataset.w ? null : el.dataset.w; renderBrowse(); });
  wireMarks(renderBrowse);
}

function markRow(w){
  const m = marks[w]||"";
  return `<div class="marks" data-for="${esc(w)}">
    <button class="mk-hard ${m==="hard"?"on":""}" data-d="hard">Hard</button>
    <button class="mk-medium ${m==="medium"?"on":""}" data-d="medium">Medium</button>
    <button class="mk-easy ${m==="easy"?"on":""}" data-d="easy">Easy</button>
    <button data-d="">Clear</button></div>`;
}

function wireMarks(rerender){
  document.querySelectorAll(".marks").forEach(box =>
    box.querySelectorAll("button").forEach(b =>
      b.onclick = e => { e.stopPropagation(); mark(box.dataset.for, b.dataset.d); rerender(); }));
}

function renderDrill(){
  const list = order.length ? order.map(w=>CARDS.find(c=>c.word===w)).filter(Boolean).filter(c=>filtered().includes(c)) : filtered();
  if(!list.length){ $("drill").innerHTML = `<div class="empty">Nothing matches that filter.</div>`; return; }
  if(idx >= list.length) idx = 0;
  const c = list[idx];
  $("drill").innerHTML =
    `<div class="drill">` +
      (revealed ? cardHTML(c,false)
                : `<div class="card front">${cardHTML(c,true).replace(/^<div class="card">|<\/div>$/g,"")}
                     <div style="margin-top:26px"><button id="show">Show answer</button></div></div>`) +
    `</div>` +
    (revealed ? markRow(c.word) : "") +
    `<div class="nav"><button id="prev">← prev</button>
       <span>${idx+1} / ${list.length}</span>
       <button id="next">skip →</button></div>
     <div class="bar"><div style="width:${(idx+1)/list.length*100}%"></div></div>`;

  const go = d => { idx = (idx + d + list.length) % list.length; revealed = false; renderDrill(); };
  if($("show")) $("show").onclick = () => { revealed = true; renderDrill(); };
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  wireMarks(() => { idx = (idx+1) % list.length; revealed = false; renderDrill(); });
}

function renderStats(){
  const n = {easy:0,medium:0,hard:0};
  Object.values(marks).forEach(v => n[v] !== undefined && n[v]++);
  const done = n.easy+n.medium+n.hard;
  $("stats").innerHTML =
    `<span class="dot" style="background:var(--hard)"></span>${n.hard}
     <span class="dot" style="background:var(--medium)"></span>${n.medium}
     <span class="dot" style="background:var(--easy)"></span>${n.easy}
     &nbsp;· ${done}/${CARDS.length} marked`;
}

function render(){ mode === "browse" ? renderBrowse() : renderDrill(); renderStats(); }

/* ---- wiring ---- */
const groups = [...new Set(CARDS.flatMap(c=>c.groups||[]))].sort((a,b)=>a-b);
$("group").innerHTML = `<option value="">all groups</option>` +
  groups.map(g=>`<option value="${g}">group ${g}</option>`).join("");

["search","group","diff"].forEach(id =>
  $(id).addEventListener("input", () => { idx=0; revealed=false; render(); }));

$("mBrowse").onclick = () => { mode="browse"; $("mBrowse").classList.add("on");
  $("mDrill").classList.remove("on"); $("browse").classList.remove("hidden");
  $("drill").classList.add("hidden"); render(); };
$("mDrill").onclick = () => { mode="drill"; $("mDrill").classList.add("on");
  $("mBrowse").classList.remove("on"); $("drill").classList.remove("hidden");
  $("browse").classList.add("hidden"); revealed=false; render(); };

$("shuffle").onclick = () => {
  order = filtered().map(c=>c.word);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  idx=0; revealed=false; render();
};

$("exp").onclick = () => {
  const blob = new Blob([JSON.stringify(marks,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "difficulty.json"; a.click();
};
$("imp").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { marks = {...marks, ...JSON.parse(t)}; save(); render(); });
};

document.addEventListener("keydown", e => {
  if(mode!=="drill" || /input|select/i.test(e.target.tagName)) return;
  if(e.key===" "){ e.preventDefault(); revealed=true; renderDrill(); }
  if(e.key==="1") document.querySelector(".mk-hard")?.click();
  if(e.key==="2") document.querySelector(".mk-medium")?.click();
  if(e.key==="3") document.querySelector(".mk-easy")?.click();
  if(e.key==="ArrowRight") $("next")?.click();
  if(e.key==="ArrowLeft")  $("prev")?.click();
});

render();
</script></body></html>
