<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRE Vocab</title>
<style>
:root{
  --bg:#12131a; --panel:#1a1c26; --panel2:#22252f; --line:#2e3240;
  --ink:#e8e9ee; --dim:#9aa0b0; --accent:#7aa2f7;
  --easy:#5fbf7f; --medium:#e0b354; --hard:#e06a6a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0 8px 0 0;font-weight:650;letter-spacing:.3px}
input,select,button{font:inherit;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:6px 10px}
input:focus,select:focus{outline:1px solid var(--accent)}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#0d0f16;border-color:var(--accent);font-weight:600}
#search{min-width:200px;flex:1;max-width:340px}
.spacer{flex:1}
.stats{color:var(--dim);font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}

/* ---- browse ---- */
.row{display:flex;align-items:baseline;gap:10px;padding:9px 12px;
  border:1px solid var(--line);border-left-width:3px;border-radius:8px;
  margin-bottom:6px;cursor:pointer;background:var(--panel)}
.row:hover{border-color:var(--accent)}
.row .w{font-weight:650;min-width:150px}
.row .g{color:var(--dim);font-size:13px;flex:1}
.row .tag{color:var(--dim);font-size:11px;border:1px solid var(--line);
  border-radius:20px;padding:1px 8px}
.d-easy{border-left-color:var(--easy)} .d-medium{border-left-color:var(--medium)}
.d-hard{border-left-color:var(--hard)} .d-none{border-left-color:var(--line)}

/* ---- card ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:22px 26px;margin-bottom:14px}
.card h2{margin:0;font-size:26px;font-weight:700}
.card .pos{color:var(--dim);font-weight:400;font-style:italic;font-size:17px}
.card .pron{color:var(--accent);font-weight:650;font-size:19px;margin-left:8px}
.card .note{color:var(--dim);font-style:italic;font-size:13px;margin-top:4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);
  margin:22px 0 8px;font-weight:650}
blockquote{margin:10px 0;padding:10px 16px;border-left:3px solid var(--accent);
  background:var(--panel2);border-radius:0 8px 8px 0}
ol,ul{margin:8px 0;padding-left:22px} li{margin:5px 0}
strong{color:#fff} em{color:var(--dim)}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ---- drill ---- */
.drill{min-height:340px}
.drill .front{text-align:center;padding:46px 0 30px}
.drill .front h2{font-size:42px}
.hidden{display:none}
.marks{display:flex;gap:10px;justify-content:center;margin-top:20px}
.marks button{padding:10px 22px;font-weight:600;min-width:104px}
.mk-hard{border-color:var(--hard);color:var(--hard)}
.mk-medium{border-color:var(--medium);color:var(--medium)}
.mk-easy{border-color:var(--easy);color:var(--easy)}
.mk-hard:hover{background:var(--hard);color:#12131a}
.mk-medium:hover{background:var(--medium);color:#12131a}
.mk-easy:hover{background:var(--easy);color:#12131a}
.nav{display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;color:var(--dim);font-size:13px}
.empty{text-align:center;color:var(--dim);padding:60px 20px}
.bar{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--accent);transition:width .2s}
</style></head><body>

<header>
  <h1>GRE Vocab</h1>
  <button id="mBrowse" class="on">Browse</button>
  <button id="mDrill">Drill</button>
  <input id="search" placeholder="search word, meaning, root, tag…">
  <select id="group"></select>
  <select id="diff">
    <option value="">all marks</option>
    <option value="none">unmarked</option>
    <option value="hard">hard</option>
    <option value="medium">medium</option>
    <option value="easy">easy</option>
  </select>
  <button id="shuffle" title="Shuffle drill order">⤨</button>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <button id="exp" title="Save your difficulty marks to a file">Export</button>
  <button id="imp" title="Load difficulty marks from a file">Import</button>
  <input type="file" id="file" accept=".json" class="hidden">
</header>

<main>
  <div id="browse"></div>
  <div id="drill" class="hidden"></div>
</main>

<script>
const CARDS = [{"word": "abate", "pos": "v.", "pron": "uh-BAYT", "means": "To **decrease in force or intensity** — and, transitively, to reduce something to a lower level (*abate a nuisance*, *abate the rent*).\n\nWhat abates is a **pressure**, not a quantity: storms, pain, fever, noise, panic, criticism, enthusiasm. You wouldn't say a crowd abated, but the crowd's fury would. It also carries a sense of *relief* — the thing was pressing on you and has eased off. Register is a notch above plain speech: a newsreader says the floodwaters abated; your friend says the rain let up. Watch for **unabated**, which is the form you'll meet most often on the test — \"the shelling continued unabated\" = no let-up at all.", "trap": "⚠️ **abate ≠ abet.**\n- **abate** = die down, lessen\n- **abet** = *help someone do wrong* (as in **aid and abet**)\n\nOne letter, opposite worlds: a storm abates; an accomplice abets.", "trick_line": "Wait with **bated** breath — *bated* is just **abated** with its head cut off: breath beaten down to nothing.", "trick_unpack": "Bated breath isn't *less* breath, it's breath held under pressure — exactly the kind of force-easing that abate describes.", "sentences": ["Only when the monsoon **abated** did the villagers venture back to inspect what the water had taken.", "Give the ibuprofen twenty minutes — the throbbing should **abate** enough for you to sleep."], "in_the_wild": "**Tax abatement** is everyday property-market vocabulary: a city knocks down your property tax for a few years to lure you into building there. Same word, same idea — the burden beaten down.", "etymology": "Old French **abattre** = *\"to beat down\"* (Latin **battuere**, *to beat*). The storm is literally beaten flat.\n\nThat root is a GRE goldmine: **battle**, **batter**, **combat**, **debate** (beat an argument about), **rebate** (a beating-back of the price), and **abattoir** — the slaughterhouse, where things are beaten down.", "one_line": "To die down; to lessen in force or intensity.", "root": "battuere (to beat)", "root_family": ["battle", "batter", "combat", "debate", "rebate", "abattoir", "battery"], "confusables": ["abet", "bate", "bait"], "sense_tags": ["lessening", "subsiding", "intensity", "relief", "reduction"], "register": "formal", "connotation": "neutral", "groups": [3]}, {"word": "abjure", "pos": "v.", "pron": "ab-JOOR", "means": "To **renounce, repudiate, or give up** something formally and solemnly — a belief, a claim, a loyalty, a habit — usually **on the record and under oath**.\n\nYou can *quit* a habit privately. To **abjure** it is to disown it out loud, in a way that binds you: a heretic abjures his heresy, a new citizen abjures foreign allegiance, a reformed man abjures drink. The word carries the weight of ceremony, and often a whiff of pressure — someone made you say it. Compare **renounce** (neutral, can be quiet) and **recant** (specifically taking back something you *said*); abjure covers what you *believed in* or *were bound to*.", "trap": "⚠️ **abjure ≠ adjure.**\n- **abjure** = swear *away* — you reject it\n- **adjure** = swear *at* someone — you earnestly urge or command them\n\n*She abjured her old party; then she adjured her friends to leave it too.*", "trick_line": "**Ab-** (away, as in *absent*, *abduct*) + **-jure** (swear, as in *perjure*) — you don't just drop it, you **swear it away**, out loud.", "trick_unpack": "The *-jure* is what makes it public and binding: abjuring is a ceremony, not a quiet change of heart.", "sentences": ["The treaty obliged every signatory to **abjure** the use of force in settling territorial claims.", "He's **abjured** caffeine about four times now, and the announcements are getting less convincing."], "in_the_wild": "Galileo, hauled before the Inquisition in 1633, was forced to **abjure** his belief that the Earth moves around the Sun — kneeling, reading the renunciation aloud, in the classic textbook scene.", "etymology": "Latin **ab-** (*away*) + **jūrāre** (*to swear*), from **jūs, jūris** = *law, oath*.\n\nThat root is a GRE goldmine: **perjure** (swear falsely), **jury** (sworn panel), **jurisdiction** (where your law speaks), **jurisprudence**, **conjure** (originally: swear together), and **abjure**'s twin **adjure**.", "one_line": "To renounce something solemnly, usually under oath.", "root": "jūrāre (to swear), from jūs, jūris (law, oath)", "root_family": ["perjure", "jury", "jurisdiction", "jurisprudence", "conjure", "adjure", "just"], "confusables": ["adjure", "adjourn", "abrogate", "objurgate", "abstain"], "sense_tags": ["renounce", "forswear", "disavow", "oath", "reject"], "register": "formal", "connotation": "neutral", "groups": [3]}, {"word": "abound", "pos": "v.", "pron": "uh-BOWND", "means": "To exist in **great numbers or great quantity** — to be plentiful to the point of overflow. Two shapes: *opportunities abound* (the things abound), or *the river abounds in fish* (the place abounds **in/with** them).\n\nIt is stronger than \"there are many.\" *Abound* implies the supply is past counting — teeming, everywhere you look. It's also strictly intransitive: things abound, but you can never abound something. The word itself is neutral and slightly bookish, so it takes its colour from its subject: *wildflowers abound* is lush, *errors abound* is damning, and *rumours abound* is the journalist's polite way of saying nobody has checked.", "trick_line": "**abound** ≈ **\"all around\"** — not just present, but present *all around you*.", "trick_unpack": "The near-rhyme carries the nuance: abundance plus everywhere-ness, not a mere count.", "sentences": ["Theories about the collapse **abound**, though hard evidence remains scarce.", "Don't stress about lunch — cheap noodle places **abound** round here."], "in_the_wild": "**\"Rumours abound\"** is a newsroom reflex — you'll meet it in headlines and match reports far more often than in conversation.", "etymology": "Latin **abundāre** = *\"to overflow\"* — *ab-* (off, away) + **unda** (*wave*). The wave breaks past its banks: too much, spilling over.\n\nThat *unda* pays out across the exam: **abundant**, **inundate** (flood in), **undulate** (move in waves), **redundant** (literally *\"overflowing\"* — surplus to need).\n\n🚫 Nothing to do with **bound**. No leaping, no boundary.", "one_line": "To exist in great numbers; to be plentiful, even overflowing.", "root": "unda (wave), via abundāre (to overflow)", "root_family": ["abundant", "abundance", "inundate", "undulate", "redundant"], "confusables": ["abundant", "bound"], "sense_tags": ["plentiful", "overflow", "teeming", "prevalence"], "register": "neutral", "connotation": "neutral", "groups": [1]}, {"word": "abstain", "pos": "v.", "pron": "ab-STAYN", "means": "To **deliberately hold back** from doing something you could perfectly well do — drinking, eating, speaking, voting.\n\nThe key is that it's chosen and usually sustained. You don't abstain because you can't; you abstain because you've decided not to, often on principle, health, or religious grounds. *Refrain* is a single moment of restraint (\"he refrained from replying\"); *abstain* is a standing policy (\"she abstained for a year\"). It also has a precise institutional sense: to formally decline to vote either way — present, counted, but neither yes nor no.", "trick_line": "**Ab-STAIN** — you stay *away* so it can't *stain* you. The stain was available; you declined it.", "trick_unpack": "The hidden word \"stain\" locks in the flavour of self-denial by choice, not by inability.", "sentences": ["Three members voted in favour, two against, and the chairman **abstained**, unwilling to commit the board either way.", "He's **abstaining** this month — no beer, no wine, nothing, and he's insufferable about it."], "in_the_wild": "Any committee, parliament, or UN vote has three buttons: **Yes**, **No**, and **Abstain** — the official way to be present and still refuse to pick a side.", "etymology": "Latin **abs-** (*away*) + **tenēre** (*to hold*) — literally *to hold yourself away from*.\n\nThat **tenēre** is a workhorse root: **contain, retain, detain, sustain, tenacious, tenet, tenure, tenable, abstinence**. Anything that grips or holds.", "one_line": "Deliberately hold back from something, or decline to vote.", "root": "tenēre (to hold) + abs- (away)", "root_family": ["abstinence", "contain", "retain", "detain", "sustain", "tenacious", "tenet", "tenure", "tenable"], "confusables": ["abstemious", "abstinent", "abstruse", "sustain"], "sense_tags": ["self-restraint", "refusal", "voting", "temperance", "self-denial"], "register": "formal", "connotation": "neutral", "groups": [4]}, {"word": "adulterate", "pos": "v.", "pron": "uh-DUL-tuh-rayt", "means": "To make something **impure or inferior by mixing in a foreign, cheaper substance** — watering the milk, cutting the olive oil with sunflower oil, padding the drugs with baking soda.\n\n*Dilute* is neutral and often deliberate housekeeping; **adulterate is an accusation.** It implies secrecy, profit, and degradation — someone sold you the pure thing and handed you the cut thing. It stretches beyond food, too: a text, a doctrine, a bloodline can be adulterated. And you'll meet the negative twice as often as the verb: **unadulterated** = pure, nothing mixed in (\"pure, unadulterated joy\").", "trap": "⚠️ **adulterate ≠ adulate.** *Adulate* (AJ-uh-layt) is to praise someone fawningly — flattery, not fraud. One debases a product, the other inflates a person.", "trick_line": "**Adultery** adds an outsider to a marriage; **adulterate** adds an outsider to the product.", "trick_unpack": "Same Latin root, same idea — something pure is corrupted by letting in what doesn't belong, and both words carry the smell of betrayal.", "sentences": ["Inspectors found the honey had been **adulterated** with corn syrup and sold at a premium.", "Don't **adulterate** a good whisky with Coke, mate."], "in_the_wild": "You've heard the negative form a hundred times without noticing the verb: commentators shouting about **\"pure, unadulterated joy\"** when a last-minute goal goes in — *unadulterated* means nothing has been mixed in to weaken it.", "etymology": "Latin **adulterare** = *\"to corrupt,\"* from **ad-** (to) + **alter** (other) — literally *to make other than it was.*\n\nThat *alter* is a workhorse: **alter, alternative, alter ego, altercation, alternate,** even **altruism** (living for the *other*).", "one_line": "To make impure by mixing in an inferior substance.", "root": "alter (other)", "root_family": ["alter", "alternative", "alter ego", "altercation", "alternate", "altruism", "adultery"], "confusables": ["adulate", "adultery", "adult"], "sense_tags": ["impurity", "contamination", "debasement", "dilution", "fraud"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "advocate", "pos": "v. / n.", "pron": "AD-vuh-kayt (v.) / AD-vuh-kut (n.)", "pron_note": "The ending shifts with the job: you AD-vuh-KAYT for a cause, you are an AD-vuh-kut. Same split as separate, estimate, deliberate.", "means": "**Verb:** to publicly plead for, argue in favour of, recommend a cause or course of action.\n**Noun:** the person doing the pleading — a champion, a supporter who speaks up (and in Scots and much European usage, literally a courtroom lawyer).\n\nThe word is louder than *support*. You can support something silently, in a poll or in your heart; to **advocate** it you have to open your mouth and take a public side. It also carries the flavour of speaking *on behalf of someone else* — the patient, the refugee, the defendant — which is why \"advocate\" attaches so naturally to the powerless. Note the preposition: you advocate *for* a person, but you simply advocate *a policy* (no \"for\" needed in careful prose).", "trick_line": "Hidden inside is **vocate** — *voice*. An advocate lends you theirs.", "trick_unpack": "Support is silent; advocacy is audible, which is the whole difference between agreeing with a cause and advocating one.", "sentences": ["The commission's report **advocated** a phased withdrawal of the subsidy, over the objections of three of its own members.", "She's been a fierce **advocate** for her brother ever since the school tried to quietly drop him from the programme."], "in_the_wild": "**Playing devil's advocate.** It's a real Vatican job — the *advocatus diaboli* was the official appointed to argue *against* a proposed saint, hunting for reasons the candidate didn't deserve canonisation. Someone paid to plead the opposing side.", "etymology": "Latin **ad-** (*to*) + **vocāre** (*to call*) — an advocate was someone **called to your side** in court.\n\nThat *vocāre* root is a GRE goldmine: **vocation** (a calling), **evoke** (call forth), **revoke** (call back), **provoke** (call forth anger), **invoke**, **convoke**, and **equivocate** (call it two ways at once).", "one_line": "To publicly argue for something; one who pleads a cause.", "root": "vocāre (to call)", "root_family": ["vocation", "evoke", "revoke", "provoke", "invoke", "convoke", "equivocate", "vocal", "irrevocable"], "confusables": ["abdicate", "adjudicate"], "sense_tags": ["supporting", "arguing", "persuading", "championing", "legal"], "register": "neutral", "connotation": "depends", "groups": [2]}, {"word": "aggrandize", "pos": "v.", "pron": "uh-GRAN-dyze", "pron_note": "Noun form shifts: aggrandizement is uh-GRAN-diz-muhnt, not -dyze-ment.", "means": "To increase someone's power, wealth, or standing — or, more often, to make them *appear* greater than they are.\n\nThe word rarely comes out neutral. When a general aggrandizes his territory, it's expansion at someone's expense; when a colleague aggrandizes himself in a meeting, it's puffery. Compare **enhance**, which improves the thing itself: aggrandizing usually inflates the *reputation* while the substance stays put. The most common form on the GRE is **self-aggrandizing** — the man who tells the story so that he ends up the hero of it.", "trick_line": "**GRAND** is sitting right there in the middle — to a-GRAND-ize is to make someone *grand*, usually grander than the facts allow.", "trick_unpack": "The hidden word gives you the meaning, and the gap between \"grand\" and \"actually grand\" gives you the sneer.", "sentences": ["Every reform he proposed had the convenient effect of **aggrandizing** the office he happened to hold.", "It was a team effort, but you'd never know it from his **self-aggrandizing** LinkedIn post."], "in_the_wild": "**Self-aggrandizing** is a staple of political journalism — it's the standard polite way a columnist calls a politician's grand gesture an exercise in self-promotion.", "etymology": "Latin **grandis** = *\"great, large,\"* with *ad-* (\"toward\") — literally *to make greater*, via French *agrandir*.\n\nOne root, a useful cluster: **grand**, **grandeur**, **grandiose** (impressively big, or absurdly pretending to be), **grandiloquent** (speaking in swollen language).", "one_line": "To make greater in power, wealth, or apparent importance.", "root": "grandis (great, large)", "root_family": ["grand", "grandeur", "grandiose", "grandiloquent", "aggrandizement"], "confusables": ["aggravate", "grandiose"], "sense_tags": ["self-promotion", "exaggeration", "power", "status", "inflating"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "alacrity", "pos": "n.", "pron": "uh-LAK-ri-tee", "means": "**Brisk, cheerful readiness** — doing something quickly *and* gladly.\n\nTwo ingredients, and the second is the one people forget: **speed** and **willingness**. A grudging assistant can be fast; only an eager one moves with alacrity. The word carries a faint glow of good humour, which is why it so often describes a *response* — you accept an invitation, take an order, volunteer with alacrity.\n\nRegister is formal and slightly dry, so it's a gift to ironists: \"he abandoned his principles with alacrity\" is a sneer disguised as praise.", "trap": "**alacrity ≠ celerity.** *Celerity* is bare speed — a courier, a processor, a horse has celerity. *Alacrity* is speed with a willing spirit behind it. Machines can be celeritous; only people are alacritous.", "trick_line": "You don't *move* with alacrity — you **answer** with it.", "trick_unpack": "Alacrity is nearly always the eager yes to someone's request, which is exactly why willingness, not just speed, sits at the centre of the word.", "sentences": ["The offer of a full professorship was accepted with an alacrity that surprised even the committee.", "Tell him there's free pizza in the kitchen and watch how fast he gets up — never seen such alacrity."], "etymology": "Latin **alacer** = *\"lively, brisk, cheerful.\"*\n\nThe same root walked into Italian and became **allegro** — the tempo marking that doesn't just mean *fast*, it means *fast and bright*. That distinction is the whole word: **allegro is to presto what alacrity is to mere speed.**", "one_line": "Cheerful, eager promptness in doing something.", "root": "alacer (lively, brisk, cheerful)", "root_family": ["allegro", "alacritous"], "confusables": ["celerity", "audacity", "avidity"], "sense_tags": ["eagerness", "willingness", "promptness", "briskness", "enthusiasm"], "register": "formal", "connotation": "positive", "groups": [2]}, {"word": "ambivalent", "pos": "adj.", "pron": "am-BIV-uh-luhnt", "pron_note": "Stress lands on BIV, not on AM — not \"AM-bi-valent.\"", "means": "Having **two opposing feelings about the same thing at the same time** — attraction and repulsion, wanting and dreading.\n\nThe word is routinely misused to mean *meh, don't care*. It means the opposite of that: an ambivalent person cares **twice**, in contradictory directions, and is stuck. Someone **indifferent** feels nothing about the job offer; someone **ambivalent** desperately wants it and desperately doesn't. Zero versus a tug-of-war. Register is educated and slightly clinical — it comes out of psychiatry — so it suggests a mind examining its own divided state rather than a shrug.", "trap": "⚠️ **ambivalent ≠ ambiguous.**\n- **ambivalent** = *the person* is torn between two feelings\n- **ambiguous** = *the thing* can be read two ways\n\nHis reply was ambiguous; his feelings were ambivalent.", "trick_line": "**Ambi-VALENT-ine's Day** — two hearts pulling at once, not a heart that's switched off.", "trick_unpack": "The buried *valentine* keeps feeling *in* the word, blocking the standard error of using it for apathy.", "sentences": ["The committee remained **ambivalent** about the merger, alive to its savings and equally alive to what it would cost the town.", "I'm pretty **ambivalent** about going — I'd love to see everyone, and I'd love to be in bed by nine."], "in_the_wild": "Facebook's old **\"It's complicated\"** relationship status is ambivalence in two words — not *no feelings*, but too many, pointing opposite ways.", "etymology": "Latin **ambi-** = *\"both\"* + **valēre** = *\"to be strong, to be worth.\"* Both sides are **strong** — that's the whole word, and the reason it can't mean indifference.\n\n**ambi-** gives you **ambidextrous** (skilled with both hands), **ambiguous** (drivable both ways), **ambit**.\n**valēre** gives you **valid**, **value**, **valiant**, **prevail**, **convalesce** — all about strength or worth.", "one_line": "Pulled two opposite ways at once; torn, not indifferent.", "root": "ambi- (both) + valēre (to be strong, to be worth)", "root_family": ["ambidextrous", "ambiguous", "ambit", "valid", "value", "valiant", "prevail", "convalesce", "equivalent"], "confusables": ["ambiguous", "ambivalence", "indifferent", "equivocal", "ambient"], "sense_tags": ["mixed feelings", "conflicted", "undecided", "torn", "emotional conflict"], "register": "neutral", "connotation": "neutral", "groups": [2]}, {"word": "ameliorate", "pos": "v.", "pron": "uh-MEEL-yuh-rayt", "pron_note": "Also said uh-MEE-lee-uh-rayt (5 syllables). The stress never moves off MEEL — not \"a-mel-ee-OR-ate.\"", "means": "To make something bad **less bad** — to improve conditions that were painful, harsh, or deficient.\n\nThe word carries a precondition: nothing gets ameliorated unless it was already in a poor state. You *improve* a recipe, a serve, a profit margin; you *ameliorate* suffering, overcrowding, soil, working conditions. And it promises only partial repair — a policy that ameliorates poverty has softened it, not ended it. Register is formal and institutional: it belongs to policy papers, court judgments and NGO reports, and sounds faintly pompous in a kitchen.", "trick_line": "**a-MEAL-iorate** — a hot meal doesn't cure poverty, it just makes it less bad.", "trick_unpack": "The buried \"meal\" gives you both halves of the word: the situation was already grim, and the fix is real but partial.", "sentences": ["Drainage works did something to **ameliorate** the flooding, though the worst-hit streets flooded again that winter.", "A decent night's sleep won't fix the project, but it might **ameliorate** your mood about it."], "in_the_wild": "Standard equipment in policy and legal prose — aid reports and judgments constantly promise \"measures to ameliorate the effects of\" a drought, a recession, a lockdown. Spot it there and you'll notice it never says the problem was solved.", "etymology": "Latin **melior** = *\"better\"* (as in *meliorism*, the belief the world can be made better).\n\nWorth pairing with its opposite: **pejor** = *\"worse\"*, which gives you **pejorative** — a word chosen to make something sound worse. Melior up, pejor down.", "one_line": "To make a bad situation less bad.", "root": "melior (better)", "root_family": ["meliorism", "melioration", "ameliorative"], "confusables": ["alleviate", "meliorate", "ameliorative"], "sense_tags": ["improvement", "relief", "mitigation", "partial-remedy"], "register": "formal", "connotation": "positive", "groups": [2]}, {"word": "amenable", "pos": "adj.", "pron": "uh-MEE-nuh-buhl", "pron_note": "Also heard as uh-MEN-uh-buhl; both are accepted.", "means": "**1.** Willing to go along with a suggestion; open to persuasion, easy to work with.\n**2.** *(of a thing)* Susceptible to a given treatment or method — **amenable to** analysis, surgery, compromise.\n\nAlmost always followed by **to**. Sense 1 describes low resistance, not enthusiasm: someone amenable doesn't push back, which is a step below *eager* and a step above *grudging*. It says nothing about whether they're warm — a cold, formal colleague can be perfectly amenable. Sense 2 is the workhorse of academic and medical prose, where it's coldly neutral: a problem amenable to modelling is simply one the method can get a grip on.", "trap": "⚠️ **amenable ≠ amiable.** *Amiable* = friendly, likeable by nature (a disposition). *Amenable* = willing to comply, or open to a method (a response). A charming host is amiable; a colleague who accepts your timeline without a fight is amenable — and one can easily be either without being the other.", "trick_line": "**Amen**-able — they say *amen* to your plan.", "trick_unpack": "*Amen* means \"so be it\" — quiet assent rather than applause, which is exactly the temperature of the word.", "sentences": ["The tribunal found the minister **amenable** to reason once the political cost of refusal was made plain.", "Ask him — he's usually **amenable** to swapping shifts if you give him a day's notice."], "in_the_wild": "Standard in clinical language: a tumour is described as **amenable to resection**, meaning surgery can actually get at it. Same word you'd use for a cooperative patient — one sense about people, one about problems.", "etymology": "Old French **amener** = *\"to lead to\"* (*à* + *mener*, to lead). Amenable is literally **able to be led** — which covers both senses: a person you can lead to your view, a problem you can lead to a solution. Same *mener* gives **demeanour** (how you conduct — lead — yourself) and **promenade** (a leading-forward, a stroll).\n\n🚫 **No connection to *amare*, \"to love.\"** That root gives *amiable, amicable, amorous* — the sound-alikes that cost marks.", "one_line": "Willing to comply; open to a given method or treatment.", "root": "mener / Latin minare (to lead, to drive)", "root_family": ["demeanour", "promenade"], "confusables": ["amiable", "amicable", "amenity", "malleable"], "sense_tags": ["compliant", "willing", "persuadable", "susceptible", "cooperative"], "register": "formal", "connotation": "neutral", "groups": [2]}, {"word": "amorphous", "pos": "adj.", "pron": "uh-MOR-fuhs", "means": "Without a definite shape — and, by extension, without definite structure: a blob, a fog, a committee with no chain of command, a draft with no argument.\n\nIn science it's purely descriptive: an **amorphous** solid (glass, plastic) is one whose atoms sit in no crystal lattice. Outside the lab it usually carries quiet criticism, but of a cool, diagnostic kind. *Vague* and *wishy-washy* complain about how something was expressed; **amorphous** says the thing itself has no edges yet — nobody has drawn the outline. It describes the object, not the speaker's irritation, which is exactly why it sounds clinical rather than cross.", "trap": "⚠️ **amorphous ≠ amorous.** *Amorous* is Latin *amor*, \"love\" — full of desire. One letter-cluster apart, opposite worlds: an amorous glance, an amorphous plan.", "trick_line": "**a-MORPH-ous** — nothing to *morph*, because there's no shape there to begin with.", "trick_unpack": "Note where the word actually turns up: less often on clouds and jellyfish than on strategies, movements and first drafts whose outlines nobody has bothered to draw.", "sentences": ["The protest remained **amorphous** — no leaders, no demands, no obvious way for the government to negotiate with it.", "Right now the plan's pretty **amorphous**; give me a week and I'll turn it into actual dates."], "in_the_wild": "**Morpheus** in *The Matrix* is the same root — Greek *morphē*, \"form,\" the god who takes any shape in dreams. He's the one who tells Neo none of the shapes around him are real.", "etymology": "Greek **a-** (*without*) + **morphē** (*form*). One root, a lot of GRE mileage: **metamorphosis** (change of form), **morpheme** (smallest unit of meaning-form), **anthropomorphic** (given human form), **polymorphous** (many forms), and **morphine** — named for **Morpheus**, the shape-shifting god of dreams.", "one_line": "Shapeless; lacking clear form, structure or definition.", "root": "morphē (form), with a- (without)", "root_family": ["metamorphosis", "morpheme", "anthropomorphic", "polymorphous", "morphine", "morph"], "confusables": ["amorous", "amoral"], "sense_tags": ["shapeless", "unstructured", "vague", "formless", "undefined"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "anachronistic", "pos": "adj.", "pron": "uh-nak-ruh-NIS-tik", "pron_note": "The noun shifts its stress: anachronism = uh-NAK-ruh-niz-um.", "means": "Belonging to a different time period than the one it appears in — chronologically misplaced.\n\nIt cuts two ways. Neutrally, it's a **factual error**: a wristwatch on a gladiator, a character in 1850 mentioning a telephone. Judgementally, it's a **verdict on something that has outlived its era** — a rule, an institution, a job title that should have died decades ago. That second use is where the GRE lives, and it carries a dry contempt: calling a law anachronistic says it isn't just old, it's *absurd* that it survived. Note the direction — anachronistic things are almost always relics dragged forward, not things arriving too early.", "trap": "⚠️ **anachronistic ≠ anarchistic.** *Anachronistic* = out of **time** (*chronos*). *Anarchistic* = against **rule** (*archos*). One letter's difference on the page, two unrelated roots.", "trick_line": "**CHRON** sits right in the middle — a clock stuck in the wrong century.", "trick_unpack": "Spot *chron* (as in *chronological*) inside the word and you've got the whole meaning: the timeline is off.", "sentences": ["The committee dismissed the dress code as an **anachronistic** relic of a workplace no one under fifty remembered.", "Fax machines in a 2026 office? Completely **anachronistic**."], "in_the_wild": "The **Starbucks cup left on the table in *Game of Thrones*** — a paper coffee cup in medieval Westeros, the most-screenshotted anachronism in television history.", "etymology": "Greek **ana-** (*back*) + **chronos** (*time*) — literally \"back-timed.\"\n\n*Chronos* is a workhorse root: **chronic** (lasting over time), **chronology**, **chronicle**, **synchronise** (same-time), **chronometer**.", "one_line": "Belonging to the wrong era; a survival from an earlier time.", "root": "chronos (time)", "root_family": ["chronic", "chronology", "chronicle", "synchronise", "chronometer", "chronological"], "confusables": ["anarchistic", "anachronism", "anomalous"], "sense_tags": ["outdated", "time", "misplaced", "obsolete"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "anomalous", "pos": "adj.", "pron": "uh-NOM-uh-luhs", "pron_note": "Stress shifts from the noun: **an**omaly is AN-uh-muh-lee, but **anom**alous is uh-NOM-uh-luhs.", "means": "Departing from what is standard, expected, or predicted by the pattern — irregular, off-model.\n\nThis is the lab-coat word for *odd*. **Weird** is a reaction, **aberrant** hints that something has gone morally or biologically wrong, but **anomalous** passes no judgement at all: it simply says *this case does not fit the model*. It also quietly assumes the model is sound and the case is the outlier — which is why a scientist calls a reading anomalous before deciding whether it's an error, a fluke, or a discovery.", "trap": "⚠️ **anomalous ≠ analogous.**\n- **anomalous** = doesn't fit the pattern\n- **analogous** = parallel to something else, comparable\n\nAn anomalous result breaks the trend; an analogous case matches a different one.", "trick_line": "**a-NOM-alous** — hear the stressed **NOM** as *norm* with the r rubbed out: the thing that won't sit on the norm.", "trick_unpack": "It's a pure sound hook rather than the true root, but it locks in the key idea — the word labels something as off-pattern without calling it wrong.", "sentences": ["The committee flagged an **anomalous** spike in third-quarter revenue: no launch, no campaign, just a number that refused to fit the curve.", "Look, one good week is **anomalous** — don't rebuild the whole strategy around it."], "in_the_wild": "In *The Matrix Reloaded*, the Architect calls Neo **\\\"the anomaly\\\"** — the one variable the system's model can't account for. That's the word exactly: not evil, just unpredicted.", "etymology": "Greek **an-** (*not*) + **homalos** (*even, level*), from **homos** = *\"same.\"* Literally *not level with the rest*.\n\nThat root gives you **homogeneous**, **homonym**, **homologous** — all \"same-ness\" words.\n\n🚫 **Not from *nomos* (law)**, despite the look of *autonomous* and *economy*. Anomalous breaks a *pattern*, not a rule.", "one_line": "Not fitting the expected pattern; irregular, off-model.", "root": "an- (not) + homalos (even, level), from homos (same)", "root_family": ["anomaly", "homogeneous", "homonym", "homologous", "anomie"], "confusables": ["analogous", "autonomous", "anonymous", "anomie"], "sense_tags": ["irregular", "outlier", "unexpected", "atypical", "deviating"], "register": "formal", "connotation": "neutral", "groups": [3]}, {"word": "antipathy", "pos": "n.", "pron": "an-TIP-uh-thee", "pron_note": "Stress on TIP, not the \"anti-\" — never AN-tee-path-ee.", "means": "A deep, settled **dislike or aversion** toward someone or something — usually instinctive rather than argued for.\n\nHatred runs hot; antipathy runs cold. It's a standing position, not a flare-up: you can be perfectly civil to someone you feel antipathy for, and it often comes with no stated reason (\"a natural antipathy to authority\"). The word is formal and slightly clinical — a reviewer or a diplomat's word for \"can't stand,\" which is why it also works for things, not just people: an antipathy to bureaucracy, to sentimentality, to being told what to do.", "trap": "⚠️ **antipathy ≠ apathy.**\n- **antipathy** = feeling **against** — you care, negatively\n- **apathy** = feeling **nothing** — you can't be bothered either way", "trick_line": "You don't *feel* antipathy in a moment — you *hold* it toward someone, for years.", "trick_unpack": "The verbs it keeps company with (hold, harbour, a long-standing antipathy *toward*) tell you it's a permanent setting rather than a burst of temper.", "sentences": ["His antipathy toward the new director was never voiced, but it shaped every vote he cast.", "I've got a lifelong antipathy to group projects, and nothing you say will fix it."], "etymology": "Greek **anti-** (*against*) + **pathos** (*feeling, suffering*). The *-pathy* family is one of the best deals in GRE vocabulary — learn the prefixes and you get four words at once:\n\n- **sym**pathy = feeling *with*\n- **em**pathy = feeling *into*\n- **a**pathy = feeling *without*\n- **anti**pathy = feeling *against*\n\nSame *pathos* also gives **pathetic**, **pathos**, and — via \"suffering, disease\" — **pathology**.", "one_line": "Deep, settled, instinctive dislike of someone or something.", "root": "anti- (against) + pathos (feeling)", "root_family": ["sympathy", "empathy", "apathy", "pathos", "pathetic", "pathology", "antithesis", "antidote"], "confusables": ["apathy", "empathy", "antiphony"], "sense_tags": ["dislike", "aversion", "hostility", "distaste"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "approbation", "pos": "n.", "pron": "ap-ruh-BAY-shuhn", "means": "Formal or official **approval; praise given from a position to bestow it** — a nod that counts.\n\nApproval is what a friend gives you; approbation is what an institution, a critic, or a superior gives you. It carries weight and audience: it's the word for a board's blessing, a public's acclaim, a mentor's endorsement. Slightly stiff-collared and old-fashioned — nobody says it about a sandwich.", "trap": "⚠️ **approbation ≠ opprobrium.** Same *prob-* root, opposite poles: **approbation** = public praise; **opprobrium** = public disgrace.", "trick_line": "**Approbation = approval + ovation.**", "trick_unpack": "It's approval delivered publicly and formally, with something of an audience clapping behind it.", "sentences": ["The proposal was adopted only after it won the **approbation** of the standing committee.", "He kept glancing at his dad after the recital, fishing for a bit of **approbation**."], "in_the_wild": "Jane Austen's characters live on this word — in *Pride and Prejudice* people are forever seeking or withholding one another's **approbation**, which tells you the register exactly: drawing-room, formal, socially official approval.", "etymology": "Latin **probare** = *\"to test, to prove good\"* (from *probus*, \"upright, honest\"), plus *ad-* \"toward\" — so *approve after testing*.\n\nThat root pays out across the exam: **probity** (proven integrity), **probation** (a testing period), **probe**, **probable**, **reprobate** (tested and found *bad*), **opprobrium**.", "one_line": "Formal, official praise or approval from someone whose word counts.", "root": "probare (to test, prove good), from probus (upright)", "root_family": ["probity", "probation", "probe", "probable", "reprobate", "opprobrium", "approve", "prove"], "confusables": ["opprobrium", "reprobation", "approximation"], "sense_tags": ["praise", "approval", "endorsement", "official-sanction"], "register": "formal", "connotation": "positive", "groups": [4]}, {"word": "arcane", "pos": "adj.", "pron": "ar-KAYN", "means": "Known or understood by **very few** — obscure, mysterious, the property of specialists or initiates.\n\nThe word carries a whiff of *restricted access*: arcane material isn't merely hard, it's **walled off**, whether by secrecy (rites, spells) or by sheer impenetrable specialism (the arcane provisions of the tax code). Two flavours, then — solemn and magical, or dry and faintly exasperated. When a journalist calls a rule arcane, they mean *needlessly* obscure, and someone should have simplified it years ago.", "trap": "⚠️ **arcane ≠ archaic.**\n- **arcane** = *hidden* — few people understand it\n- **archaic** = *old* — nobody uses it any more\n\nA medieval spelling is archaic. A working rule nobody can decipher is arcane.", "trick_line": "**Arcane** keeps its secrets in an **ark** — sealed, and only the initiated hold the key.", "trick_unpack": "The point isn't difficulty but *access*: arcane knowledge is shut away, and you're on the outside of the box.", "sentences": ["Behind the tapestry lay a chamber of **arcane** symbols, meaningless to anyone outside the order.", "Getting reimbursed involves some **arcane** three-form process only Priya in accounts actually understands."], "in_the_wild": "Netflix's **Arcane** (the *League of Legends* series) — the title is doing real work: the plot turns on hextech, a hidden magic only a handful of people can wield or comprehend.", "etymology": "Latin **arca** = *\"chest, strongbox\"* → **arcānus** = *\"shut in a box, secret.\"* Same **arca** gives English **ark** — Noah's, and the Ark of the Covenant, which only priests could approach.\n\nBehind it sits **arcēre**, *\"to shut in, keep away\"* — which also yields **coerce** (*co-* + *arcēre*, shut someone in) and **exercise** (*ex-* + *arcēre*, drive out).", "one_line": "Understood by very few; obscure, secret, specialist", "root": "arca (chest, box) / arcēre (to shut in)", "root_family": ["ark", "arcanum", "coerce", "exercise"], "confusables": ["archaic", "arcade", "arcadian"], "sense_tags": ["obscure", "secret", "specialist", "mysterious", "esoteric"], "register": "formal", "connotation": "depends", "groups": [3]}, {"word": "arduous", "pos": "adj.", "pron": "AR-joo-uhs", "pron_note": "British speakers often say AR-dyoo-uhs.", "means": "Demanding severe, **sustained** effort; laborious and wearying.\n\n*Difficult* is about complexity — a hard puzzle is difficult in an instant. *Arduous* is about **exertion stretched over time**: the climb, the training, the three-year lawsuit. It describes tasks, journeys and processes, never people, and it carries a faint note of respect — an arduous thing is worth finishing, which is why it pairs so naturally with *journey*, *task*, *negotiations*, *ascent*.", "trap": "**arduous ≠ ardent.** *Arduous* = exhausting to do (Latin *arduus*, steep). *Ardent* = burning with passion (Latin *ardēre*, to burn). An **ardent** fan endures an **arduous** queue.", "trick_line": "Put an H on the front: **(h)arduous** — *hard* + drags on *continuous*ly.", "trick_unpack": "The hidden *hard* gives you the difficulty and the *-uous* tail gives you the part that matters — it goes on and on.", "sentences": ["The restoration of the fresco proved an **arduous** undertaking, occupying two conservators for the better part of a decade.", "Four buses and a ferry to get there — honestly, the trip was more **arduous** than the wedding."], "in_the_wild": "News writing has practically welded the phrase together: refugees, expedition teams and hostages all make **\"an arduous journey.\"** If you've read a headline, you've met the word.", "etymology": "Latin **arduus** = *\"steep, high.\"* The original arduous thing was a hillside — hard because it's uphill, and uphill all the way. That steepness is still doing the work in the modern sense.", "one_line": "Hard in a way that demands long, tiring effort.", "root": "arduus (steep, high)", "root_family": ["Ardennes"], "confusables": ["ardent", "arid", "onerous"], "sense_tags": ["difficult", "laborious", "strenuous", "wearying", "sustained-effort"], "register": "neutral", "connotation": "negative", "groups": [3]}, {"word": "artless", "pos": "adj.", "pron": "AHRT-luhs", "means": "**Without guile** — natural, unaffected, saying exactly what you mean because it never occurred to you to do otherwise. A secondary sense: **unskilled, crude** (a genuinely artless drawing).\n\nThe GRE almost always wants the first sense, and the trick is that the *art* being denied is **artifice** — cunning, calculation, technique — not painting. So an artless remark isn't clumsy, it's uncalculated. Tone is usually warm but faintly condescending: you'd call a child's honesty artless, and a diplomat's too, but only to say she'd never survive the job. Compare *naive*, which says the person is wrong about the world; *artless* only says they aren't working an angle.", "trap": "⚠️ **artless ≠ the opposite of artistic. artful ≠ artistic either.**\n- **artless** = *guileless*, no cunning\n- **artful** = *crafty*, full of cunning\n\nNeither word is about art galleries.", "trick_line": "Artless: **less art, more heart.**", "trick_unpack": "The *art* being subtracted is artifice — scheming, angling, technique — so what's left is unguarded sincerity.", "sentences": ["Her testimony was so **artless** that the jury believed her before the lawyers had finished objecting.", "He asked, with **artless** curiosity, how much everyone at the table earned."], "in_the_wild": "The **Artful Dodger** in *Oliver Twist* is a pickpocket, not a painter — proof that this *art* means cunning. Artless is exactly what the Dodger is not.", "etymology": "Latin **ars, artis** = *\"skill, craft\"* — which slid easily into *\"trickery.\"* That gives **artifice**, **artificial**, **artisan**, and — via *in- + ars* — **inert**, literally *\"without skill,\"* now \"doing nothing at all.\"", "one_line": "Guileless and unaffected; sometimes simply unskilled.", "root": "ars, artis (skill, craft)", "root_family": ["artifice", "artificial", "artisan", "artful", "inert", "inertia"], "confusables": ["artful", "artistic", "aimless"], "sense_tags": ["guileless", "sincere", "naive", "unaffected", "unskilled"], "register": "formal", "connotation": "depends", "groups": [3]}, {"word": "ascetic", "pos": "adj. / n.", "pron": "uh-SET-ik", "pron_note": "Not *acetic* (uh-SEE-tik), which is vinegar.", "means": "**Adj.:** severely self-denying — no luxury, no comfort, no indulgence. **Noun:** a person who lives that way, usually for religious or moral discipline.\n\nThe defining thing is that it's **chosen**. A poor man is deprived; an ascetic has *refused*. That's why the word carries either quiet admiration (monk, saint, serious artist) or a faint charge of extremism, depending on who's using it — and why \"he lives an ascetic life\" says something about his will, not his bank balance.\n\nIt stretches to style, too: an **ascetic** room, an ascetic prose style — stripped bare on purpose.", "trap": "⚠️ **ascetic ≠ aesthetic.** *Ascetic* (uh-SET-ik) = stripped of pleasure. *Aesthetic* (es-THET-ik) = concerned with beauty. One letter, opposite instincts — and the GRE knows it.", "trick_line": "**Asc-etic** rhymes with **athl-etic** — both are in training; the ascetic just trains at *going without*.", "trick_unpack": "It locks in the key nuance: this is disciplined self-denial by choice, not poverty by accident.", "sentences": ["The philosopher retreated to an **ascetic** cell furnished with a cot, a lamp, and nothing else.", "Since January he's been on this **ascetic** kick — no sugar, no drinking, up at five."], "in_the_wild": "Before he became the Buddha, Siddhartha spent six years as an **ascetic** — starving himself down to the ribs — then rejected it for the Middle Way. The whole story turns on the word.", "etymology": "Greek **askēsis** = *\"training, exercise\"* — the word for an athlete's regimen. Early Christian monks borrowed it for spiritual training, and the gym-work sense hardened into fasting and self-denial. So an ascetic is literally someone **in training**.", "one_line": "Severely self-denying, by choice; a person living so.", "root": "askēsis / askein (training, to exercise)", "root_family": ["asceticism"], "confusables": ["aesthetic", "acetic", "acerbic"], "sense_tags": ["self-denial", "austerity", "abstinence", "discipline", "monastic"], "register": "formal", "connotation": "depends", "groups": [3]}, {"word": "assuage", "pos": "v.", "pron": "uh-SWAYJ", "pron_note": "Two syllables, not three — the -uage is \"swayj\", never \"swahzh\" or \"soo-ahj\".", "means": "To **make a painful feeling less intense** — grief, guilt, fear, anger, hunger, thirst.\n\nThe object is almost always an *emotion*, not a person: you assuage someone's **fears**, but you mollify the angry **man**. And it's partial relief, not a cure — assuaged guilt is quieter guilt, still there. The register is formal and slightly consoling, the language of eulogies, diplomacy and financial press.", "trick_line": "**Assuage** near-rhymes with **a stage** — grief drops down a stage, it doesn't leave the stage.", "trick_unpack": "The word promises reduction, never removal.", "sentences": ["Nothing the priest said could **assuage** her grief; it only made the silence afterwards easier to bear.", "He bought her flowers to **assuage** his guilt about forgetting the anniversary."], "in_the_wild": "Business-page boilerplate: *\"The central bank moved to **assuage** investor fears.\"* Whenever an institution is doing damage control, this is the verb the headline reaches for — always with *fears*, *concerns*, or *doubts*.", "etymology": "Latin **ad-** (*to*) + **suavis** (*sweet*) — literally **to sweeten** something bitter. That root gives you **suave** (smooth, sweet-mannered) and, via the cousin verb *suadēre* \"to urge sweetly,\" **persuade**, **dissuade** and **suasion**. English **sweet** is the same ancient root.", "one_line": "To ease a painful feeling — lessen it, not remove it.", "root": "suavis (sweet)", "root_family": ["suave", "suavity", "persuade", "dissuade", "suasion", "sweet"], "confusables": [], "sense_tags": ["soothing", "relieving", "easing-pain", "calming", "satisfying-appetite"], "register": "formal", "connotation": "neutral", "groups": [3]}, {"word": "audacious", "pos": "adj.", "pron": "aw-DAY-shuhs", "means": "Daring far beyond what caution allows — either **boldly original** (an audacious plan, an audacious heist) or **shamelessly cheeky** (an audacious lie, an audacious request).\n\nWhich one you get depends entirely on whether the speaker admires the risk. *Brave* praises; *impudent* condemns; **audacious** sits on the fence and takes its charge from the sentence around it. Either way the person has ignored a limit everyone else respected — the only question is whether the room applauds or gasps. Note the strength: audacious is never mild, and never accidental.", "trick_line": "**au-DAY-shus** — the noun is *audacity*, and you've heard it snarled: **\"the audacity!\"**", "trick_unpack": "That snarl is the cheeky half of the word, so remember the adjective as the same nerve viewed from a friendlier angle.", "sentences": ["The firm made an **audacious** bid for a rival three times its size, and the market did not stop talking about it for a week.", "He had the **audacious** cheek to ask for a raise seven days after writing off the company van."], "in_the_wild": "Obama's bestseller **_The Audacity of Hope_** — the title works precisely because it's a boast and a confession at once: hoping that hard is nerve.", "etymology": "Latin **audēre** = *\"to dare\"* → *audāx, audācis* (bold) → **audacity**.\n\n🚫 **Not *audīre*, \"to hear.\"** That's the other family entirely: *audio, audience, audible, audition, auditor*. Same first three letters, no relation.", "one_line": "Daring past all limits — admirably or shamelessly.", "root": "audēre (to dare)", "root_family": ["audacity", "audacious"], "confusables": ["mendacious", "audible", "auspicious"], "sense_tags": ["boldness", "daring", "impudence", "risk-taking", "nerve"], "register": "neutral", "connotation": "depends", "groups": [2]}, {"word": "austere", "pos": "adj.", "pron": "aw-STEER", "means": "**1.** Severe or stern in manner and appearance. **2.** Plain to the point of bareness — no ornament, no comfort, no indulgence.\n\nThe word describes a *stripping away*, not a cruelty. An austere man isn't vicious, he's unsmiling and unbending; an austere room isn't ugly, it's empty of anything you'd want. Crucially, it can cut either way: austerity is a discipline, so the word carries a faint respect that *grim*, *bleak*, or *harsh* never do — a monastery, a Bauhaus chair, and a budget with the perks cut out are all austere. Say it of a person and it chills; say it of a design and it can be praise.", "trick_line": "**Austere rhymes with severe — and it means the bare, stripped kind of severe.**", "trick_unpack": "Lock the rhyme, then add the one thing severe lacks: what's austere has had everything soft *removed*.", "sentences": ["His prose is **austere** — no adjectives, no flourishes, nothing but what the sentence needs to stand.", "The flat was clean but weirdly **austere**: one chair, one lamp, and not a single photo on the wall."], "in_the_wild": "**Austerity** — the word every finance minister reaches for when the budget is being cut to the bone. Same word, wearing a suit.", "etymology": "Greek **austērós** = *\"drying, harsh to the tongue\"* — first said of wine and unripe fruit that puckers your mouth. That's the whole flavour of the word: something with all the sweetness taken out.", "one_line": "Stern, or stripped bare of comfort and ornament.", "root": "austērós (harsh, drying to the tongue)", "root_family": ["austerity"], "confusables": ["ascetic", "severe"], "sense_tags": ["stern", "unadorned", "self-denying", "plain", "strict"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "avaricious", "pos": "adj.", "pron": "av-uh-RISH-uhs", "means": "Greedy for **money and possessions** — grasping, hoarding, never satisfied.\n\nNot general greed: this word is specifically about **wealth**. A glutton isn't avaricious; a landlord raising rent on a dying tenant is. It's also a heavy, moralising word — *greedy* is what you call a child reaching for a third biscuit, **avaricious** is what a judge or a novelist calls a man whose whole character has been eaten by money. Using it is passing sentence.", "trap": "⚠️ **avaricious ≠ voracious.**\n- **avaricious** = hungry for **money**\n- **voracious** = hungry, full stop — huge appetite for food, or for books\n\nA voracious reader is a compliment. An avaricious one would be stealing the library.", "trick_line": "**av-a-RICH-us** — the stressed syllable is literally **RICH**.", "trick_unpack": "Say it aloud and the word tells you what it wants: riches, not food, not power.", "sentences": ["The estate passed to an **avaricious** cousin who sold the orchards within the month.", "He's not ambitious, he's **avaricious** — he'd bill his own mother for the taxi."], "in_the_wild": "**Avarice** is the formal name of one of the **seven deadly sins** — the one everyone else just calls Greed.", "etymology": "Latin **avēre** = *\"to crave\"* → **avarus**, *\"greedy.\"*\n\nSame craving root gives you **avid** — an *avid* golfer craves the game, an *avaricious* one craves the prize money.", "one_line": "Greedy for money; grasping and never satisfied.", "root": "avēre (to crave) → avarus (greedy)", "root_family": ["avarice", "avid", "avidity"], "confusables": ["voracious", "rapacious", "veracious"], "sense_tags": ["greed", "money", "hoarding", "miserliness"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "banal", "pos": "adj.", "pron": "buh-NAL", "pron_note": "Rhymes with canal. BAY-nuhl and buh-NAHL are also accepted, but buh-NAL is safest.", "means": "So ordinary, so predictable, so often repeated that it has gone flat — a remark, plot, compliment or design with no originality left in it.\n\n**Banal** is a verdict, not a description. *Common* and *ordinary* just report frequency; **banal** adds contempt and boredom — the thing is stale *and* the speaker is tired of it. It attaches most naturally to things that were *supposed* to be interesting: art, conversation, writing, ideas. A bus timetable can't be banal; a poem, a wedding speech, or a corporate slogan very much can.", "trick_line": "**Ban**al ideas should be **banned** — you've heard them a thousand times.", "trick_unpack": "The hidden word **ban** is also the actual root, and the exasperation in \"ban it already\" is exactly the contempt the word carries.", "sentences": ["The gallery's much-hyped centrepiece proved **banal** — a slogan in neon, a gesture exhausted decades ago.", "His best man's speech was so **banal** I could have written it myself: she's the lucky one, he's punching above his weight, to the happy couple."], "in_the_wild": "Hannah Arendt's phrase **\"the banality of evil\"** — her report on the Eichmann trial, arguing the worst crimes were carried out by a dull functionary doing paperwork, not a monster.", "etymology": "From Old French **banal**, \"shared by all the lord's tenants,\" from **ban** — a feudal lord's proclamation summoning everyone. The village mill and oven were *banal*: everybody had to use them. Compulsory for all → used by all → utterly common → dreary.\n\nSame **ban** root: **banish**, **banns** (of marriage, proclaimed publicly), **abandon**, **contraband**, **bandit** (a man proclaimed an outlaw).", "one_line": "So unoriginal and overused it has gone flat.", "root": "ban (feudal proclamation, summons to all)", "root_family": ["banish", "banns", "abandon", "contraband", "bandit"], "confusables": ["venal", "baneful"], "sense_tags": ["unoriginal", "commonplace", "clichéd", "dull"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "belie", "pos": "v.", "pron": "bih-LEYE", "means": "Two senses, one idea:\n**1.** To **give a false impression of** — the surface misrepresents what's underneath. *Her steady voice belied her panic.*\n**2.** To **show something to be false** — evidence contradicts a claim. *The sales figures belie his optimism.*\n\nThe direction is what gets tested. The **subject of *belie* is the liar**: the calm face, the young skin, the cheerful forecast. Whatever follows the verb is the truth being covered up or knocked down. So *belie* never means \"reveal\" — though the sentence usually leaves you knowing the hidden truth anyway, which is exactly why people flip it.\n\nRegister is written and formal — reviews, obituaries, analysis. Said aloud it sounds bookish.", "trap": "⚠️ **belie ≠ betray.** They fit the identical sentence frame and point opposite ways:\n- *His grin **belied** his nerves* = the grin **hid** them.\n- *His grin **betrayed** his nerves* = the grin **gave them away**.\n\nOne conceals, one leaks.", "trick_line": "**Be-lie — the appearance *be a lie*.**", "trick_unpack": "The thing doing the belying is the one telling the lie, so whatever comes after it is the truth being denied.", "sentences": ["The manor's peeling shutters **belied** the fortune still sitting in the family trust.", "Don't let the tiny shopfront fool you — it **belies** how much money they move."], "in_the_wild": "A stock line in sports and music writing: *\"her slight frame belies the power in her serve,\" \"his boyish face belies twenty years on the road.\"* Same shape every time — small surface, big hidden truth.", "etymology": "Old English **belēogan** = *\"to deceive by lying\"* — **be-** (\"about, over\") + **lēogan**, \"to tell a lie.\" The word is literally *to lie about something*.\n\n🚫 Not the *lie* that means recline (Old English *licgan*), and no relation to **believe**, despite the look.", "one_line": "To disguise the truth about; to contradict or disprove.", "root": "be- + lēogan (to tell a lie)", "root_family": ["lie (untruth)", "liar"], "confusables": ["betray", "believe", "belittle"], "sense_tags": ["misrepresent", "contradict", "conceal", "disprove"], "register": "formal", "connotation": "neutral", "groups": [1]}, {"word": "benign", "pos": "adj.", "pron": "bih-NINE", "pron_note": "The g is silent — never \"ben-ig-n\". It comes back in benignant and malignant.", "means": "Gentle and kindly in manner; harmless in effect; **medically, not cancerous**; of weather or conditions, mild and favourable.\n\nMost of its force is **negative** — it says what *isn't* there. A benign tumour isn't a healthy one, just one that won't kill you; a benign smile is pleasant but tells you nothing. Compare **benevolent**, which is active goodwill (someone *doing* good), and **benign**, which is mostly the absence of threat. That's why GRE passages use it for things that look dangerous and turn out not to be: a benign policy, a benign amendment, benign neglect.", "trap": "⚠️ **benign ≠ benighted.** *Benighted* (bih-NYE-tid) means **ignorant, unenlightened** — from *night*, morally in the dark. Nothing to do with kindness: a benighted era is a backward one.", "trick_line": "**benign rhymes with *fine* — and \"it's fine\" is exactly how much reassurance it gives.**", "trick_unpack": "Fine isn't good, it's just not bad — which is the whole register of the word.", "sentences": ["The tribunal dismissed the clause as **benign**, a formality with no power to compel anyone.", "The dog looks terrifying but he's completely **benign** — he'll just drool on you."], "in_the_wild": "The word you wait for after a biopsy. **\"The results came back benign\"** is the good-news line in every hospital scene — and note what it actually promises: not cured, just not cancer.", "etymology": "Latin **bene** = *\"well\"* (+ *gignere*, \"to be born\" — literally *well-born*, hence well-natured).\n\n**bene** is one of the best roots on the GRE: **benefit, benefactor, benevolent, benediction, beneficiary**. Its twin is **male-** = *badly*: **malign, malevolent, malediction, malefactor**. Learn the pair and you get twenty words — *benign* and *malign* are exact opposites, built the same way.", "one_line": "Harmless or kindly; in medicine, not cancerous.", "root": "bene (well) + gignere (to be born)", "root_family": ["benevolent", "benefactor", "benediction", "beneficiary", "benefit", "malign", "malevolent", "malediction"], "confusables": ["benighted", "benignant", "malign", "benevolent"], "sense_tags": ["harmless", "kindly", "mild", "non-threatening", "medical"], "register": "neutral", "connotation": "positive", "groups": [2]}, {"word": "betray", "pos": "v.", "pron": "bih-TRAY", "means": "**1.** To hand over or be disloyal to someone who trusted you — a friend, a country, a cause, a confidence.\n**2.** To **reveal unintentionally** something you were trying to keep hidden.\n\nSense 2 is the one the GRE cares about, and it turns on *involuntariness*. You don't betray a feeling on purpose — the subject is usually a small traitorous detail (a tremor, a flush, a pause) that leaks the truth its owner was working to conceal. \"His smile **showed** his nerves\" is odd; \"his smile **betrayed** his nerves\" is exact, because it implies the nerves were meant to stay private. Even in this quiet sense the word keeps a whiff of treachery: something has gone over to the other side.", "trap": "⚠️ **betray ≠ belie.** In the same sentence frame they point opposite ways:\n- Her calm face **betrayed** her panic → the panic *got out*.\n- Her calm face **belied** her panic → the panic stayed *hidden*; the face lied about it.", "trick_line": "**Be-TRAY** — you serve your friend up to the enemy on a **tray**, and if your hands shake, the tray hands over your secret too.", "trick_unpack": "Both senses are one act — something gets *handed over* against someone's interest, whether it's a person or a piece of the truth.", "sentences": ["A faint tremor in his voice betrayed the confidence his words were claiming.", "I told her I didn't mind, but my face betrayed me instantly."], "in_the_wild": "Poker's whole vocabulary runs on this sense: a **tell** is any twitch or hesitation that *betrays* your hand — you never mean to show it, which is exactly the point.", "etymology": "Latin **tradere** = *trans* (\"across\") + *dare* (\"give\") — **to hand over**.\n\nThe same root splits into opposite moralities: **tradition** (knowledge handed *down* to you) and **treason / traitor / betray** (a person handed *over* to the enemy). Also **extradite** — handed across a border.", "one_line": "To hand over disloyally; to reveal what was meant to stay hidden.", "root": "tradere (to hand over)", "root_family": ["tradition", "traitor", "treason", "extradite", "traduce"], "confusables": ["belie"], "sense_tags": ["disloyalty", "revealing", "unintentional-disclosure", "treachery"], "register": "neutral", "connotation": "negative", "groups": [3]}, {"word": "brazen", "pos": "adj. / v.", "pron": "BRAY-zuhn", "means": "**Adj.:** boldly and openly wrong — doing the improper thing in full view, with no shame and no attempt to hide it.\n**Verb (usually *brazen it out*):** to face down an accusation by refusing to look embarrassed.\n\nBold is admiring, audacious can be admiring, **brazen almost never is**. The scandal isn't the act, it's the *openness* — a brazen lie is one told to your face by someone who knows you know. It carries a hint of contempt for the audience: the person isn't sneaking, because sneaking would concede that the rule mattered.", "trap": "⚠️ **brazen ≠ blazon.**\n- **brazen** = shameless (from *brass*)\n- **blazon** = to display or proclaim publicly, as on a coat of arms — hence **emblazoned** across a banner.\n\nBoth are about being seen; only *brazen* is about not caring.", "trick_line": "**Brazen has *brass* in it — and brass doesn't blush.**", "trick_unpack": "The metal face is the whole point: the person can't redden, so the boldness reads as shamelessness rather than courage.", "sentences": ["The minister offered a **brazen** denial, contradicting a recording that had been broadcast an hour earlier.", "He just walked out with the office monitor under his arm — you have to admire the **brazen** cheek of it."], "in_the_wild": "Newsrooms have a fixed collocation for it: a **brazen daylight robbery**. The word is doing real work there — not that the thieves were skilled, but that they didn't bother with the dark.", "etymology": "Old English **bræsen** = *\"made of brass.\"* The metaphor jumped from the metal to the face: hard, unblushing, unmoveable. That's why you can **brazen it out** — put on a brass front and refuse to concede that you've been caught.", "one_line": "Shamelessly bold — openly wrong and not embarrassed about it.", "root": "Old English bræs (brass)", "root_family": ["brass", "brazier", "brazen it out"], "confusables": ["brash", "blazon", "emblazon", "brazier"], "sense_tags": ["shameless", "bold", "impudent", "defiant", "unabashed"], "register": "neutral", "connotation": "negative", "groups": [2]}, {"word": "bucolic", "pos": "adj.", "pron": "byoo-KOL-ik", "pron_note": "Not BUCK-uh-lik — the first syllable is byoo, as in beautiful.", "means": "Of the countryside, and **charmingly** so: green fields, grazing animals, unhurried quiet.\n\nThe word never describes farm work as work. *Agrarian* is economic, *rustic* is rough and a bit unpolished, *rural* is just a census category — **bucolic** is the countryside seen from outside and admired. It carries a faint whiff of the picturesque: someone calling a village bucolic is enjoying the view, not mucking out the barn. Occasionally used drily, exactly because that gap between the pretty picture and the actual mud is easy to poke at.", "trick_line": "**Bu**colic, **bo**vine — same cow. Bucolic is cow-country as *scenery*.", "trick_unpack": "The *bou-* is Greek for ox, so the word literally means cowherd-ish — and cows in a field are the postcard, not the labour.", "sentences": ["The novel opens on a **bucolic** valley of hedgerows and slow rivers, all of which the railway will have swallowed by chapter nine.", "Two days of **bucolic** bliss and then the Wi-Fi died and we drove straight back to the city."], "in_the_wild": "Estate agents and travel brochures live on this word — \"bucolic charm\", \"bucolic setting\" is standard copy for any cottage with a field near it. If you've read a countryside listing, you've read *bucolic*.", "etymology": "Greek **boûs** = *ox, cow* → **boukolos** = *cowherd*. The same **bou-** pays off elsewhere: **bovine** (cow-like), **bulimia** (*bous* + *limos*, \"ox-hunger\"), and **butter** (*bou-tyron*, cow-cheese).", "one_line": "Charmingly rural — the countryside as a pretty picture.", "root": "boûs (ox, cow) → boukolos (cowherd)", "root_family": ["bovine", "bulimia", "butter", "boustrophedon"], "confusables": ["colic", "bubonic"], "sense_tags": ["rural", "pastoral", "idyllic", "countryside", "picturesque"], "register": "literary", "connotation": "positive", "groups": [3]}, {"word": "burgeon", "pos": "v.", "pron": "BER-juhn", "pron_note": "Soft g, exactly like surgeon — never a hard \"BUR-gun\".", "means": "To sprout, bud, and then **grow or expand rapidly and healthily**.\n\nIt carries two things ordinary *grow* doesn't: an **organic, living** flavour, and a sense of **promising beginnings** — something small getting visibly bigger, fast. A tumour doesn't burgeon; a career, a city, a music scene does. That's why the word is almost always positive, and why you meet it mostly as the adjective **burgeoning** in front of a noun: *a burgeoning demand, a burgeoning talent, a burgeoning middle class*. Note also that it needs no object — things burgeon on their own; you don't burgeon them.", "trick_line": "**b-URGE-ON** — growth being *urged on*.", "trick_unpack": "The hidden word gives you the nuance exactly: not steady growth, but growth with momentum behind it.", "sentences": ["By the 1890s the port had **burgeoned** into the busiest on the coast, its warehouses spilling out past the old walls.", "Her side hustle **burgeoned** into an actual business before she'd even quit her day job."], "in_the_wild": "Business and tech journalism runs on it — \"a **burgeoning** startup scene\", \"**burgeoning** demand for chips\". If you've read a market report, you've read this word.", "etymology": "Old French **burjon** = *\"a bud, a shoot.\"* The literal sense is a plant putting out buds — which is why the word still smells of springtime and early promise rather than mere increase.\n\n🚫 **Not related to *bourgeois*.** That's from Germanic *burg*, \"town\" — *borough, burgher, Edinburgh*. Similar look, unrelated root.", "one_line": "To sprout and then grow or expand rapidly.", "root": "burjon (bud, shoot)", "root_family": [], "confusables": ["bourgeois", "surgeon"], "sense_tags": ["growth", "flourishing", "expansion", "beginnings"], "register": "formal", "connotation": "positive", "groups": [3]}, {"word": "cacophonous", "pos": "adj.", "pron": "kuh-KOF-uh-nuhs", "pron_note": "Noun form: cacophony, kuh-KOF-uh-nee. Stress never falls on the first syllable.", "means": "Harsh, jarring, discordant — a mixture of sounds that clash instead of blending.\n\nLoudness alone isn't enough. A jet engine is deafening but not cacophonous; it's one sound. Cacophony needs **many sounds fighting each other** — horns, shouting, drills, a dozen conversations. And it's a verdict, not a measurement: the speaker is telling you the noise is *ugly*. It transfers easily to non-sound clashes too — a cacophonous colour scheme, a cacophonous chorus of opinions on a policy — always with that sense of too many things at once, none of them agreeing.", "trick_line": "**Caca**-phonous — it *sounds* like **caca**.", "trick_unpack": "The nursery word for filth is hiding in plain sight at the front, and it's no accident — that *caco-* really does mean \"bad\", so cacophonous is literally bad-sounding, not merely loud.", "sentences": ["The square at dusk was **cacophonous** — vendors bellowing, mopeds, and the call to prayer all colliding over one another.", "Six people on the call unmuted at once and it turned into a **cacophonous** mess."], "in_the_wild": "The orchestra tuning up before the conductor walks on — thirty instruments sawing away in different keys. That two-minute racket is the textbook cacophony, and the silence that follows it is the point.", "etymology": "Greek **kakos** = *\"bad\"* + **phōnē** = *\"sound, voice.\"* Bad-sound.\n\nBoth halves pay off elsewhere. *Phōnē* gives you **symphony** (sounds *together*), **euphony** (*good* sound — the exact antonym), **phonetics**, **telephone**. And *kakos* gives you **kakistocracy**, government by the *worst* people — a word worth knowing on its own.", "one_line": "Harsh and jarring; a clashing mess of noise.", "root": "kakos (bad) + phōnē (sound)", "root_family": ["euphonious", "symphony", "phonetics", "telephone", "kakistocracy", "cacography"], "confusables": ["euphonious"], "sense_tags": ["noise", "discordant", "harsh", "clashing", "unpleasant-sound"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "calumny", "pos": "n.", "pron": "KAL-uhm-nee", "pron_note": "Adjective form: calumnious (kuh-LUM-nee-uhs) — stress moves.", "means": "A **false statement made deliberately to destroy someone's reputation** — or the practice of making them.\n\n*Slander* is the courtroom word; *calumny* is the moral one. It carries the speaker's disgust with it: you don't call something calumny unless you think the victim is innocent and the accuser is vile. And unlike *rumour* or *gossip*, which can drift into being by accident, calumny is **aimed** — someone chose the lie and chose the target. Formal, faintly biblical, and best deployed when you want the accusation itself to sound shameful.", "trap": "**calumny ≠ calamity.** *Calumny* is a slander; a *calamity* is a disaster. Similar rhythm, unrelated words — a calumny can *cause* a calamity, which is exactly why the exam likes the pair.", "trick_line": "**Calumny** = a poisonous **column** — a lie set in print to ruin a name.", "trick_unpack": "The sound hook holds the nuance: a column is written, published and deliberate, never an accidental slip of gossip.", "sentences": ["The biography rescues her from two centuries of **calumny**, showing that the letters used to condemn her were forged.", "He didn't just disagree with me — he went around the office spreading outright **calumny** about my expenses."], "in_the_wild": "Hamlet to Ophelia: *\"Be thou as chaste as ice, as pure as snow, thou shalt not escape **calumny**.\"* — i.e. innocence is no defence against a determined liar.", "etymology": "Latin **calumnia** = *\"a false accusation, a trick,\"* from **calvī**, *\"to deceive.\"*\n\nThe surprise: **challenge** is the same word. *Calumnia* → Old French *chalenge*, which originally meant an accusation or false claim, before softening into \"a dare.\" So a challenge and a calumny are etymological twins — one kept the fight, the other kept the lie.", "one_line": "A deliberate lie told to destroy someone's reputation.", "root": "calvī (to deceive) → calumnia (false accusation)", "root_family": ["calumniate", "calumnious", "challenge"], "confusables": ["calamity", "columny (nonword)", "acrimony"], "sense_tags": ["slander", "defamation", "false-accusation", "malice", "reputation"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "candid", "pos": "adj.", "pron": "KAN-did", "means": "Honest and open, especially about something awkward, unflattering, or usually kept quiet. Second sense: **unposed** — a candid photo is one taken before anyone arranged their face.\n\nWhere *blunt* and *brutal* imply the speaker enjoyed it, and *frank* is merely direct, **candid** carries a whiff of *disclosure* — the speaker had a reason to hide this and chose not to. That's why it's almost always approving: you're candid **about** your own failures, doubts, or finances. A CEO who is candid about a bad quarter earns credit; one who is blunt about it just upset the room.", "trick_line": "**Candid** is a **candle** — it lights up the part of the room you'd rather leave dim.", "trick_unpack": "Same root, and it captures the nuance exactly: candour isn't just saying things, it's illuminating what was conveniently in shadow.", "sentences": ["In a **candid** memoir, the former minister admits he knew the figures were wrong and signed off anyway.", "Can I be **candid**? That shirt is not doing what you think it's doing."], "in_the_wild": "**Candid Camera**, the hidden-camera show that ran for decades — the whole premise is catching people unposed, before they've had time to arrange themselves.", "etymology": "Latin **candidus** = *\"shining white\"*, from **candēre**, *\"to glow\"* — the same root as **candle** and **incandescent**.\n\nThe bonus: a Roman seeking office wore a bleached white toga to advertise his purity — hence **candidate**. So *candid, candle, incandescent, candidate* all come from one glow.", "one_line": "Openly honest, especially about the uncomfortable.", "root": "candēre (to shine, glow); candidus (shining white)", "root_family": ["candle", "incandescent", "candidate", "candour", "candela"], "confusables": ["candied", "candidate"], "sense_tags": ["honest", "frank", "unposed", "forthcoming", "open"], "register": "neutral", "connotation": "positive", "groups": [2]}, {"word": "canonize", "pos": "v.", "pron": "KAN-uh-nyze", "pron_note": "British spelling: canonise.", "means": "**1.** For the Church to formally declare a dead person a **saint**. **2.** More broadly, to **enshrine** something as officially great, authoritative, beyond questioning — admit a book, film or figure into \"the canon.\"\n\nThis is always an act of *institutional power*, not personal enthusiasm. You can adore a novel; only the syllabus, the academy, the Church can canonize it. And the effect is permanence — canonization freezes a reputation, puts it past debate. Because of that finality, the word turns dryly ironic the moment the thing being enshrined doesn't deserve it: *a mediocre album canonized by critics who were there at the time.*", "tra
