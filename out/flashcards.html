p": "⚠️ **canon ≠ cannon.** A **canon** is a rule or an official list (one *n*); a **cannon** fires cannonballs (two *n*s). Nothing is ever \"cannonized.\"", "trick_line": "**Canonize = put on the CANON — the official list you're no longer allowed to argue with.**", "trick_unpack": "The word is hiding in plain sight: canonizing isn't praising something, it's *filing* it somewhere permanent by authority.", "sentences": ["Pope Francis **canonized** her in 2016, nineteen years after her death and two verified miracles later.", "Give it ten years and they'll have **canonized** that show — you won't be allowed to say it was boring."], "in_the_wild": "Every fandom argument about what \"counts\" — is the *Star Wars* Expanded Universe **canon**? — is a fight over what's been canonized. Same word, same idea: an authority decides what's officially real and what gets thrown out.", "etymology": "Greek **kanōn** = a *straight measuring rod* — hence a rule, a standard. What measures up gets on the list.\n\nThat rod runs through **canon** (the approved body of scripture or works), **canonical** (authoritative, standard), **canon law**, and **canonize** itself.", "one_line": "Declare a saint; enshrine as official and beyond question.", "root": "kanōn (Greek: measuring rod, rule)", "root_family": ["canon", "canonical", "canon law", "canonicity"], "confusables": ["canon", "cannon", "canonical", "colonize"], "sense_tags": ["sainthood", "enshrine", "official-status", "authority", "veneration"], "register": "formal", "connotation": "positive", "groups": [3]}, {"word": "capricious", "pos": "adj.", "pron": "kuh-PRISH-uhs", "pron_note": "Also heard as kuh-PREE-shuhs; both are accepted.", "means": "Given to **sudden, unaccountable changes** of mood, opinion or behaviour — acting on whim rather than reason.\n\n*Fickle* is intimate and emotional (a fickle lover, a fickle fanbase). *Capricious* is bigger and colder: it attaches to whoever holds the power — a capricious king, a capricious examiner, capricious weather, capricious fate. The sting isn't that they change, it's that the change **obeys no logic you can predict or appeal to**. And note the tonal split from *whimsical*: whimsy is charming, caprice is unnerving, because you have to live under it.", "trick_line": "**Capricious = Capri-CORN, the goat** — it bolts up the cliff the instant the mood takes it, and nobody gets a reason.", "trick_unpack": "Goats don't wander, they *lurch* — which is the word exactly: not gradual change but abrupt, unexplained swerves.", "sentences": ["The emperor's justice was **capricious**: two men committed the same offence, and one was pardoned before lunch, the other exiled by evening.", "Don't bother planning the barbecue — April weather here is **capricious** as hell."], "in_the_wild": "In US law, courts throw out a government agency's decision for being **\"arbitrary and capricious\"** — the standard phrase for a ruling made on no rational basis. If you ever read a news story about a policy being struck down, this is the wording.", "etymology": "Italian **capriccio** = *\"a whim, a sudden start\"* — and Italians linked it to **capra**, *\"goat\"*, for the animal's abrupt leaping.\n\nThe goat runs through the family: **Capricorn** (the goat-horned sign), **caper** (to skip about), **capriole** (a horse's leap), **caprice** (the whim itself). In music a **capriccio** is a piece that changes direction on impulse — same idea, scored.", "one_line": "Prone to sudden, unreasoned changes of mood or decision.", "root": "capra (goat) → Italian capriccio (whim)", "root_family": ["caprice", "Capricorn", "caper", "capriole", "capriccio"], "confusables": ["captious", "capacious"], "sense_tags": ["fickle", "unpredictable", "whimsical", "arbitrary", "impulsive"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "castigate", "pos": "v.", "pron": "KAS-tuh-gayt", "means": "To **rebuke or criticise severely** — a punishing telling-off, usually delivered publicly and from a position of moral authority.\n\nWhere *criticise* is neutral and *scold* is domestic, **castigate** is the register of editorials, inquiry reports and judgements: the speaker is not just disagreeing, they are pronouncing you at fault. It implies the target *deserved* it, and it implies an audience — you castigate someone **for** a specific failing, on the record. Almost never used of a quiet word in private.", "trap": "⚠️ **castigate ≠ instigate.**\n- **castigate** = *lash* someone for what they did\n- **instigate** = *start* the thing off\n\nThe rioters were **instigated** by one man; the judge later **castigated** them all.", "trick_line": "**You castigate in print; you yell in person.**", "trick_unpack": "If there's no audience and no moral high ground, it isn't castigation — it's just shouting.", "sentences": ["The commission's final report **castigated** the regulator for a decade of wilful inattention.", "My editor **castigated** me for missing the deadline — three paragraphs of email, all of it deserved."], "in_the_wild": "It's a newsroom workhorse: whenever a headline says an inquiry, a court or an opposition leader **\"castigated\"** someone, that's the word doing its one job — official blame, said out loud.", "etymology": "Latin **castigāre** = *castus* (\"pure, chaste\") + *agere* (\"to drive\") — literally **to drive someone back into purity**. Punishment as moral correction, not revenge.\n\nThat root pays out widely: **chaste**, **chasten**, **chastise** (the same word worn down through French), **caste** (a \"pure\" bloodline), and **incest** — *in-* + *castus*, \"not chaste.\"", "one_line": "To rebuke severely, usually in public and on the record.", "root": "castus (pure, chaste) + agere (to drive)", "root_family": ["chaste", "chasten", "chastise", "caste", "incest"], "confusables": ["instigate", "chastise", "chasten", "castrate"], "sense_tags": ["criticism", "rebuke", "punishment", "severity", "public-blame"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "caustic", "pos": "adj.", "pron": "KAW-stik", "means": "**Literally:** able to burn or eat away flesh and material by chemical action — lye, acid, drain cleaner.\n**Figuratively:** bitingly sarcastic; scathing.\n\nA caustic remark is corrosive, not merely clever. Sarcasm can be affectionate and sarcasm can be dumb; **caustic** is neither — it's sharp, controlled, and aimed to strip something off the person it hits. There's usually bitterness behind it, which is why *caustic* describes critics, exes and burnt-out colleagues far more often than comedians.", "trick_line": "**Caustic soda strips paint. Caustic wit strips skin.**", "trick_unpack": "The chemical meaning is the literal one, so the figurative sense keeps the damage — a caustic line is meant to leave a mark, not get a laugh.", "sentences": ["His **caustic** review of the production was quoted for years, chiefly by people who had not seen it.", "Don't ask her for feedback before coffee — she goes full **caustic**."], "in_the_wild": "The **caustic soda** on the drain-cleaner bottle under your sink — the skull-and-crossbones warning is the whole meaning of the word in one label.", "etymology": "Greek **kaiein** = *\"to burn\"* → **kaustikos**, \"burning.\"\n\nSame root gives you **cauterize** (seal a wound by burning it) and **holocaust** (*holos* \"whole\" + *kaustos* \"burnt\" — burnt whole). Once you hear the burn in it, the sarcastic sense stops being a separate definition to memorise.", "one_line": "Burning; bitingly sarcastic in a way meant to wound.", "root": "kaiein (to burn)", "root_family": ["cauterize", "holocaust", "encaustic", "calorific (unrelated — Latin calor, do not merge)"], "confusables": ["cautious", "acerbic", "acrid", "caucus"], "sense_tags": ["sarcastic", "cutting", "corrosive", "bitter", "scathing"], "register": "neutral", "connotation": "negative", "groups": [2]}, {"word": "censure", "pos": "v. / n.", "pron": "SEN-sher", "pron_note": "Second syllable is \"sher,\" not \"sure\" — it does not rhyme with \"ensure.\"", "means": "**Verb:** to condemn someone **formally and publicly** for misconduct. **Noun:** that condemnation itself.\n\nCensure is criticism with **institutional standing behind it** — a vote, a ruling, a signed statement from a body entitled to pass judgement. Your friend can criticise you; only a board, a court, a legislature or a professional association can censure you. And it stops at words: a censured official keeps the job and the salary but wears the mark permanently. That's the scale — heavier than *rebuke*, more public than *reprimand*, one step short of *expel*.", "trap": "⚠️ **censure ≠ censor.**\n- **censure** = *condemn the person*\n- **censor** = *delete the message*\n\nA senator can be censured. A senator's speech can be censored.", "trick_line": "**You get censured *by* a body, never by a person — it takes a vote.**", "trick_unpack": "If nobody had to raise a hand for it, it's just criticism.", "sentences": ["The committee voted to **censure** the judge for accepting undisclosed gifts, though it stopped short of demanding his resignation.", "He got off with a **censure** — a strongly worded letter in his file and absolutely nothing else."], "in_the_wild": "The word surfaces in the news almost only in one setting: the US Congress voting to **censure** one of its own — a formal slap on the record that carries no fine, no removal, just the permanent black mark.", "etymology": "Latin **censēre** = *\"to assess, to judge.\"* One root, four GRE words: **census** (counting), **censor** (suppressing), **censure** (condemning), **censorious** (habitually fault-finding).", "one_line": "Formal public condemnation by an official body.", "root": "censēre (to assess, to judge)", "root_family": ["census", "censor", "censorious", "recension"], "confusables": ["censor", "sensor", "censer", "censorious"], "sense_tags": ["condemnation", "official-rebuke", "disapproval", "reprimand"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "cerebral", "pos": "adj.", "pron": "suh-REE-bruhl", "pron_note": "Also heard as SER-uh-bruhl, especially in British English — both are standard.", "means": "Literally **of the brain**; figuratively, **driven by intellect rather than emotion or instinct** — analytical, cool-headed, demanding thought.\n\nApplied to a person or a work, it's admiration with a slight chill in it. A **cerebral** film makes you think; it doesn't make you cry. Calling a footballer cerebral means he reads the game rather than outrunning people. And it tips easily into criticism — *too cerebral* means bloodless, over-clever, all head and no pulse.", "trick_line": "**Visceral** hits you in the guts; **cerebral** hits you in the brain.", "trick_unpack": "Same grammar, opposite organ — and the organ tells you the temperature, since guts are hot and immediate while brains are cool and slow.", "sentences": ["His novels are admired more than they are loved: **cerebral**, exact, and reluctant to raise their voice.", "It's a fun match but a **cerebral** one — nobody's charging around, they're just picking each other apart."], "in_the_wild": "**Cerebral palsy** — the everyday medical term that pins the root down: a condition originating in the **brain**, not the muscles.", "one_line": "Intellectual rather than emotional; brainy, sometimes coldly so.", "root": "cerebrum (brain)", "root_family": ["cerebrum", "cerebellum", "cerebrospinal", "cerebration"], "confusables": ["visceral", "cerebellar"], "sense_tags": ["intellectual", "analytical", "unemotional", "thoughtful"], "register": "neutral", "connotation": "depends", "groups": [1]}, {"word": "cherish", "pos": "v.", "pron": "CHER-ish", "means": "To hold something **dear** and care for it tenderly — over time, not in a flash.\n\nSitting between *like* and *love*, it adds two things neither has: **protectiveness** and **duration**. You *treasure* a watch; you *cherish* the grandmother who gave it to you. It also takes abstractions — you can cherish a hope, a memory, a belief — and there the word turns faintly wistful, sometimes ironic: to *cherish an illusion* is to keep hugging something you should have let go of.", "trick_line": "Look at what it takes as an object: memories, moments, people, hopes — never things you could simply buy again.", "trick_unpack": "The collocations give away the nuance — cherishing is reserved for the irreplaceable, which is why it always carries a trace of fear of loss.", "sentences": ["He **cherished** the letters long after the hand that wrote them had stilled, rereading them each winter.", "Look, just **cherish** this — you'll never all be in the same room again."], "in_the_wild": "The wedding vow: *\"to have and to hold… to love and to **cherish**, till death do us part.\"* Note that it's the *slow* verb in the line — not passion, but a promise of ongoing care.", "etymology": "Old French **cher** = *\"dear\"* (as in *ma chérie*), from Latin **cārus**, *\"dear, costly.\"*\n\nSame root: **charity** (*cāritas*, dearness → love for others) and **caress**. If something is *cher*, it is both beloved and expensive — the word never quite forgets the price of losing it.", "one_line": "To hold dear and protect, with lasting tenderness.", "root": "cārus (dear, costly)", "root_family": ["charity", "charitable", "caress"], "confusables": ["relish", "perish"], "sense_tags": ["affection", "valuing", "tenderness", "devotion"], "register": "neutral", "connotation": "positive", "groups": [4]}, {"word": "chicanery", "pos": "n.", "pron": "shi-KAY-nuh-ree", "pron_note": "The ch is a sh, as in French — never \"CHICK-uh-nery.\"", "means": "**Trickery** — specifically the clever, fiddly, technically-legal kind: deception through loopholes, quibbles, procedural sleight-of-hand and fine print.\n\nScale matters. A mugging isn't chicanery; a contract clause buried on page 40 is. It implies **cunning rather than force**, and usually a professional setting where the rules themselves are the weapon — lawyers, politicians, accountants, election officials. The word carries a dry, faintly amused contempt: you say it about someone who *won*, but disgracefully.", "trick_line": "**Chicanery** starts like **chic** — it's trickery in a good suit.", "trick_unpack": "Nothing crude or violent about it: the chicaner wins by being slick, technical and hard to pin down.", "sentences": ["The judge dismissed the filing as procedural **chicanery** designed to run out the clock rather than to argue the case.", "Three hidden fees and an auto-renewal? That's not a deal, that's **chicanery**."], "in_the_wild": "In Formula 1, a **chicane** is that tight artificial S-bend bolted onto a straight to stop cars going flat out — same word, and it's literally a swerve to get around something. Chicanery is a chicane through the rules.", "etymology": "French **chicaner** = *\"to quibble, to wrangle over legal niceties.\"* The legal flavour never washed out — that's why chicanery still smells of courtrooms and small print rather than street crime.", "one_line": "Sly trickery — winning by loopholes and quibbles, not force.", "root": "chicaner (French: to quibble, to use legal trickery)", "root_family": ["chicane", "chicaner"], "confusables": ["chicane"], "sense_tags": ["deception", "trickery", "loopholes", "cunning", "legalistic"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "coalesce", "pos": "v.", "pron": "koh-uh-LES", "pron_note": "Three syllables — not \"COAL-ess\". The \"coal\" is co- + al-.", "means": "To come together and **merge into one whole** — droplets, factions, ideas, a plan.\n\nThe key is that the parts stop being separate. A crowd *gathers* and stays a crowd of individuals; things that **coalesce** fuse, and you can no longer pick out what went in. It's also gradual and usually unforced — nobody coalesces things, they coalesce. That's why it fits mercury beads, rival factions, and half-formed thoughts equally well, and why \"the committee coalesced the reports\" sounds wrong: use *merged* or *combined* when there's an agent doing the joining.", "trap": "⚠️ **coalesce ≠ convalesce.**\n- **coalesce** = separate things *grow together*\n- **convalesce** = a sick person *gets better* (recuperate)\n\nFactions coalesce; patients convalesce.", "trick_line": "**-esce = gradually becoming**: adol*esce*nt, conval*esce*, coal*esce*. Never a snap — always a process.", "trick_unpack": "That Latin *-esc-* ending marks a slow becoming, which is exactly the nuance: coalescing is drift and fusion over time, not an instant merger.", "sentences": ["Over three decades the scattered guilds **coalesced** into a single national union.", "Give me a day — the idea's still bits and pieces, it hasn't **coalesced** yet."], "in_the_wild": "Election-night newsreading: when a primary field thins, commentators say the party is **coalescing around** a frontrunner — the rivals' support pooling into one bloc.", "etymology": "Latin **com-** (\"together\") + **alescere** (\"to grow up\"), from **alere**, *\"to nourish.\"*\n\nSame root: **coalition** (groups grown together), **adolescent** (still growing up), **alimony** (money to nourish), **aliment**. Coalition is the giveaway — a coalition is literally what coalescing produces.", "one_line": "To merge gradually into a single unified whole.", "root": "alere, alescere (to nourish, to grow up)", "root_family": ["coalition", "adolescent", "alimony", "aliment", "alumnus"], "confusables": ["convalesce", "coalition", "acquiesce", "collapse"], "sense_tags": ["merging", "unifying", "fusion", "gradual-process", "combining"], "register": "formal", "connotation": "neutral", "groups": [3]}, {"word": "cogent", "pos": "adj.", "pron": "KOH-juhnt", "pron_note": "Soft *g*, as in *gem* — not \"COG-ent\".", "means": "Of an argument, case, or explanation: **clear, logical, and forceful enough to compel agreement.**\n\nThe praise lands on the *reasoning*, not the speaker. **Eloquent** is about style, **persuasive** is about effect — a con man can be both. **Cogent** says the logic itself holds: tight, well-evidenced, hard to answer. It's cool, formal praise, the kind a judge, examiner, or peer reviewer gives — and its negative is quietly brutal, because \"no cogent explanation was offered\" means the reasoning was not merely unconvincing but structurally empty.", "trick_line": "**A cogent argument has *cogs* — it's a machine that drives you to the conclusion.**", "trick_unpack": "The gears mesh: each step turns the next, so you're moved along by the mechanism rather than talked into it.", "sentences": ["The dissent was the more **cogent** opinion: fifteen pages, no rhetoric, every claim carrying its own evidence.", "He talked for ten minutes and never made one **cogent** point."], "in_the_wild": "Standard courtroom and peer-review currency — judgments regularly say a party \\\"advanced no **cogent** reason,\\\" which is a polite way of saying the argument had nothing under it.", "etymology": "Latin **cogere** = *\"to drive together, to compel\"* (**co-** *together* + **agere** *to drive*). A cogent argument literally **forces** you along — the same *agere* behind **agent, agenda, agile, act, exact, agitate**.\n\n🚫 **Nothing to do with *cognition*.** That's *cognoscere*, \"to know\" — *recognise, cognizant, incognito*. Cogent isn't about being knowledgeable; it's about being irresistible.", "one_line": "Clear and logically forceful — an argument that compels agreement.", "root": "cogere (to drive together, compel) < co- + agere (to drive)", "root_family": ["agent", "agenda", "agile", "act", "exact", "agitate", "navigate", "litigate", "coagulate"], "confusables": ["cogitate", "cognizant", "coherent", "cohesive"], "sense_tags": ["convincing", "logical", "well-reasoned", "compelling", "clarity"], "register": "formal", "connotation": "positive", "groups": [3]}, {"word": "compelling", "pos": "adj.", "pron": "kuhm-PEL-ing", "means": "**Adj.:** so convincing, or so gripping, that you can't resist it — either an argument you can't refute or a story you can't put down.\n\nTwo lanes, same force. **Compelling evidence** leaves no room to disagree; **a compelling film** leaves no room to look away. Either way the word implies *pressure*: a merely *persuasive* argument invites you to agree, a **compelling** one gives you no honest alternative. Strong praise, and slightly more objective-sounding than *fascinating* — it says the power is in the thing, not in your taste.\n\nThere is also a plainer legal/formal use — **a compelling reason** = one that genuinely *forces* the decision (as in \"compelling state interest\").", "trap": "⚠️ **compelling ≠ compulsive.**\n- **compelling** = irresistible to *others* (a compelling case)\n- **compulsive** = driven by an urge *within* (a compulsive liar)\n\nA compulsive liar can't stop; a compelling liar can't be doubted.", "trick_line": "**Compelling** has **compel** sitting inside it — it doesn't ask you, it drives you.", "trick_unpack": "If you can shrug it off, it wasn't compelling.", "sentences": ["The prosecution assembled a **compelling** case: three witnesses, a dated receipt, and CCTV footage timed to the minute.", "I meant to watch one episode, but it was so **compelling** I lost the whole night."], "in_the_wild": "It's the default word on every book jacket and streaming blurb — *\"a compelling read,\" \"compelling television.\"* Critics reach for it precisely because it praises the grip, not just the quality.", "etymology": "Latin **com-** (intensive) + **pellere** = *\"to drive, to push.\"* Literally *to drive someone into it.*\n\nThat root drives a whole GRE family: **propel** (drive forward), **expel** (drive out), **repel** (drive back), **dispel** (drive apart — *dispel a rumour*), **impel** (drive on), **compulsion**, **pulse**.", "one_line": "So convincing or gripping you can't resist it.", "root": "pellere (to drive, push)", "root_family": ["propel", "expel", "repel", "dispel", "impel", "compulsion", "pulse", "repulsive"], "confusables": ["compulsive", "compulsory", "impelling", "complaisant"], "sense_tags": ["persuasive", "gripping", "irresistible", "forceful", "convincing"], "register": "neutral", "connotation": "positive", "groups": [3]}, {"word": "congenial", "pos": "adj.", "pron": "kuhn-JEE-nee-uhl", "means": "**1.** (of people) pleasant, friendly, easy to get along with — because their temperament suits yours. **2.** (of places, work, conditions) agreeable, well-suited to your needs or tastes.\n\nThe key is **fit**, not virtue. *Kind* and *generous* describe a person in isolation; **congenial** is relational — it says this person or place agrees *with you*. A dour recluse can be congenial company for another dour recluse. It's a mild, civilised, slightly bookish compliment: warm but unexcited, the word for a good dinner guest rather than a beloved friend.", "trap": "⚠️ **congenial ≠ congenital.**\n- **congenial** = *agreeable, well-suited* — a congenial host\n- **congenital** = *present from birth* — a congenital heart defect\n\nOne letter apart, and only one of them is a compliment.", "trick_line": "**Congenial** = **genial** *with* (**con-**) you — the \"con\" makes it a match, not just a mood.", "trick_unpack": "*Genial* describes someone's warmth on its own; the *con-* adds the second party, which is why congenial always implies suitability to somebody or something.", "sentences": ["The delegates found the Geneva sessions unexpectedly **congenial**, the disputes conducted over coffee rather than through lawyers.", "Rainy Sunday, nobody talking, cat on the radiator — honestly the most **congenial** afternoon I've had all year."], "in_the_wild": "Job ads and hotel listings run on this word — \"a **congenial** working environment,\" \"a **congenial** atmosphere.\" It's the register of polite advertising: promising you'll fit in without promising anything specific.", "etymology": "Latin **con-** (*together*) + **genialis**, from **genius** — your guardian spirit, from **gignere** *\"to beget.\"* So: *sharing a spirit with*.\n\nThat root is a GRE goldmine: **genius, genial, genuine, genus, generate, gene, progeny** — and **congenital**, literally *\"born together with you,\"* which is exactly why it means \"from birth\" and not \"friendly.\"", "one_line": "Pleasantly agreeable; suited to your temperament or your needs.", "root": "gignere, genitus (to beget) → genius (spirit)", "root_family": ["genial", "genius", "genuine", "genus", "generate", "progeny", "congenital", "indigenous"], "confusables": ["congenital", "genial", "congenital", "convivial", "congruent"], "sense_tags": ["friendly", "agreeable", "compatible", "pleasant", "well-suited"], "register": "formal", "connotation": "positive", "groups": [1]}, {"word": "conspicuous", "pos": "adj.", "pron": "kuhn-SPIK-yoo-uhs", "means": "Easy to see or notice; standing out so plainly that it attracts attention.\n\n*Obvious* is about the mind — the point lands. **Conspicuous** is about the eye — the thing sticks out of its surroundings. And it usually carries a faint discomfort: the conspicuous person is the one everybody clocks, the conspicuous spending is the kind meant to be seen. Turn it up and you get vulgarity (**conspicuous consumption**); invert it and you get the sly idiom **conspicuous by his absence** — so expected that the gap itself is loud.", "trap": "⚠️ **conspicuous ≠ perspicuous.**\n- **conspicuous** = *easily seen* — it stands out\n- **perspicuous** = *clearly expressed* — a perspicuous explanation leaves no confusion\n\n(And **perspicacious** = *sharp-sighted, shrewd*, said of a person.)", "trick_line": "**Conspicuous** hides ***spic*** — the same *spec-* as **specs**: you don't need your glasses to spot it.", "trick_unpack": "Conspicuous isn't merely visible — it's visible to someone who wasn't even looking.", "sentences": ["Her red coat made her **conspicuous** in a hall of grey suits — which was, of course, the point.", "Don't be so **conspicuous**, mate — you're the only one in the library wearing sunglasses."], "in_the_wild": "**Conspicuous consumption** — Thorstein Veblen's phrase for buying things purely so other people see you can afford them. It's the standard label for the flex: the logo bag, the supercar in a city with a 20 mph limit.", "etymology": "Latin **specere** = *\"to look\"*, with **con-** as an intensifier: *fully in view*.\n\nThat root is a GRE goldmine: **spectacle, inspect, prospect, suspicion, specimen, perspicacious** — all of them about looking.", "one_line": "Standing out plainly; impossible not to notice.", "root": "specere (to look)", "root_family": ["spectacle", "inspect", "prospect", "suspicion", "specimen", "perspicacious", "perspicuous", "circumspect"], "confusables": ["perspicuous", "perspicacious", "auspicious", "suspicious"], "sense_tags": ["visible", "noticeable", "prominent", "attention-drawing", "ostentatious"], "register": "neutral", "connotation": "depends", "groups": [1]}, {"word": "construe", "pos": "v.", "pron": "kuhn-STROO", "means": "To **assign a particular meaning** to words or actions — to take them *as* meaning something.\n\nWhere *interpret* is broad and neutral (you interpret a poem, a dream, a dataset), **construe** shows up precisely where a reading is **contested or could go the other way**. It carries a whiff of the courtroom: someone is deciding which of two possible meanings a sentence or a gesture will officially bear. That's why it so often appears defensively — *\"don't construe my silence as consent\"*, *\"this shall not be construed as an admission\"*. If nothing is ambiguous, nobody needs to construe it.", "trick_line": "**con-S-TRUE** — out of an ambiguous phrase, you pick which reading is **true**.", "trick_unpack": "The word literally hides *true* in it, and construing is the act of settling which meaning counts as the true one.", "sentences": ["The court **construed** the clause narrowly, holding that it covered damage to the building but not to its contents.", "He asked if I was busy this weekend, and I stupidly **construed** that as an invitation."], "in_the_wild": "Buried in almost every contract and terms-of-service you've ever scrolled past: *\"This Agreement shall be **construed** in accordance with the laws of...\"* — lawyers use the word constantly, because their whole job is fixing which reading wins.", "etymology": "Latin **construere** = *con-* (\"together\") + **struere** (\"to build\") — literally *to build up*. You build a meaning out of the parts of a sentence.\n\nSame *struere* gives you **construct**, **structure**, **instruct** (build knowledge into someone), **obstruct**, **destroy**. Add *mis-* and you get **misconstrue**: you built the meaning wrong.", "one_line": "To interpret ambiguous words or acts as meaning something particular.", "root": "struere, structum (to build, pile up)", "root_family": ["construct", "structure", "instruct", "obstruct", "destruction", "misconstrue"], "confusables": ["misconstrue", "construct", "constrain"], "sense_tags": ["interpreting", "ambiguity", "inference", "legal-reading"], "register": "formal", "connotation": "neutral", "groups": [2]}, {"word": "contend", "pos": "v.", "pron": "kuhn-TEND", "means": "Two senses, both about **strain against opposition**:\n\n**1. To assert in the face of disagreement.** Not merely to *say* — to maintain a position that someone else is pushing back on. This is why academic and journalistic prose reaches for it: \"critics **contend** that the study was underpowered\" flags the claim as *contested* and quietly distances the writer from it. Swap in \"argue\" and you lose the hint of a live dispute; swap in \"claim\" and you add a sneer that *contend* doesn't have.\n\n**2. To struggle or compete.** *Contend with* a problem = grapple with it, difficulty implied but not defeat. *Contend for* a prize = be a serious rival for it, not a hopeful bystander.", "trick_line": "**contend *that*** = argue · **contend *with*** = struggle · **contend *for*** = compete.", "trick_unpack": "The preposition, not the verb, tells you which of the three senses is running.", "sentences": ["Several economists **contend** that the shortage was engineered, not accidental.", "Between the strike and the rain, we had enough to **contend with** before the van broke down."], "in_the_wild": "Marlon Brando in *On the Waterfront*: **\"I coulda been a contender.\"** A contender is one who *contends for* the title — a real threat, not a filler on the card.", "etymology": "Latin **contendere** = *con-* (\"together\") + **tendere** (\"to stretch\") — to strain against. That's the through-line: an argument, a rival, and a hardship are all things you pull taut against.\n\n*tendere* is a GRE workhorse: **tension, tendon, extend, intend, pretend, portend, distend** — and **contentious**, which is just *contend* turned into a personality.", "one_line": "To argue a disputed point; to struggle or compete.", "root": "tendere (to stretch)", "root_family": ["tension", "tendon", "extend", "intend", "pretend", "portend", "distend", "contentious", "tenet"], "confusables": ["contest", "content", "contentious"], "sense_tags": ["asserting", "arguing", "competing", "struggling"], "register": "neutral", "connotation": "neutral", "groups": [3]}, {"word": "contrite", "pos": "adj.", "pron": "kuhn-TRYTE", "pron_note": "Rhymes with *right*. Also heard with front stress: KON-tryte.", "means": "Feeling and showing **deep, humbled regret** for something you did wrong.\n\n*Sorry* is the minimum; *apologetic* is the performance; **contrite** is the state of being genuinely crushed by your own guilt — head down, defences gone, no excuses offered. It presumes real fault, not a mishap, and it carries a moral, almost confessional weight. Note how often it attaches to *appearance*: someone **looks** contrite, **sounds** contrite — which is exactly why \"suitably contrite\" is so often said with a raised eyebrow.", "trick_line": "**Contrite** has **trite** in it — and *trite* means *worn out*. A contrite person has been worn down by guilt.", "trick_unpack": "Both words come from the same idea of rubbing something away, so the contrite one isn't just apologising — they've been ground flat.", "sentences": ["The minister issued a **contrite** statement, accepting full responsibility and declining to name anyone else.", "He turned up the next morning looking thoroughly **contrite**, holding two coffees and not saying much."], "in_the_wild": "The **Act of Contrition** — the prayer said in Catholic confession, and the one every dying gangster gasps out in a mob film. Same word, same idea: you're not just apologising, you're broken up about it.", "etymology": "Latin **conterere** = *\"to grind down, wear away\"* (*com-* intensive + *terere*, \"to rub\"). To be contrite is to be **ground to pieces** by remorse.\n\nThat root pays out across the GRE: **trite** (a phrase rubbed smooth by overuse), **attrition** (wearing an enemy or a workforce down), **detritus** (what's rubbed off — debris), **detriment** (damage by wearing away).", "one_line": "Deeply, humbly sorry; crushed by guilt for a wrong done.", "root": "terere, tritum (to rub, wear away)", "root_family": ["trite", "attrition", "detritus", "detriment", "contrition", "trituration"], "confusables": ["contrived", "contract", "contrite/trite"], "sense_tags": ["remorseful", "repentant", "apologetic", "humbled", "guilt"], "register": "formal", "connotation": "positive", "groups": [2]}, {"word": "convoluted", "pos": "adj.", "pron": "KON-vuh-loo-tid", "means": "Twisted, coiled, folded in on itself — and so, of an argument, plot, sentence, or process: **so intricate it can no longer be followed**.\n\n*Complex* can be a compliment and *complicated* is often just an honest fact, but **convoluted** blames the maker: the tangle didn't have to be there. It carries a faint whiff of suspicion too — convoluted excuses, convoluted accounting, convoluted procedures all hint that the twisting is doing work someone wants hidden. The literal sense (folded, coiled) survives mainly in anatomy: the *convoluted* tubules of the kidney.", "trick_line": "**No one has ever been praised for a convoluted explanation** — the word is a verdict, not a description.", "trick_unpack": "Reach for it only when you mean the complexity was avoidable and someone chose it.", "sentences": ["The statute's **convoluted** drafting had spawned three decades of contradictory rulings.", "Her explanation for the missing money got more **convoluted** every time she told it."], "in_the_wild": "It's the standard word in film reviews for a Christopher Nolan plot — *Tenet* and *Inception* get called **convoluted** almost as a reflex, meaning: too many folds, and not all of them earned.", "etymology": "Latin **volvere** = *\"to roll\"*, with **con-** = *\"together\"* — rolled up together, coiled.\n\nThat root is a GRE goldmine: **revolve** (roll back), **evolve** (roll out), **involve** (roll in), **devolve** (roll down), **voluble** (words that roll out easily), and **volume** (a rolled scroll).", "one_line": "Needlessly twisted and intricate; impossible to follow.", "root": "volvere (to roll)", "root_family": ["revolve", "evolve", "involve", "devolve", "voluble", "volume", "convolution"], "confusables": ["convulsed", "involuted", "convoked"], "sense_tags": ["complexity", "obscurity", "twisted", "hard-to-follow"], "register": "neutral", "connotation": "negative", "groups": [2]}, {"word": "copious", "pos": "adj.", "pron": "KOH-pee-uhs", "means": "Present in **large quantity** — plentiful, abundant, more than enough.\n\nIt leans toward things that are **produced, poured out, or consumed**: copious notes, copious tears, copious rainfall, copious amounts of coffee. You'd rarely call a mountain range copious, because copious describes *output and supply*, not sheer size. Tone is mildly formal but common in speech, and the flavour is generous rather than excessive — say **profuse** for gushing, **prodigal** for wasteful. Copious just means the well kept giving.", "trick_line": "**Copious** notes fill **copies** and **copies** of pages — same word underneath.", "trick_unpack": "*Copy* and *copious* are literally the same Latin root, so copious means abundance that keeps being turned out, not a single big pile.", "sentences": ["The witness gave **copious** testimony, filling three days of transcript with detail no one had asked for.", "He took **copious** notes in the meeting and still had no idea what was decided."], "in_the_wild": "The **Cornucopia** in *The Hunger Games* — the giant golden horn spilling out weapons and supplies at the start of the Games. Same root, and it's an image of overflow.", "etymology": "Latin **copia** = *\"abundance, plenty\"* — itself *co-* + *ops* (\"wealth, resources,\" the root behind **opulent**).\n\nThe surprise: **copy** comes from here too. A medieval *copia* was an abundance of a text — make more of it, and you've made a copy. **Cornucopia** = *cornu* (horn) + *copia* = the horn of plenty.", "one_line": "Plentiful; produced or flowing in generous, ample quantity.", "root": "copia (abundance), from co- + ops (wealth)", "root_family": ["copy", "cornucopia", "opulent", "copious"], "confusables": ["capacious", "copacetic"], "sense_tags": ["abundance", "plentiful", "quantity", "profuse"], "register": "neutral", "connotation": "neutral", "groups": [3]}, {"word": "corroborate", "pos": "v.", "pron": "kuh-ROB-uh-rayt", "means": "To **support a claim with independent evidence** — a second witness, a document, a lab result that backs up what was already asserted.\n\nIt is a *supporting* word, not a *proving* word. Corroboration always arrives second: there must be a story on the table first, and the corroborating fact strengthens it without being the whole case. And it must come from elsewhere — your own repetition corroborates nothing. Register is formal: courtrooms, journalism, science. In plain speech people say *back up*.", "trap": "⚠️ **corroborate ≠ collaborate.**\n- **corroborate** = *confirm* someone's account\n- **collaborate** = *work together* on something\n\nNear-identical sound, opposite jobs — the GRE loves this pair.", "trick_line": "**Co-**rroborate: the *co-* means it takes someone **else** — you can never corroborate your own story.", "trick_unpack": "That prefix carries the whole nuance: corroboration is by definition second-hand support, so a witness repeating himself adds nothing.", "sentences": ["Two independent laboratories **corroborated** the finding before the journal would print it.", "Nice alibi — got anyone who can **corroborate** that?"], "in_the_wild": "Every police procedural and courtroom drama runs on the line *\"Can anyone corroborate your story?\"* — which is also exactly how lawyers and journalists use it at work: one source is a rumour, two is a fact.", "etymology": "Latin **robur** = *\"oak, hardwood, strength.\"* To corroborate is literally to **strengthen together** — you put an oak beam under someone's claim.\n\nSame root gives **robust** (oak-strong) and **roborant** (a strengthening tonic). 🚫 The *-labor-* in **collaborate** is a different root entirely (*labor*, \"work\") — that's why the two words mean unrelated things.", "one_line": "To back up a claim with independent supporting evidence.", "root": "robur, roboris (oak, strength)", "root_family": ["robust", "roborant", "corroboration"], "confusables": ["collaborate", "corroded", "elaborate"], "sense_tags": ["confirming", "evidence", "supporting", "verification"], "register": "formal", "connotation": "neutral", "groups": [4]}, {"word": "cosmopolitan", "pos": "adj. / n.", "pron": "koz-muh-POL-ih-tuhn", "means": "**Adj.:** at home in many countries and cultures; free of local or national narrowness. Of a *place*, it means the mix — people, food, languages from everywhere. Of a *person*, it means the temperament: unfazed by difference.\n\n**Noun:** someone who is that.\n\nThe praise is not for the passport stamps but for the absence of provincial reflex — a cosmopolitan doesn't find foreignness startling. **Worldly** hints at experience of vice; **urbane** is about polish and manners; **cosmopolitan** is about *range*. Its true opposites are **parochial** and **provincial**, and GRE passages love that axis.", "trap": "⚠️ **cosmopolitan ≠ metropolitan.**\n- **metropolitan** = of a big city — a matter of **size** (metropolitan area, metropolitan police)\n- **cosmopolitan** = of many cultures — a matter of **mix**\n\nA town can be metropolitan and still deeply parochial.", "trick_line": "**Cosmopolitan** sounds like *cosmo-politician* — someone who can work any room, in any country.", "trick_unpack": "The word rewards social ease among strangers, not miles travelled.", "sentences": ["Trieste under the Habsburgs was a genuinely **cosmopolitan** port, where Italian, Slovene and German were all spoken on the same street.", "She's the most **cosmopolitan** person I know — three languages, five cities, and she still can't work the London Tube."], "in_the_wild": "**Cosmopolitan** the magazine, and the **Cosmo** cocktail *Sex and the City* made famous — both sell exactly one fantasy: the worldly, city-slick woman who belongs anywhere.", "etymology": "Greek **kosmos** (*world, order*) + **politēs** (*citizen*) — literally **\"citizen of the universe.\"** Diogenes the Cynic, asked where he was from, is said to have replied *kosmopolitēs*.\n\nBoth halves pay off elsewhere: *kosmos* gives **cosmos, cosmic, microcosm** — and **cosmetic**, because *kosmos* also meant *ordered arrangement*, i.e. adornment. *Polis* gives **politics, police, metropolis, acropolis**.", "one_line": "At home in many cultures; worldly and unprovincial.", "root": "kosmos (world, order) + politēs (citizen)", "root_family": ["cosmos", "cosmic", "microcosm", "cosmetic", "politics", "police", "metropolis", "acropolis"], "confusables": ["metropolitan", "cosmological", "cosmopolite"], "sense_tags": ["worldly", "multicultural", "sophisticated", "urbane", "well-travelled"], "register": "neutral", "connotation": "positive", "groups": [3]}, {"word": "covet", "pos": "v.", "pron": "KUV-it", "pron_note": "First syllable rhymes with love, not cove.", "means": "To want something badly — specifically something that **belongs to someone else**.\n\nPlain *wanting* is morally blank; coveting is loaded. The word carries a whiff of sin and envy: you are eyeing your neighbour's car, your colleague's job, your friend's spouse. It also implies the desire is **sustained and inward** — a slow ache you nurse, not a quick impulse.\n\nOne twist worth knowing: the participle **coveted** flips positive. \"The coveted Booker Prize\" just means everybody wants it, and the prestige rubs off on the thing, not the shame onto the wanter.", "trap": "⚠️ **covet ≠ covert.** One transposed letter, opposite worlds: **covet** = *desire what isn't yours*; **covert** (KOH-vert / KUV-ert) = *hidden, secret* — a covert operation. A spy runs covert missions; a thief covets the jewels.", "trick_line": "**Covet** hides **Cupid** — same root, and Cupid's arrow always points at somebody *else's* beloved.", "trick_unpack": "The Cupid link gives you both halves of the word: burning desire, aimed where it has no business being.", "sentences": ["For thirty years he had **coveted** the corner office, and on the day he got it he found the view unremarkable.", "Don't pretend — you've **coveted** that jacket since the moment she walked in wearing it."], "in_the_wild": "The Tenth Commandment: *\"Thou shalt not **covet** thy neighbour's house... nor his wife.\"* Note that the sin isn't wanting a house — it's wanting **his**.", "etymology": "Latin **cupere** = *\"to desire\"*, via **cupiditas** and Old French *coveitier*.\n\nSame root gives you **Cupid** (the god of desire), **cupidity** (greed for money — a favourite GRE word), and **concupiscence** (lust).", "one_line": "To crave something that belongs to someone else.", "root": "cupere / cupiditas (to desire)", "root_family": ["Cupid", "cupidity", "concupiscence", "cupidinous"], "confusables": ["covert", "coverts", "cavort"], "sense_tags": ["desire", "envy", "greed", "longing", "possession"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "craven", "pos": "adj. (also n.)", "pron": "KRAY-vuhn", "means": "Cowardly — but **contemptibly, shamefully** so.\n\n*Afraid* is a feeling anyone can have; *timid* is a temperament; *craven* is a **verdict**. It says the person had a duty to stand firm and folded anyway, usually to save their own skin. Nobody calls themselves craven — it's an accusation, and a withering, slightly old-fashioned one, at home in editorials and courtrooms rather than conversation. Its natural companions are *capitulation, surrender, silence, appeasement*: the cowardice of someone who **gave in** when it counted.", "trick_line": "**Craven = caves in.**", "trick_unpack": "Say it fast and \"craven\" collapses into \"cave-in\" — which is exactly what the craven person does the moment pressure is applied.", "sentences": ["The committee's **craven** silence on the matter told the public everything it needed to know.", "He talked a big game all week, then made some **craven** excuse and didn't show up."], "in_the_wild": "It's the standard insult of political journalism — *craven capitulation*, *craven refusal to condemn*. If you've read a newspaper opinion page, you've met this word doing exactly that job.", "etymology": "Probably from Old French **cravanter**, *\"to crush, overwhelm\"* — the craven is the man already broken. In medieval trial by combat, a fighter who cried **\"craven!\"** formally surrendered: he kept his life and lost his honour. That's still the flavour — defeat you chose.\n\n🚫 **Nothing to do with *crave*.** Different word entirely; a craven person wants less, not more.", "one_line": "Cowardly in a way that earns contempt.", "root": "cravanter (to crush, overwhelm)", "root_family": [], "confusables": ["crave", "craving", "carven", "raven"], "sense_tags": ["cowardly", "contemptible", "spineless", "yielding"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "cursory", "pos": "adj.", "pron": "KER-suh-ree", "means": "Done **quickly and without attention to detail** — a look, reading, or inspection so rapid it takes in only the surface.\n\nThe word almost always carries a quiet accusation: the speed is the reason something was *missed*. A **cursory** glance at the contract is how you end up signing away your flat. It attaches to acts of looking and checking — *a cursory glance, a cursory inspection, a cursory reading, a cursory nod* — and it judges the effort as insufficient without quite calling it lazy. Compare **brief**, which is neutral about thoroughness: a brief inspection can still be competent; a cursory one, by definition, wasn't.", "trick_line": "**Cursory** has a **cursor** in it — it *runs across* the surface and clicks on nothing.", "trick_unpack": "The cursor skims the whole page in a second and takes in none of it, which is exactly the failure the word is accusing you of.", "sentences": ["The auditors gave the accounts no more than a **cursory** review, and the discrepancy sat undisturbed for another two years.", "He gave my essay a **cursory** read on the bus and told me it was \"fine\" — he'd clearly seen about two paragraphs."], "etymology": "Latin **currere** = *\"to run\"* → *cursorius*, \"of a runner.\" A cursory look **runs past** rather than stopping.\n\nSame root, whole family: **cursor** (the runner on your screen), **current** (running water), **cursive** (running handwriting), **excursion** (a running-out), **precursor** (one who runs ahead), **recur**, **concur**, **incur**.", "one_line": "Hasty and shallow — a quick look that misses the details.", "root": "currere, cursus (to run)", "root_family": ["cursor", "current", "cursive", "excursion", "precursor", "recur", "concur", "incur", "discourse", "course"], "confusables": ["perfunctory", "precursory", "cursive", "curt"], "sense_tags": ["hasty", "superficial", "inattentive", "brief", "careless"], "register": "formal", "connotation": "negative", "groups": [1]}, {"word": "daunting", "pos": "adj.", "pron": "DAWN-ting", "pron_note": "US speakers often say DAHN-ting; same word.", "means": "Intimidating in scale or difficulty — enough to sap your nerve **before you begin**.\n\nDifficulty is a property of the task; dauntingness is what the task does to *you*. A puzzle can be hard without being daunting; a 900-word vocabulary list is daunting the moment you open it, before a single word is learned. Note also the respect built in: calling a challenge daunting concedes that it's real and large, not that it's impossible — it's the word of someone who intends to try anyway. Milder and more dignified than *terrifying* or *overwhelming*, and far more common in professional speech: the collocation is almost always **daunting task / daunting prospect / daunting challenge**.", "trap": "⚠️ **daunting ≠ vaunted.** One letter apart and both love to sit in front of a noun. **Daunting** reforms make you hesitate; **vaunted** (much-praised, boasted-about) reforms have been loudly bragged about — often with a sneer implied.", "trick_line": "**Daunting** things loom at **DAWN** — before you've done a stroke of the work.", "trick_unpack": "The pronunciation hands you the nuance: the discouragement arrives at the start, at the sight of the thing, not in the middle of doing it.", "sentences": ["The prospect of rebuilding the archive from water-damaged originals was **daunting**, but she began that afternoon regardless.", "Forty tabs open and none of them read — honestly, it's a bit **daunting**."], "etymology": "Latin **domitāre**, *\"to tame\"* — to daunt someone was originally to **break their spirit**, like breaking a horse. That's why the negatives are the fierce ones: **dauntless** and **undaunted** = refusing to be tamed.\n\nSame root gives you **indomitable** — literally *\"cannot be tamed\"*, a top-tier GRE word you now get for free.", "one_line": "So big or hard it makes you hesitate before starting.", "root": "domitāre / domāre (to tame)", "root_family": ["indomitable", "dauntless", "undaunted", "daunt"], "confusables": ["vaunted", "flaunting", "taunting", "dauntless"], "sense_tags": ["intimidating", "discouraging", "formidable", "fear", "difficulty"], "register": "neutral", "connotation": "negative", "groups": [1]}, {"word": "decorum", "pos": "n.", "pron": "dih-KOR-uhm", "means": "Behaviour that fits the occasion — dignified, restrained, correct by the unwritten rules of the setting. The adjective is **decorous**.\n\nNote what it is *not* about: goodness. Decorum governs **form**, not morality — you can be a scoundrel and still observe perfect decorum at the funeral. It's also entirely situational: what counts as decorum in a courtroom differs from a wedding, and breaching it offends the *occasion* rather than any principle. The word itself is formal and faintly institutional — judges demand \"order and decorum,\" Parliament invokes it, your friends never do.", "trick_line": "**Decorum** is **décor** for behaviour.", "trick_unpack": "Décor is what makes a room look right for its purpose; decorum is what makes your conduct look right for the room — both are about surface fittingness, not inner worth.", "sentences": ["The chamber maintained a chilly **decorum** even as the two ministers traded accusations through gritted teeth.", "Try to show some **decorum** at dinner — it's her parents, not the lads."], "in_the_wild": "Wilfred Owen's *Dulce et Decorum Est* — Horace's line that it is \"sweet and **fitting** to die for one's country,\" which Owen calls \"the old Lie.\" The poem's whole force comes from that word meaning *seemly, what the occasion demands*.", "etymology": "Latin **decēre** = *\"to be fitting, to be seemly.\"* The neuter of *decōrus* (\"becoming\") gave the noun.\n\nThe root pays out widely: **decent** (fitting, hence respectable), **decorous**, **decorate**, **décor** — and, negated, **indecent**. All circle the same idea of *what suits*.", "one_line": "Proper, dignified conduct that fits the occasion.", "root": "decēre (to be fitting, seemly)", "root_family": ["decent", "indecent", "decorous", "decorate", "décor"], "confusables": ["decorous", "décor", "decorate"], "sense_tags": ["propriety", "etiquette", "restraint", "formality", "seemliness"], "register": "formal", "connotation": "positive", "groups": [2]}, {"word": "deference", "pos": "n.", "pron": "DEF-er-uhns", "means": "Respectful yielding — letting someone else's judgment, wishes, or authority prevail over your own.\n\nThe yielding is **voluntary and measured**. Obedience is compelled; **servility** and **obsequiousness** are grovelling; deference is the polite half-step back you take for seniority, rank, or expertise, and it usually reflects well on you. Note the common frame **\"in deference to\"** — *in deference to her grief, we cancelled the party* — where it means \"out of respect for,\" not \"in submission to.\" Push it too far and it curdles: *deferential* can be a quiet insult, describing someone with no opinions of his own.", "trap": "⚠️ **deferential ≠ differential.** *Deferential* = respectfully yielding. *Differential* = to do with a difference (a differential rate, a car's differential). One bows; the other subtracts.", "trick_line": "**Deference** = **defer** + **-ence**: you *defer to* them — hand over the call, with a slight bow rather than a white flag.", "trick_unpack": "The bow marks the respect and the \"slight\" marks the limit — it's courtesy, not surrender.", "sentences": ["The junior barrister spoke last, in **deference** to counsel who had argued the case for thirty years.", "I don't actually like sushi — I picked the place out of **deference** to the birthday girl."], "in_the_wild": "In law, **\"Chevron deference\"** was the rule that courts should defer to a government agency's reading of a statute — the judges standing back and letting the experts' interpretation stand. The Supreme Court scrapped it in 2024, and every headline was about courts *no longer deferring*.", "etymology": "Latin **dēferre** = *\"to carry down, bring low, submit\"* — **de-** (down) + **ferre** (to carry). You carry your own view downward so someone else's can sit on top.\n\n**ferre** is a GRE workhorse: **transfer** (carry across), **refer** (carry back), **confer** (carry together), **infer** (carry in), **offer**, **suffer**, **fertile**.", "one_line": "Respectful yielding to another's judgment or authority.", "root": "ferre (to carry)", "root_family": ["transfer", "refer", "confer", "infer", "offer", "suffer", "fertile", "proliferate"], "confusables": ["difference", "differential", "deferment", "diffidence"], "sense_tags": ["respect", "submission", "yielding", "humility", "courtesy"], "register": "formal", "connotation": "neutral", "groups": [3]}, {"word": "deft", "pos": "adj.", "pron": "DEFT", "means": "Skilful and **quick** — handling something with neat, economical, unfussy competence.\n\n*Skilful* is a general compliment; **deft** is about the *lightness of touch*. A deft move looks effortless and takes no more effort than it needs — a surgeon's stitch, a diplomat sidestepping a hostile question, a chef boning a fish in four seconds. It praises finesse rather than power or brilliance, and it's often used of small physical movements or delicate social manoeuvres. Nothing in it is negative: deft is admiring, mildly formal, and a favourite of critics (\"a deft touch\").", "trick_line": "**Deft** is **daft** with one letter changed — and one is all quick skill, the other all foolishness.", "trick_unpack": "They really are relatives (both from Old English *gedæfte*, \"gentle, meek\"), but the meanings split hard, so let the near-spelling remind you deft = clever hands, daft = no sense at all.", "sentences": ["The negotiator's **deft** handling of the walkout kept both delegations at the table.", "She **deftly** flipped the pancake without even looking up from her phone."], "in_the_wild": "The stock film-review phrase **\"a deft touch\"** — critics reach for it whenever a director handles tricky material lightly instead of hammering it.", "etymology": "🚫 **Not related to *deaf***, despite the spelling. But it *is* the same word as **daft**: Old English *gedæfte* meant \"mild, gentle,\" which drifted one way into \"meek → silly\" (*daft*) and the other into \"fitting, skilful\" (*deft*).", "one_line": "Skilful and quick, with a light, effortless touch.", "root": "gedæfte (Old English: gentle, fitting)", "root_family": ["daft"], "confusables": ["daft", "deaf", "dept"], "sense_tags": ["skilful", "dexterous", "nimble", "adroit", "finesse"], "register": "neutral", "connotation": "positive", "groups": [2]}, {"word": "deify", "pos": "v.", "pron": "DEE-uh-fye", "pron_note": "DAY-uh-fye is also heard.", "means": "To **make a god of** something — literally, in the religious sense (Rome deified its dead emperors), or figuratively, to treat a person or thing as **above criticism**.\n\nIn modern use it's almost always the figurative one, and it usually carries a shrug of disapproval. *Admire* is fine, *idolise* is a bit much, **deify** says the worshipper has lost all judgment — the object can now do no wrong. Note the direction: you deify someone *else*. It describes the fans, the biographers, the party faithful, and quietly indicts them.", "trap": "⚠️ **deify ≠ edify.** One letter apart, both about raising someone up — but **edify** = *instruct, improve morally* (an edifying book), while **deify** = *worship*. A sermon edifies the congregation; the congregation deifies the preacher.", "trick_line": "**-fy = make it so: simpl*ify*, pur*ify*, dei*fy* — make a *deity* out of a man.**", "trick_unpack": "The word is just *deity* with the factory suffix bolted on, and the promotion is always undeserved — men don't qualify.", "sentences": ["Later historians **deified** the founder, scrubbing the massacres out of the record and leaving only the marble.", "Stop **deifying** your manager — he's a guy with a spreadsheet, not an oracle."], "in_the_wild": "The Roman Senate really did vote emperors into godhood after death — which is why Vespasian, dying, is said to have cracked: *\"Vae, puto deus fio\"* — \"Dear me, I think I'm becoming a god.\"", "etymology": "Latin **deus** (*god*) + **-ficare** (*to make*, from *facere*). Literally \"god-make.\"\n\n*Deus* is a workhorse root: **deity**, **divine**, **deism**, **deus ex machina** — and **adieu**, which is French *à Dieu*, \"to God.\"", "one_line": "To make a god of; to exalt beyond all criticism.", "root": "deus (god) + -ficare (to make)", "root_family": ["deity", "divine", "deism", "deus ex machina", "adieu", "magnify", "purify"], "confusables": ["edify", "defy", "deity", "reify"], "sense_tags": ["worship", "idolization", "exaltation", "divinity", "uncritical praise"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "demur", "pos": "v. (also n.)", "pron": "dih-MER", "means": "To **raise an objection or hesitate** before agreeing — to balk, politely.\n\nThe force is deliberately low. A person who *refuses* has said no; a person who **demurs** has only signalled reluctance — a raised eyebrow, a \"well, I'm not sure that's quite right,\" a delay dressed as courtesy. It's the vocabulary of boardrooms, courts and diplomacy, where open refusal is rude but silence is consent. Often it's a way of not answering at all: *asked to comment, he demurred.*", "trap": "⚠️ **demur ≠ demure.**\n- **demur** *(dih-MER, verb)* = object mildly, hesitate\n- **demure** *(dih-MYOOR, adj.)* = modest, shy, reserved in manner\n\nOne letter, different word class, different meaning. A demure guest might still demur.", "trick_line": "**demur** ends in **-mur**, as in **murmur** — an objection *murmured*, never shouted.", "trick_unpack": "That murmur captures the strength of it: audible disagreement, well short of a no.", "sentences": ["Counsel **demurred** at the judge's characterisation of the evidence, though he declined to press the point.", "I asked if he'd cover my shift and he **demurred** — didn't say no, just went very quiet about it."], "in_the_wild": "Standard press-conference shorthand: when a reporter asks a politician whether she'll run and the write-up says *\"she demurred,\"* it means she dodged without ever refusing.", "etymology": "Latin **morari** = *\"to delay\"* (from *mora*, a delay), with **de-**. To demur was originally to **hold things up** — which is exactly why it still means hesitating rather than refusing.\n\nSame root: **moratorium** (an official delay), and the legal **demurrer** (a plea that stalls a case).", "one_line": "To object mildly or hesitate rather than flatly refuse.", "root": "morari (to delay), from mora (delay)", "root_family": ["moratorium", "demurrage", "demurrer"], "confusables": ["demure", "deter", "murmur"], "sense_tags": ["objecting", "hesitating", "reluctance", "polite refusal"], "register": "formal", "connotation": "neutral", "groups": [2]}, {"word": "derivative", "pos": "adj. / n.", "pron": "dih-RIV-uh-tiv", "means": "**Adj.:** taken from an existing source rather than invented — and therefore **unoriginal**.\n**Noun:** a thing that comes from something else (in finance, a contract whose value is drawn entirely from an underlying asset).\n\nAs criticism it is cold rather than angry. Calling a novel *derivative* is not calling it stolen or fake — the writer did the work, honestly. The charge is that everything worth noticing in it came from somewhere else, so there is nothing of the maker in it. Reviewers, examiners and critics reach for it precisely because it sounds measured: *plagiarised* is a legal accusation, *hackneyed* is a sneer, **derivative** is a diagnosis.", "trick_line": "**Derivative = *derive* + im*itative*** — it flows from a source, so it has no source of its own.", "trick_unpack": "The insult is not theft but dependence: pull out what it borrowed and nothing is left standing.", "sentences": ["The jury praised her technique but found the collection **derivative**, a careful echo of designers who had shown a decade earlier.", "It's not a bad album, it's just **derivative** — you can name the band behind every track."], "in_the_wild": "A financial **derivative** — an option, a future — has no value of its own; every penny it is worth is drawn from the asset underneath it. That is the adjective in one object.", "etymology": "Latin **dē-** (*away*) + **rīvus** (*stream*) → **dērīvāre**, *to draw water off from a channel*. A derivative work is a ditch led off someone else's river.\n\nSame root: **river**, **derive**, and — pleasingly — **rival**, from *rivales*, two people forced to share one stream.", "one_line": "Unoriginal; drawn wholly from an earlier source.", "root": "rivus (stream) → derivare (to draw off)", "root_family": ["derive", "river", "rival", "riverine"], "confusables": ["derisive", "derogative"], "sense_tags": ["unoriginal", "imitative", "secondhand", "criticism"], "register": "neutral", "connotation": "depends", "groups": [2]}, {"word": "desiccate", "pos": "v.", "pron": "DES-i-kayt", "means": "To dry out **completely** — to remove every trace of moisture, preserving the thing as a husk.\n\n*Dry* is a state; **desiccate** is a process taken to its limit. You don't desiccate a shirt on a radiator — you desiccate fruit, soil, a corpse. The result is shrivelled and rigid, but it *keeps*.\n\nThe figurative use is where the GRE lives: a **desiccated** prose style, a **desiccated** old don, a **desiccated** marriage — technically intact, emotionally drained of all juice. It's a sneer about lifelessness, not about aridity.", "trap": "⚠️ **desiccate ≠ desecrate** (DES-uh-krayt). *Desiccate* = dry to a husk; *desecrate* = violate something sacred. A drought desiccates a field; a vandal desecrates a grave.", "trick_line": "**Desiccate** doesn't dry something **off** — it dries something **out**.", "trick_unpack": "Towels dry you off; a desiccant packet dries the whole box out until nothing living is left in it.", "sentences": ["Centuries in the sealed tomb had **desiccated** the body until the skin lay on the bone like paper.", "Forty years of committee work had **desiccated** him — all procedure, no pulse."], "in_the_wild": "Every shoebox, vitamin bottle and beef-jerky bag contains a little sachet marked **DESICCANT — DO NOT EAT**: silica gel, there to desiccate the air inside.", "etymology": "Latin **siccus** = *\"dry\"*, with **de-** as an intensifier: *dry thoroughly*. That intensifying **de-** is why the word means total drying rather than mere dampness removed.", "one_line": "To dry out completely; to drain of all moisture or vitality.", "root": "siccus (dry)", "root_family": ["desiccant", "siccative"], "confusables": ["desecrate", "dissipate", "dissect"], "sense_tags": ["drying", "preservation", "lifelessness", "aridity"], "register": "formal", "connotation": "depends", "groups": [2]}, {"word": "desultory", "pos": "adj.", "pron": "DESS-uhl-tor-ee", "pron_note": "Stress the FIRST syllable — not \"de-SULT-ory\", which is the usual slip.", "means": "Moving from one thing to another without plan, method, or enthusiasm — **aimless and half-hearted at the same time**.\n\nTwo ingredients have to be present. Random alone isn't enough: *desultory* carries a distinct droop of energy, the sense that nobody much cared whether the thing got finished. A *desultory* conversation drifts and dies; *desultory* revision is twenty minutes here, a different chapter there, nothing retained. It's a quietly damning word — the critic's way of saying an effort was made, technically.", "trap": "**desultory ≠ dilatory.**\n- **desultory** = doing it *aimlessly*, hopping about\n- **dilatory** = doing it *late*, dragging your feet\n\nA dilatory student hasn't started. A desultory one has started four times.", "trick_line": "**De-SULT-ory work gets no re-SULT — you leap off before anything lands.**", "trick_unpack": "Both words hide Latin *salire*, \"to leap,\" and the hidden **result** is exactly what desultory effort never produces.", "sentences": ["The committee's **desultory** inquiry sprawled over three years and concluded nothing.", "We had a **desultory** chat about the weather and then both pretended our phones had buzzed."], "in_the_wild": "Cricket and football writing leans on it constantly — \"a **desultory** afternoon session,\" \"**desultory** passing in midfield\" — meaning the players were technically out there and not really playing.", "etymology": "Latin **desultor** — the circus trick-rider who **leapt from one galloping horse to another** (*de-* \"off\" + *salire* \"to leap\"). Desultory is the mind doing that: never on one horse long enough to ride it anywhere.\n\n*Salire* is a high-yield GRE root: **salient** (leaping out at you), **resilient** (leaping back), **exult**, **insult**, **assail**, **somersault**.", "one_line": "Aimless, half-hearted, hopping from thing to thing.", "root": "salire (to leap)", "root_family": ["salient", "resilient", "exult", "insult", "assail", "result", "somersault", "salmon"], "confusables": ["dilatory", "desolatory", "dissolute", "solitary"], "sense_tags": ["aimless", "unmethodical", "half-hearted", "erratic", "listless"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "diatribe", "pos": "n.", "pron": "DEYE-uh-treyeb", "pron_note": "Three syllables, never \"dye-uh-TRIB.\"", "means": "A **long, bitter, abusive attack in words** — spoken or written — against a person, group, or idea.\n\nTwo things define it: **length** and **venom**. A sharp insult isn't a diatribe; a diatribe goes on, and on, past the point where anyone is still persuaded. The word is almost always used *against* the speaker — calling something a diatribe concedes that it was forceful but denies that it was reasoned. A critic delivers a *critique*; a critic who has lost the room delivers a *diatribe*.", "trick_line": "**Die-a-tribe** — it drags on so long the whole tribe would rather die than hear the end.", "trick_unpack": "The sound hook stores the two things that matter: it's an attack, and it's punishingly long.", "sentences": ["His resignation letter began as a courtesy and ended as a six-page **diatribe** against the board.", "Ask him about parking and you'll get a twenty-minute **diatribe** about the council."], "in_the_wild": "Standard press shorthand: a politician \"launched into a **diatribe** against the media.\" The verb *launch into* is the collocation to memorise — it's how the word almost always arrives.", "etymology": "Greek **dia-** (*through*) + **tribein** (*to rub, wear away*) — a discourse that **rubbed away the hours**. In Greek it meant a learned lecture; English kept the length and dropped the learning.\n\nSame *tribein* gives **tribology**, the science of friction and wear.", "one_line": "A long, bitter, abusive rant against someone or something.", "root": "tribein (to rub, wear away)", "root_family": ["tribology", "diatribe"], "confusables": [], "sense_tags": ["verbal attack", "rant", "denunciation", "invective", "criticism"], "register": "formal", "connotation": "negative", "groups": [2]}, {"word": "didactic", "pos": "adj.", "pron": "dye-DAK-tik", "pron_note": "Also heard as dih-DAK-tik; the stress never moves off DAK.", "means": "Designed to teach — especially to teach a **moral lesson**, and especially when the lesson is the whole point of the thing.\n\nTwo temperatures. Neutral/technical: *didactic poetry*, *didactic materials* — writing or objects whose purpose is instruction. Far more common on the GRE and in criticism: a **complaint**. Call a novel, a film, or a person didactic and you're saying the teaching shows — the story has been bent into a sermon, the character exists to deliver the point, the dinner guest is lecturing rather than talking. **Instructive** praises; **didactic** usually sighs.", "trap": "⚠️ **didactic ≠ dialectic.**\n- **didactic** = *teaching at you* — one voice handing down a lesson\n- **dialectic** = *reasoning through opposition* — thesis meeting counter-thesis, truth emerging from the clash\n\nA lecture is didactic. A Socratic argument is dialectic.", "trick_line": "**DAD-actic** — Dad can't tell a story without tacking a lesson onto the end.", "trick_unpack": "The stressed **DAK** gives you \"dad,\" and the eye-roll you feel is exactly the word's usual tone.", "sentences": ["Her later novels grew increasingly **didactic**, each character reduced to a mouthpiece for a position the author had already settled.", "It's a fun kids' film until the last ten minutes, when it gets **didactic** and starts spelling out the moral."], "etymology": "Greek **didaskein** = *\"to teach\"*, via **didaktikos**, \"skilled at teaching.\"\n\nWorth the space because of its cousin: **autodidact** — *self* + *teach* — a person who taught themselves, no school, no master. Same root, and a GRE word in its own right.", "one_line": "Meant to teach — and usually too obvious about it.", "root": "didaskein (to teach)", "root_family": ["autodidact", "didactics", "didacticism"], "confusables": ["dialectic", "pedantic", "dogmatic"], "sense_tags": ["teaching", "moralizing", "preachy", "instructive"], "register": "formal", "connotation": "depends", "groups": [1]}, {"word": "diffident", "pos": "adj.", "pron": "DIF-i-duhnt", "pron_note": "Stress falls on the first syllable — never *di-FID-ent*.", "means": "Lacking confidence in yourself; hanging back, hesitant to speak up or claim what you could.\n\n*Modest* is a virtue and *shy* is a temperament, but **diffident** points at the cause: a person who doesn't trust their own ability, so they under-claim. The word usually comes from an observer, with a tinge of pity — the diffident candidate had the best answers and gave them apologetically. It's a quiet, well-mannered failure to assert, never rudeness or coldness.", "trap": "**diffident ≠ indifferent.**\n- **diffident** = self-doubting, *wants* to matter but won't push\n- **indifferent** = couldn't care less\n\nA diffident student blushes when called on; an indifferent one shrugs.", "trick_line": "**Con**fident = *with* trust. **Dif**fident = trust *away*. Same **fid**, flipped prefix.", "trick_unpack": "Diffident isn't humility, it's confidence with the trust drained out — the ability is there, the belief isn't.", "sentences": ["Brilliant on paper and **diffident** in person, he let a junior colleague present the findings he had spent two years assembling.", "She's not unfriendly, just **diffident** — you have to ask her twice before she'll tell you she wrote the whole thing."], "etymology": "Latin **dis-** (*away*) + **fīdere** (*to trust*) — trust withheld, now withheld from yourself.\n\nThat **fid** root is a GRE goldmine: **confident** (with trust), **fidelity**, **fiduciary** (trusted with money), **infidel**, **perfidy** (treachery), **bona fide** (in good faith) — and **Fido**, the classic dog name, meaning \"I trust.\"\n\n🚫 **Not related to *indifferent***, which is *in- + differre*, \"to make no difference.\"", "one_line": "Shy and self-doubting; hesitant to assert yourself.", "root": "fīdere (to trust)", "root_family": ["confident", "fidelity", "fiduciary", "infidel", "perfidy", "bona fide", "affidavit"], "confusables": ["indifferent", "dissident", "deferential", "confident"], "sense_tags": ["shy", "self-doubting", "unassertive", "reticent", "timid"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "dilatory", "pos": "adj.", "pron": "DIL-uh-tor-ee", "pron_note": "Not \"dye-LAY-tuh-ree\" — the stress is on the first syllable, and it has nothing to do with *dilate*.", "means": "Slow to act; inclined to delay — and, said of an action, **done in order to cause delay**.\n\nCalling someone **slow** describes a pace. Calling them **dilatory** files a complaint. The word carries an edge of blame: the delay was avoidable, and quite possibly the point. That's why it lives in formal registers — memos, court filings, school reports, letters from a solicitor. A friend who takes three weeks to reply is *terrible at texting*; a contractor who takes three weeks to reply is **dilatory**, and you're building a case.", "trick_line": "**Dilly-dally** → **dilatory**: the same dragging of feet, in a suit and tie.", "trick_unpack": "Both start *dil-* and both mean stalling, but *dilly-dally* is a parent nagging a child while *dilatory* is what goes in the formal complaint.", "sentences": ["The tribunal found the company's disclosure **dilatory**, noting that documents requested in March had arrived, incomplete, in November.", "Stop being so **dilatory** about the visa — the flights are in six weeks."], "in_the_wild": "A live term of art in law and parliament: a judge or a Speaker can rule a motion **dilatory** — filed for no purpose but to burn the clock. It's the official word for stalling, which is exactly the flavour it keeps in ordinary prose.", "etymology": "Latin **differre** = *\"to put off\"* (dis- \"apart\" + ferre \"to carry\"), whose participle stem is **dilat-**. Delay is literally *carrying the thing away from now*. The same *-lat-* stem runs through **relate, translate, collate, elate, legislate** — all things carried.\n\n🚫 **Not *dilate*.** That's *dilatare*, from *latus* meaning \"wide\" — pupils dilate, cervixes dilate. Identical-looking stem, unrelated root: one is *carried*, the other is *broad*.", "one_line": "Slow to act; delaying, often on purpose.", "root": "differre, dilatus (to postpone, carry apart)", "root_family": ["relate", "translate", "collate", "elate", "legislate", "defer"], "confusables": ["dilate", "desultory", "dilettante"], "sense_tags": ["delay", "procrastination", "stalling", "slowness"], "register": "formal", "connotation": "negative", "groups": [3]}, {"word": "disparate", "pos": "adj.", "pron": "DIS-puh-ruht", "pron_note": "Also heard as dis-PA-ruht; the first-syllable stress is standard.", "means": "Different in **kind**, not just in degree — so unlike that the things resist being compared or lumped together.\n\nTwo shirts of different colours are *different*; a shirt, a tax code and a whale are *disparate*. The word is usually doing one of two jobs: insisting that a comparison is illegitimate (\"these are disparate cases\"), or flagging that a collection is a grab-bag of mismatched parts (\"**disparate** sources\", \"**disparate** systems\"). Formal and analytical — it's the vocabulary of reports and arguments, not of conversation.", "trap": "⚠️ **disparate ≠ desperate.** *Desperate* (DES-puh-ruht) is hopeless, frantic, willing to do anything. Nearly the same sound, opposite half of the dictionary — the GRE will happily exploit the eye-slip.", "trick_line": "**dis-PAR-ate = not on *par*.** Different things you can still rank; disparate things you can't even score on the same card.", "trick_unpack": "The hidden **par** (\"equal\") is the whole point: disparate items aren't merely unequal, they're not on comparable terms at all.", "sentences": ["The committee's report stitched together **disparate** strands of evidence — census data, coroners' records, a century of parish registers — into a single argument.", "Our team is five people from five **disparate** backgrounds, and somehow the standups still work."], "in_the_wild": "**\"Disparate impact\"** — the standard term in employment and housing law for a neutral-looking rule that lands unequally on different groups. If you've read a hiring-policy or compliance document, you've met the word there.", "etymology": "Sits in the family of Latin **par** = *\"equal\"* — the **par** of *parity*, *par for the course*, *peer*, and *disparity* (from **dispar**, \"unequal\"). Lock that root in and you get several GRE words at once.", "one_line": "So different in kind as to be incomparable.", "root": "par (equal)", "root_family": ["parity", "disparity", "peer", "compare", "par", "nonpareil", "umpire"], "confusables": ["desperate", "disparage", "disparity", "separate"], "sense_tags": ["different", "dissimilar", "incomparable", "heterogeneous", "mismatched"], "register": "formal", "connotation": "neutral", "groups": [4]}, {"word": "disseminate", "pos": "v.", "pron": "dih-SEM-ih-nayt", "means": "To **spread something widely** — information, ideas, findings, sometimes spores or disease — outward from one source to many recipients.\n\nThe shape of the word is one-to-many and *deliberate*. You don't disseminate to a friend; you disseminate to a field, a public, a population. Compare the neighbours: *circulate* passes a thing around inside a closed group, *divulge* lets out one secret, *broadcast* is the plain-English version — **disseminate** is the institutional register, the verb of ministries, journals, and press offices. It says nothing about whether the content is true, only that it went far.", "trap": "⚠️ **disseminate ≠ dissemble.**\n- **disseminate** = *scatter it outward* (spread widely)\n- **dissemble** = *cover it up* (hide your real feelings or motives)\n\nOpposite directions: one publishes, one conceals.", "trick_line": "**dis-SEMIN-ate** — the same SEMIN as *seminar* and *semen*: **seed**, flung outward.", "trick_unpack": "One sower, a whole field — which is why you disseminate findings to thousands rather than to one person.", "sentences": ["The committee's mandate was to **disseminate** the trial results to clinicians before the paper cleared peer review.", "Someone screenshotted the memo and it got **disseminated** across half the company by lunchtime."], "in_the_wild": "Research grant applications routinely require a **\\\"dissemination plan\\\"** — a section spelling out how you'll push the results out to the world once the money's spent.", "etymology": "Latin *
